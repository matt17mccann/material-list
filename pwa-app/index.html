                        </td>
                        <td style={{ textAlign: "center", padding: "7px 6px", fontWeight: 700, color: "#6DB344" }}>{g.quantity}</td>
                      </tr>
                    ))}
                    {extras.map((m, j) => (
                      <tr key={"e" + j} style={{ borderTop: "1px solid #e4ede0", background: "#fff8ef" }}>
                        <td style={{ padding: "7px 10px", fontSize: 10, fontWeight: 700, color: "#e67e22", textTransform: "uppercase" }}>Extra</td>
                        <td style={{ padding: "7px 10px", fontWeight: 500 }}>{m.description}</td>
                        <td style={{ textAlign: "center", padding: "7px 6px", fontWeight: 600 }}>{m.qty || 1}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })}

          {/* Extra boards ordered whole */}
          {(extraBoards || []).length > 0 && (() => {
            const ebGroups = groupExtraBoards(extraBoards, STOCK_LABELS);
            return (
              <div style={{ marginTop: 14, border: "1px solid #E8E8E8", borderRadius: 6, overflow: "hidden" }}>
                <div style={{ padding: "8px 12px", background: "rgba(109,179,68,0.10)", fontSize: 13, fontWeight: 700, color: "#1a1a1a" }}>Extra Boards</div>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ background: "#F5F5F4" }}>
                      <th style={{ ...th, flex: "0 0 150px", width: 150 }}>Category</th>
                      <th style={th}>Board / Material</th>
                      <th style={thC}>Qty</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ebGroups.map((g, j) => (
                      <tr key={j} style={{ borderTop: "1px solid #e4ede0", background: j % 2 ? "#fafcf8" : "#fff" }}>
                        <td style={{ padding: "7px 10px", fontSize: 11, fontWeight: 600, color: "#777", textTransform: "uppercase", letterSpacing: 0.4, width: 150 }}>{g.category}</td>
                        <td style={{ padding: "7px 10px", fontWeight: 600 }}>{g.description}</td>
                        <td style={{ textAlign: "center", padding: "7px 6px", fontWeight: 700, color: "#6DB344" }}>{g.quantity}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })()}

          {/* Whole-job extra material */}
          {jobExtras.length > 0 && (
            <div style={{ marginTop: 14, border: "1px solid #E8E8E8", borderRadius: 6, overflow: "hidden" }}>
              <div style={{ padding: "8px 12px", background: "rgba(109,179,68,0.10)", fontSize: 13, fontWeight: 700, color: "#1a1a1a" }}>Other Material</div>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ background: "#F5F5F4" }}>
                    <th style={{ ...th, flex: "0 0 150px", width: 150 }}>Category</th>
                    <th style={th}>Board / Material</th>
                    <th style={thC}>Qty</th>
                  </tr>
                </thead>
                <tbody>
                  {jobExtras.map((m, i) => (
                    <tr key={i} style={{ borderTop: "1px solid #e4ede0", background: i % 2 ? "#fafcf8" : "#fff" }}>
                      <td style={{ padding: "7px 10px", fontSize: 11, fontWeight: 600, color: "#777", textTransform: "uppercase", letterSpacing: 0.4, width: 150 }}>{m.category || "Other"}</td>
                      <td style={{ padding: "7px 10px", fontWeight: 600 }}>{m.description}</td>
                      <td style={{ textAlign: "center", padding: "7px 6px", fontWeight: 700, color: "#6DB344" }}>{m.quantity || 1}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── REPORT VIEW ───
    // Fill a saved job's info with defaults for any missing fields (module-level so
    // both the editor and the report/export paths share one definition).
    function mergedJobDefaults(savedJob) {
      const merged = {
        customerName: "", address: "", poNumber: "", techMeasurer: "",
        date: new Date().toISOString().split("T")[0],
        prefinishNotes: "", pfWindowsNeeded: false, pfWindowsList: "",
        extraMaterials: [], extraBoards: [], bayMaterials: [],
        customTrimMode: false, optimizePerUnit: true, showFinishOnChecklist: false,
        ...savedJob,
      };
      // Map legacy extra-board profile labels forward, the same way units are
      // normalized on load — both job loaders go through here.
      merged.extraBoards = (merged.extraBoards || []).map(normalizeExtraBoardProfile);
      return merged;
    }

    function ReportView({ job, jobId, units, catalog, offsets, globalTrim, reportType, submitted, allComplete, isResubmit, savedJobs, onSubmit, onBack, onEdit }) {
      const reportRef = useRef();
      const [activeReport, setActiveReport] = useState(reportType || "checklist");

      const [pdfBusy, setPdfBusy] = useState(false);
      const [exportBusy, setExportBusy] = useState(null); // {done,total} while exporting all
      // Aliases so the PDF builders can be reused for any job (Export All), not
      // just the currently-loaded one. Default to the loaded job/units.
      const propJob = job, propUnits = units;

      // Build a text-based PDF with a real text layer (editable, searchable,
      // small file size). Reproduces the Checklist + Prefinish + Bay Material
      // + Board Summary sections using jsPDF's native text/drawing APIs.
      const generatePDFDoc = async (ovJob, ovUnits, mode = "checklist") => {
        const job = ovJob || propJob;
        const units = ovUnits || propUnits;
        const isDetailed = mode === "detailed";
        const pdf = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

        // Embed Roboto so Adobe Acrobat can edit the text. PDF's standard
        // fonts (Helvetica/Times) are referenced by name only — Acrobat
        // refuses to edit text when fonts aren't embedded.
        const ttfB64 = async (path) => {
          const buf = await fetch(path).then(r => r.arrayBuffer());
          const bytes = new Uint8Array(buf);
          let binary = "";
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          }
          return btoa(binary);
        };
        const [regB64, boldB64] = await Promise.all([
          ttfB64("./Roboto-Regular.ttf"),
          ttfB64("./Roboto-Bold.ttf"),
        ]);
        pdf.addFileToVFS("Roboto-Regular.ttf", regB64);
        pdf.addFileToVFS("Roboto-Bold.ttf", boldB64);
        pdf.addFont("Roboto-Regular.ttf", "Roboto", "normal");
        pdf.addFont("Roboto-Bold.ttf", "Roboto", "bold");

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const margin = 8;
        const contentW = pageW - margin * 2;
        const bottomLimit = pageH - margin - 4;
        let y = margin;

        const GREEN = [109, 179, 68];
        const DARK = [26, 26, 26];
        const LIGHT_BG = [245, 245, 244];
        const ZEBRA = [250, 252, 248];
        const BORDER = [221, 221, 221];
        const BORDER_BB = [187, 187, 187];
        const TEXT_DARK = [26, 26, 26];
        const TEXT_LABEL = [85, 85, 85];
        const TEXT_MUTE = [153, 153, 153];
        const NOTE_ORANGE_BG = [253, 240, 227];
        const NOTE_ORANGE = [230, 126, 34];
        const NOTE_RED = [192, 57, 43];
        const PREFINISH_BG = [218, 232, 207];
        const GREEN_BORDER = [197, 224, 180];
        const CHECKBOX_BORDER = [204, 204, 204];

        const CAT_W = 40;
        const QTY_W = 28;
        const CB_W = 10;
        const DESC_W = contentW - CAT_W - QTY_W - CB_W;

        const ensure = (needed) => {
          if (y + needed > bottomLimit) {
            pdf.addPage();
            y = margin;
            return true;
          }
          return false;
        };

        // ── HEADER ──
        const renderHeader = () => {
          try {
            // Drawn at its true 406×151 aspect ratio — a mismatched box stretches
            // the raster and reads as blurry/soft even at high source resolution.
            const logoW = 46, logoH = logoW * 151 / 406;
            pdf.addImage(LOGO_FULL, "PNG", margin, y, logoW, logoH);
          } catch (_) {}

          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(12);
          pdf.setTextColor(...TEXT_DARK);
          pdf.text(job.customerName || "—", pageW - margin, y + 4.5, { align: "right" });
          pdf.setFont("Roboto", "normal");
          pdf.setFontSize(10);
          pdf.setTextColor(...TEXT_LABEL);
          pdf.text(job.address || "—", pageW - margin, y + 9, { align: "right" });
          pdf.text("PO# " + (job.poNumber || "—"), pageW - margin, y + 13.5, { align: "right" });
          pdf.setFontSize(9);
          pdf.text(`Tech: ${job.techMeasurer || "—"}  |  ${job.date || ""}`, pageW - margin, y + 18, { align: "right" });

          pdf.setFontSize(8);
          pdf.setTextColor(...TEXT_MUTE);
          pdf.text(isDetailed ? "DETAILED CUT LIST" : "MATERIALS CHECKLIST", margin, y + 19);
          pdf.setFontSize(9);
          pdf.text(`${units.length} unit${units.length !== 1 ? "s" : ""}`, margin, y + 23);

          y += 26;

          pdf.setDrawColor(...GREEN);
          pdf.setLineWidth(0.8);
          pdf.line(margin, y, pageW - margin, y);
          pdf.setLineWidth(0.2);
          y += 6;
        };

        const renderChecklistBar = () => {
          pdf.setFillColor(...DARK);
          pdf.rect(margin, y, contentW, 7, "F");
          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(9);
          pdf.setTextColor(255, 255, 255);
          pdf.text("CATEGORY", margin + 3, y + 4.8);
          pdf.text("DESCRIPTION", margin + CAT_W + 3, y + 4.8);
          pdf.text("QUANTITY", margin + CAT_W + DESC_W + QTY_W - 3, y + 4.8, { align: "right" });
          y += 7;
        };

        const renderChecklistIntro = () => {
          pdf.setFont("Roboto", "normal");
          pdf.setFontSize(9);
          pdf.setTextColor(...TEXT_MUTE);
          pdf.text("This list includes the sum total of all materials for the entire job.", margin + 3, y + 4.5);
          y += 7;
          pdf.setDrawColor(...BORDER);
          pdf.line(margin, y, pageW - margin, y);
          y += 1;
        };

        const renderChecklistRow = (row) => {
          if (row === null) {
            ensure(4);
            pdf.setFillColor(...DARK);
            pdf.rect(margin, y + 2, contentW, 0.6, "F");
            y += 4;
            return;
          }

          if (row.isNote) {
            const rowH = 9;
            if (ensure(rowH)) renderChecklistBar();
            pdf.setFillColor(...NOTE_ORANGE_BG);
            pdf.rect(margin, y, contentW, rowH, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(8);
            pdf.setTextColor(...NOTE_ORANGE);
            pdf.text("NOTE", margin + 3, y + 5.6);
            pdf.setFontSize(10);
            pdf.setTextColor(...NOTE_RED);
            const descLines = pdf.splitTextToSize(row.description, DESC_W + QTY_W + CB_W - 4);
            pdf.text(descLines[0], margin + CAT_W + 3, y + 5.6);
            pdf.setDrawColor(...NOTE_ORANGE);
            pdf.line(margin, y + rowH, pageW - margin, y + rowH);
            y += rowH;
            return;
          }

          const descLines = pdf.splitTextToSize(row.description, DESC_W - 4);
          const rowH = Math.max(9, descLines.length * 5 + 4);
          if (ensure(rowH)) renderChecklistBar();

          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(8.5);
          pdf.setTextColor(...TEXT_LABEL);
          pdf.text(row.category, margin + 3, y + 5.8);

          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(11);
          pdf.setTextColor(...TEXT_DARK);
          descLines.forEach((ln, i) => {
            pdf.text(ln, margin + CAT_W + 3, y + 5.8 + i * 5);
          });

          pdf.setFont("Roboto", "normal");
          pdf.setFontSize(10);
          pdf.setTextColor(...TEXT_DARK);
          const qtyText = row.length ? `${row.quantity} x ${row.length}` : String(row.quantity);
          pdf.text(qtyText, margin + CAT_W + DESC_W + QTY_W - 3, y + 5.8, { align: "right" });

          const cbX = margin + CAT_W + DESC_W + QTY_W + CB_W / 2 - 2.5;
          pdf.setDrawColor(...CHECKBOX_BORDER);
          pdf.setLineWidth(0.4);
          pdf.rect(cbX, y + rowH / 2 - 2.5, 5, 5, "S");
          pdf.setLineWidth(0.2);

          pdf.setDrawColor(...BORDER);
          pdf.line(margin, y + rowH, pageW - margin, y + rowH);
          y += rowH;
        };

        const renderBlackHeaderBar = (label) => {
          pdf.setFillColor(...DARK);
          pdf.rect(margin, y, contentW, 7, "F");
          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(9);
          pdf.setTextColor(255, 255, 255);
          pdf.text(label, margin + 3, y + 4.8);
          y += 7;
        };

        const renderPrefinish = (noteRows) => {
          const hasPrefinish = !!(job.prefinishNotes || job.pfWindowsNeeded);
          if (!hasPrefinish && noteRows.length === 0) return;

          y += 6;

          if (hasPrefinish) {
            ensure(20);
            renderBlackHeaderBar("PREFINISH / WAREHOUSE NOTES");

            if (job.prefinishNotes) {
              const lines = pdf.splitTextToSize(job.prefinishNotes, contentW - 6);
              const rowH = lines.length * 5 + 4;
              ensure(rowH);
              pdf.setFillColor(...PREFINISH_BG);
              pdf.rect(margin, y, contentW, rowH, "F");
              pdf.setFont("Roboto", "bold");
              pdf.setFontSize(10);
              pdf.setTextColor(...TEXT_DARK);
              lines.forEach((ln, i) => pdf.text(ln, margin + 3, y + 5 + i * 5));
              pdf.setDrawColor(...GREEN_BORDER);
              pdf.line(margin, y + rowH, pageW - margin, y + rowH);
              y += rowH;
            }

            const wLine = `${job.pfWindowsNeeded ? "Yes" : "No"}${
              job.pfWindowsNeeded && job.pfWindowsList ? " — " + job.pfWindowsList : ""
            }`;
            const wLines = pdf.splitTextToSize(wLine, contentW - 60);
            const wRowH = Math.max(7, wLines.length * 5 + 2);
            ensure(wRowH);
            pdf.setFillColor(255, 255, 255);
            pdf.rect(margin, y, contentW, wRowH, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(9.5);
            pdf.setTextColor(...TEXT_DARK);
            pdf.text("Windows needing PF:", margin + 3, y + 5);
            pdf.setFont("Roboto", "normal");
            wLines.forEach((ln, i) => {
              pdf.text(ln, margin + 48, y + 5 + i * 5);
            });
            pdf.setDrawColor(...BORDER);
            pdf.line(margin, y + wRowH, pageW - margin, y + wRowH);
            y += wRowH;
          }

          noteRows.forEach((note) => {
            const lines = pdf.splitTextToSize(note.description, contentW - 6);
            const rowH = lines.length * 4.5 + 3;
            ensure(rowH);
            pdf.setFillColor(...NOTE_ORANGE_BG);
            pdf.rect(margin, y, contentW, rowH, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(9);
            pdf.setTextColor(...NOTE_RED);
            lines.forEach((ln, i) => pdf.text(ln, margin + 3, y + 4.5 + i * 4.5));
            pdf.setDrawColor(...NOTE_ORANGE);
            pdf.line(margin, y + rowH, pageW - margin, y + rowH);
            y += rowH;
          });
        };

        const renderBayMaterial = () => {
          const items = (job.bayMaterials || []).filter(i => i.description);
          if (items.length === 0) return;
          y += 6;
          ensure(12);
          renderBlackHeaderBar("BAY MATERIAL");

          items.forEach((item) => {
            ensure(7);
            pdf.setFillColor(255, 255, 255);
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(10);
            pdf.setTextColor(...TEXT_DARK);
            pdf.text(item.description, margin + 3, y + 4.8);
            pdf.setFont("Roboto", "normal");
            pdf.text(String(item.quantity), pageW - margin - 3, y + 4.8, { align: "right" });
            pdf.setDrawColor(...BORDER);
            pdf.line(margin, y + 7, pageW - margin, y + 7);
            y += 7;
          });
        };

        const renderBoardSummary = () => {
          const result = optimizeBoards(units, catalog, job.optimizePerUnit, offsets.boardWaste);
          const summary = { ...result.summary };
          let totalBoards = result.boards.length;
          (job.extraBoards || []).forEach(eb => { const len = parseInt(eb.stockLength) || 120; summary[len] = (summary[len] || 0) + 1; totalBoards++; });
          const STOCK_LABELS = result.STOCK_LABELS;

          const unitKey = u => u.label + (u.location ? " (" + u.location + ")" : "");
          const jobSharedByUnit = job.optimizePerUnit ? null : jobBoardGroupsByUnit(units, catalog, offsets.boardWaste, false);
          const perUnit = (units || []).filter(u => !isStormDoor(u))
            .map(u => ({ u, groups: job.optimizePerUnit ? unitBoardGroups(u, catalog, offsets.boardWaste, false) : (jobSharedByUnit[unitKey(u)] || []), extras: (u.manualMaterials || []).filter(m => m.description) }))
            .filter(x => x.groups.length || x.extras.length);
          const jobExtras = (job.extraMaterials || []).filter(m => m.description);
          if (perUnit.length === 0 && (job.extraBoards || []).length === 0 && jobExtras.length === 0) return;
          const EXTRA_ORANGE = [230, 126, 34];

          pdf.addPage();
          y = margin;

          pdf.setFillColor(...GREEN);
          pdf.rect(margin, y, contentW, 9, "F");
          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(12);
          pdf.setTextColor(255, 255, 255);
          pdf.text("Job Summary — By Unit", margin + 3, y + 6.2);
          y += 9;

          pdf.setFillColor(...LIGHT_BG);
          pdf.rect(margin, y, contentW, 8, "F");
          pdf.setFont("Roboto", "bold");
          pdf.setFontSize(10);
          pdf.setTextColor(...TEXT_DARK);
          let tx = margin + 3;
          const writeTot = (lbl, val) => {
            pdf.setFont("Roboto", "bold");
            pdf.text(lbl, tx, y + 5.4);
            const lw = pdf.getTextWidth(lbl);
            pdf.setFont("Roboto", "normal");
            const v = " " + String(val);
            pdf.text(v, tx + lw, y + 5.4);
            tx += lw + pdf.getTextWidth(v) + 6;
          };
          writeTot("Total Boards:", totalBoards);
          Object.entries(summary).sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([len, count]) => {
            writeTot(STOCK_LABELS[len] + ":", count);
          });
          y += 10;

          // Per-unit boards/material table columns (not cuts) — cat/qty are fixed,
          // desc soaks up whatever width the margin leaves so a narrower margin
          // widens this column instead of leaving blank space on the right.
          const catW = 42, qtyW = 28;
          const cols = [
            { key: "cat", label: "Category", w: catW, align: "left" },
            { key: "desc", label: "Board / Material", w: contentW - catW - qtyW, align: "left" },
            { key: "qty", label: "Qty", w: qtyW, align: "center" },
          ];
          const drawMatHeader = () => {
            pdf.setFillColor(245, 245, 244);
            pdf.rect(margin, y, contentW, 6.6, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(9);
            pdf.setTextColor(...GREEN);
            let cx = margin;
            cols.forEach(c => { const tx2 = c.align === "center" ? cx + c.w / 2 : cx + 2; pdf.text(c.label, tx2, y + 4.4, { align: c.align }); cx += c.w; });
            y += 6.6;
          };
          const drawUnitHeader = (u) => {
            const w = combineMeasurement(u.widthWhole, u.widthFrac), h = combineMeasurement(u.heightWhole, u.heightFrac), jd = combineMeasurement(u.jambDepthWhole, u.jambDepthFrac);
            pdf.setFillColor(238, 245, 231);
            pdf.rect(margin, y, contentW, 7.8, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(10.5);
            pdf.setTextColor(...TEXT_DARK);
            pdf.text((u.label || "Unit") + (u.location ? "  —  " + u.location : ""), margin + 3, y + 5.3);
            pdf.setFont("Roboto", "normal");
            pdf.setFontSize(8.5);
            pdf.setTextColor(...TEXT_MUTE);
            const meta = u.unitType + (u.unitType === "Window" ? " • " + u.trimStyle : "") + "    " + toFraction(w) + '"×' + toFraction(h) + '"' + (jd > 0 ? "    JD " + toFraction(jd) + '"' : "") + "    " + u.species + (u.finish ? "    " + u.finish : "");
            pdf.text(meta, pageW - margin - 3, y + 5.3, { align: "right" });
            y += 7.8;
          };

          // Shared renderer for a titled group table (Extra Boards / Other Material) —
          // uses the same cols/header/zebra styling as the per-unit tables so the
          // Qty column lines up down the page.
          const drawGroupTable = (title, rows) => {
            if (!rows.length) return;
            if (y + 18 > bottomLimit) { pdf.addPage(); y = margin; }
            pdf.setFillColor(238, 245, 231);
            pdf.rect(margin, y, contentW, 7.8, "F");
            pdf.setFont("Roboto", "bold");
            pdf.setFontSize(10);
            pdf.setTextColor(...TEXT_DARK);
            pdf.text(title, margin + 3, y + 5.3);
            y += 7.8;
            drawMatHeader();
            rows.forEach((r, ri) => {
              const descLines = pdf.splitTextToSize(r.desc, cols[1].w - 2);
              const rowH = Math.max(7, descLines.length * 3.8 + 2.4);
              if (y + rowH > bottomLimit) { pdf.addPage(); y = margin; drawMatHeader(); }
              if (ri % 2 === 1) { pdf.setFillColor(...ZEBRA); pdf.rect(margin, y, contentW, rowH, "F"); }
              let cx = margin;
              cols.forEach(c => {
                const tx2 = c.align === "center" ? cx + c.w / 2 : cx + 2;
                if (c.key === "qty") { pdf.setFont("Roboto", "bold"); pdf.setFontSize(9.5); pdf.setTextColor(...GREEN); }
                else if (c.key === "cat") { pdf.setFont("Roboto", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT_MUTE); }
                else { pdf.setFont("Roboto", "bold"); pdf.setFontSize(9.5); pdf.setTextColor(...TEXT_DARK); }
                if (c.key === "desc") { descLines.forEach((ln, li) => pdf.text(ln, tx2, y + 4.6 + li * 3.8)); }
                else { pdf.text(r[c.key], tx2, y + 4.6, { align: c.align }); }
                cx += c.w;
              });
              pdf.setDrawColor(...BORDER);
              pdf.line(margin, y + rowH, pageW - margin, y + rowH);
              y += rowH;
            });
            y += 4;
          };

          perUnit.forEach(({ u, groups, extras }) => {
            if (y + 22 > bottomLimit) { pdf.addPage(); y = margin; }
            drawUnitHeader(u);
            drawMatHeader();
            const rows = [
              ...groups.map(g => ({ cat: g.category, desc: g.description + (g.sharedWith && g.sharedWith.length ? "  (also used on " + g.sharedWith.join(", ") + ")" : ""), qty: String(g.quantity), extra: false })),
              ...extras.map(m => ({ cat: "EXTRA", desc: m.description, qty: String(m.qty || 1), extra: true })),
            ];
            rows.forEach((r, ri) => {
              const descLines = pdf.splitTextToSize(r.desc, cols[1].w - 2);
              const rowH = Math.max(7, descLines.length * 3.8 + 2.4);
              if (y + rowH > bottomLimit) { pdf.addPage(); y = margin; drawUnitHeader(u); drawMatHeader(); }
              if (ri % 2 === 1) { pdf.setFillColor(...ZEBRA); pdf.rect(margin, y, contentW, rowH, "F"); }
              let cx = margin;
              cols.forEach(c => {
                const tx2 = c.align === "center" ? cx + c.w / 2 : cx + 2;
                if (c.key === "qty") { pdf.setFont("Roboto", "bold"); pdf.setFontSize(9.5); pdf.setTextColor(...GREEN); }
                else if (c.key === "cat") { pdf.setFont("Roboto", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...(r.extra ? EXTRA_ORANGE : TEXT_MUTE)); }
                else { pdf.setFont("Roboto", r.extra ? "normal" : "bold"); pdf.setFontSize(9.5); pdf.setTextColor(...(r.extra ? EXTRA_ORANGE : TEXT_DARK)); }
                if (c.key === "desc") { descLines.forEach((ln, li) => pdf.text(ln, tx2, y + 4.6 + li * 3.8)); }
                else { pdf.text(r[c.key], tx2, y + 4.6, { align: c.align }); }
                cx += c.w;
              });
              pdf.setDrawColor(...BORDER);
              pdf.line(margin, y + rowH, pageW - margin, y + rowH);
              y += rowH;
            });
            y += 4;
          });

          // Extra boards ordered whole — grouped + counted (each is entered as its own
          // card with no qty field, so identical entries need to be tallied)
          drawGroupTable("Extra Boards", groupExtraBoards(job.extraBoards, STOCK_LABELS).map(g => ({ cat: g.category, desc: g.description, qty: String(g.quantity) })));

          // Whole-job extra material
          drawGroupTable("Other Material", jobExtras.map(m => ({ cat: (m.category || "Other").toUpperCase(), desc: m.description, qty: String(m.quantity || 1) })));
        };

        // ── DETAILED CUT LIST — per-unit cuts plus the boards they come out of.
        // No Job Summary here by design; the boards are shown inline per unit.
        const renderDetailedList = () => {
          const dCols = [
            { key: "mat", label: "Material", w: 104, align: "left" },
            { key: "qty", label: "Qty", w: 18, align: "center" },
            { key: "len", label: "Length", w: 32, align: "center" },
            { key: "thk", label: "Thickness", w: contentW - 154, align: "center" },
          ];
          const unitKeyOf = u => u.label + (u.location ? " (" + u.location + ")" : "");
          const sharedByUnit = job.optimizePerUnit ? null : jobBoardGroupsByUnit(units, catalog, offsets.boardWaste, false);
          const boardsFor = u => job.optimizePerUnit
            ? unitBoardGroups(u, catalog, offsets.boardWaste, false)
            : (sharedByUnit[unitKeyOf(u)] || []);

          const drawCutsHeader = () => {
            pdf.setFillColor(240, 240, 239);
            pdf.rect(margin, y, contentW, 6.6, "F");
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(9); pdf.setTextColor(...TEXT_DARK);
            let cx = margin;
            dCols.forEach(c => { const tx = c.align === "center" ? cx + c.w / 2 : cx + 2; pdf.text(c.label, tx, y + 4.5, { align: c.align }); cx += c.w; });
            y += 6.6;
          };

          units.forEach((unit) => {
            const excluded = isStormDoor(unit) || !isUnitComplete(unit);
            const mats = excluded ? [] : calcMaterials(unit, catalog);
            const manual = (unit.manualMaterials || []).filter(mm => mm.description);
            const bg = excluded ? [] : boardsFor(unit);
            const hasJD = unit.trimStyle !== "Stops" && unit.jambDepthWhole;

            ensure(32);
            pdf.setFillColor(...GREEN);
            pdf.rect(margin, y, contentW, 7.8, "F");
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(10.5); pdf.setTextColor(255, 255, 255);
            pdf.text((unit.label || "Unit") + (unit.location ? "  —  " + unit.location : ""), margin + 3, y + 5.3);
            pdf.setFont("Roboto", "normal"); pdf.setFontSize(9);
            pdf.text(unit.unitType + (unit.unitType === "Window" ? " • " + unit.trimStyle + (unit.trimStyle === "Stops" ? " (" + (unit.stopCoverage || "All Sides") + ")" : "") : ""), pageW - margin - 3, y + 5.3, { align: "right" });
            y += 7.8;

            pdf.setFillColor(...LIGHT_BG);
            pdf.rect(margin, y, contentW, 6.6, "F");
            pdf.setFont("Roboto", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT_DARK);
            const meta = [
              "W: " + toFraction(combineMeasurement(unit.widthWhole, unit.widthFrac)) + '"',
              "H: " + toFraction(combineMeasurement(unit.heightWhole, unit.heightFrac)) + '"',
              hasJD ? "JD: " + toFraction(combineMeasurement(unit.jambDepthWhole, unit.jambDepthFrac)) + '"' : null,
              "Species: " + unit.species,
              "Profile: " + (unit.trimStyle === "Stops" ? (unit.stopProfile || "1x4 Stop") : unit.casingProfile),
              unit.finish ? "Finish: " + unit.finish : null,
            ].filter(Boolean).join("     ");
            pdf.text(pdf.splitTextToSize(meta, contentW - 6)[0], margin + 3, y + 4.5);
            y += 6.6;

            drawCutsHeader();

            if (excluded) {
              ensure(7);
              pdf.setFont("Roboto", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT_MUTE);
              pdf.text(isStormDoor(unit) ? "Storm door — no trim materials" : "Incomplete unit — not included in material list", margin + 3, y + 4.6);
              pdf.setDrawColor(...BORDER); pdf.line(margin, y + 7, pageW - margin, y + 7);
              y += 11;
              return;
            }

            const rows = [
              ...mats.map(m => {
                let thk = "—";
                if (m.thickness != null) thk = toFraction(m.thickness) + '"';
                else if (m.category === "Jamb") thk = (m.name.includes("Sill") || m.name.includes("Stool")) ? '3/4"' : '5/8"';
                return { mat: (m.species ? m.species + " " : "") + m.name, qty: String(m.qty), len: toFraction(m.length) + '"', thk, manual: false };
              }),
              ...manual.map(mm => ({ mat: mm.description, qty: String(mm.qty || 1), len: mm.length ? toFraction(mm.length) + '"' : "—", thk: "—", manual: true })),
            ];

            rows.forEach((r, ri) => {
              const matLines = pdf.splitTextToSize(r.mat + (r.manual ? "  (manual)" : ""), dCols[0].w - 3);
              const rowH = Math.max(7, matLines.length * 3.8 + 2.4);
              if (y + rowH > bottomLimit) { pdf.addPage(); y = margin; drawCutsHeader(); }
              if (r.manual) { pdf.setFillColor(253, 246, 232); pdf.rect(margin, y, contentW, rowH, "F"); }
              else if (ri % 2 === 1) { pdf.setFillColor(...ZEBRA); pdf.rect(margin, y, contentW, rowH, "F"); }
              let cx = margin;
              dCols.forEach(c => {
                const tx = c.align === "center" ? cx + c.w / 2 : cx + 2;
                pdf.setFontSize(9);
                if (c.key === "len") { pdf.setFont("Roboto", "bold"); pdf.setTextColor(...(r.manual ? [184, 115, 51] : GREEN)); }
                else if (c.key === "qty") { pdf.setFont("Roboto", "bold"); pdf.setTextColor(...TEXT_DARK); }
                else { pdf.setFont("Roboto", "normal"); pdf.setTextColor(...TEXT_DARK); }
                if (c.key === "mat") matLines.forEach((ln, li) => pdf.text(ln, tx, y + 4.6 + li * 3.8));
                else pdf.text(r[c.key], tx, y + 4.6, { align: c.align });
                cx += c.w;
              });
              pdf.setDrawColor(...BORDER); pdf.line(margin, y + rowH, pageW - margin, y + rowH);
              y += rowH;
            });

            if (bg.length) {
              ensure(15);
              pdf.setFillColor(238, 245, 231);
              pdf.rect(margin, y, contentW, 6.6, "F");
              pdf.setFont("Roboto", "bold"); pdf.setFontSize(9); pdf.setTextColor(...TEXT_DARK);
              pdf.text("Boards to Pull", margin + 3, y + 4.5);
              pdf.text("Qty", pageW - margin - 12, y + 4.5, { align: "center" });
              y += 6.6;
              bg.forEach((g, k) => {
                const label = g.category + "   " + g.description + (g.sharedWith && g.sharedWith.length ? "   (also used on " + g.sharedWith.join(", ") + ")" : "");
                const lines = pdf.splitTextToSize(label, contentW - 30);
                const rowH = Math.max(7, lines.length * 3.8 + 2.4);
                if (y + rowH > bottomLimit) { pdf.addPage(); y = margin; }
                if (k % 2 === 1) { pdf.setFillColor(...ZEBRA); pdf.rect(margin, y, contentW, rowH, "F"); }
                pdf.setFont("Roboto", "normal"); pdf.setFontSize(9); pdf.setTextColor(...TEXT_DARK);
                lines.forEach((ln, li) => pdf.text(ln, margin + 3, y + 4.6 + li * 3.8));
                pdf.setFont("Roboto", "bold"); pdf.setTextColor(...GREEN);
                pdf.text(String(g.quantity), pageW - margin - 12, y + 4.6, { align: "center" });
                pdf.setDrawColor(...BORDER); pdf.line(margin, y + rowH, pageW - margin, y + rowH);
                y += rowH;
              });
            }
            y += 5;
          });
        };

        // Extra materials as their own table (the checklist folds these into its
        // rows instead; the detailed list needs them called out separately).
        const renderExtraMaterialsTable = () => {
          const items = mergedExtraMaterials(job.extraMaterials, units).filter(i => i.description);
          if (!items.length) return;
          y += 6;
          ensure(14);
          renderBlackHeaderBar("EXTRA MATERIALS");
          items.forEach((item) => {
            ensure(7);
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(10); pdf.setTextColor(...TEXT_DARK);
            pdf.text(pdf.splitTextToSize(item.description, contentW - 24)[0], margin + 3, y + 4.8);
            pdf.setFont("Roboto", "normal");
            pdf.text(String(item.quantity), pageW - margin - 3, y + 4.8, { align: "right" });
            pdf.setDrawColor(...BORDER); pdf.line(margin, y + 7, pageW - margin, y + 7);
            y += 7;
          });
        };

        // ── BOARD CUT LIST — board-by-board cutting reference (OptiCutter style).
        // Starts its own page and goes last on the detailed list.
        const renderBoardCutList = () => {
          const result = optimizeBoards(units, catalog, job.optimizePerUnit, offsets.boardWaste);
          const boards = [...result.boards];
          const summary = { ...result.summary };
          const STOCK_LABELS = result.STOCK_LABELS;
          const ebNotes = (job.extraBoards || []).map(eb => eb.note || "");
          normalizeExtraBoards(job.extraBoards, units, catalog).forEach((b, i) => {
            boards.push({ ...b, cuts: [], remaining: 0, extraNote: ebNotes[i] });
            summary[b.stockLength] = (summary[b.stockLength] || 0) + 1;
          });
          if (!boards.length) return;

          pdf.addPage();
          y = margin;

          pdf.setFillColor(...GREEN);
          pdf.rect(margin, y, contentW, 9, "F");
          pdf.setFont("Roboto", "bold"); pdf.setFontSize(12); pdf.setTextColor(255, 255, 255);
          pdf.text("Board Cut List", margin + 3, y + 6.2);
          pdf.setFont("Roboto", "normal"); pdf.setFontSize(8);
          pdf.text("every board, and the cuts that come off it", pageW - margin - 3, y + 6.2, { align: "right" });
          y += 9;

          pdf.setFillColor(...LIGHT_BG);
          pdf.rect(margin, y, contentW, 8, "F");
          pdf.setFontSize(10); pdf.setTextColor(...TEXT_DARK);
          let tx = margin + 3;
          const writeTot = (lbl, val) => {
            pdf.setFont("Roboto", "bold"); pdf.text(lbl, tx, y + 5.4);
            const lw = pdf.getTextWidth(lbl);
            pdf.setFont("Roboto", "normal");
            const v = " " + String(val);
            pdf.text(v, tx + lw, y + 5.4);
            tx += lw + pdf.getTextWidth(v) + 6;
          };
          writeTot("Total Boards:", boards.length);
          Object.entries(summary).sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([len, count]) => writeTot(STOCK_LABELS[len] + ":", count));
          y += 10;

          const bCols = [
            { key: "num", label: "Board #", w: 16, align: "left" },
            { key: "stock", label: "Stock", w: 15, align: "center" },
            { key: "type", label: "Type / Size", w: 46, align: "left" },
            { key: "species", label: "Species", w: 20, align: "left" },
            { key: "finish", label: "Finish", w: 26, align: "left" },
            { key: "cuts", label: "Cuts from this board", w: contentW - 155, align: "left" },
            { key: "waste", label: "Waste", w: 16, align: "center" },
          ];
          const drawBcHeader = () => {
            pdf.setFillColor(240, 240, 239);
            pdf.rect(margin, y, contentW, 6.6, "F");
            pdf.setDrawColor(...BORDER_BB); pdf.setLineWidth(0.5);
            pdf.line(margin, y + 6.6, pageW - margin, y + 6.6); pdf.setLineWidth(0.2);
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT_DARK);
            let cx = margin;
            bCols.forEach(c => { const t2 = c.align === "center" ? cx + c.w / 2 : cx + 2; pdf.text(c.label, t2, y + 4.5, { align: c.align }); cx += c.w; });
            y += 6.6;
          };
          drawBcHeader();

          boards.forEach((board, i) => {
            const cutsStr = (board.cuts || []).map(c => `${toFraction(c.rawLength)}" — ${c.source}`).join(", ") || "—";
            const cutsCol = bCols.find(c => c.key === "cuts");
            const cutsLines = pdf.splitTextToSize(cutsStr, cutsCol.w - 2);
            const typeStr = `${board.species} ${board.materialType}`
              + (board.jambStock ? ` (${fixBasswoodThickness(board.species, board.jambStock.label)})` : "")
              + (board.profile ? ` — ${fixBasswoodThickness(board.species, board.profile)}` : "")
              + (board.isExtra ? ` (Extra${board.extraNote ? " — " + board.extraNote : ""})` : "");
            const typeLines = pdf.splitTextToSize(typeStr, bCols[2].w - 2);
            const rowH = Math.max(6.5, Math.max(cutsLines.length, typeLines.length) * 3.6 + 2.2);
            if (y + rowH > bottomLimit) { pdf.addPage(); y = margin; drawBcHeader(); }
            if (i % 2 === 1) { pdf.setFillColor(...ZEBRA); pdf.rect(margin, y, contentW, rowH, "F"); }

            const vals = {
              num: String(i + 1),
              stock: STOCK_LABELS[board.stockLength],
              species: board.species,
              finish: board.finish || "",
              waste: toFraction(board.remaining || 0) + '"',
            };
            let cx = margin;
            bCols.forEach(c => {
              const t2 = c.align === "center" ? cx + c.w / 2 : cx + 2;
              pdf.setFontSize(8.5);
              if (c.key === "stock") { pdf.setFont("Roboto", "bold"); pdf.setTextColor(...GREEN); }
              else if (c.key === "num") { pdf.setFont("Roboto", "bold"); pdf.setTextColor(...TEXT_DARK); }
              else if (c.key === "waste") { pdf.setFont("Roboto", "normal"); pdf.setTextColor(...((board.remaining || 0) > 24 ? NOTE_RED : TEXT_MUTE)); }
              else { pdf.setFont("Roboto", "normal"); pdf.setTextColor(...TEXT_DARK); }

              if (c.key === "cuts") { pdf.setFontSize(8); cutsLines.forEach((ln, li) => pdf.text(ln, t2, y + 4.3 + li * 3.6)); }
              else if (c.key === "type") { typeLines.forEach((ln, li) => pdf.text(ln, t2, y + 4.3 + li * 3.6)); }
              else if (c.align === "left") { pdf.text(pdf.splitTextToSize(vals[c.key], c.w - 2)[0], t2, y + 4.3); }
              else { pdf.text(vals[c.key], t2, y + 4.3, { align: c.align }); }
              cx += c.w;
            });
            pdf.setDrawColor(...BORDER);
            pdf.line(margin, y + rowH, pageW - margin, y + rowH);
            y += rowH;
          });
        };

        const writeFooters = () => {
          const totalPages = pdf.internal.getNumberOfPages();
          for (let p = 1; p <= totalPages; p++) {
            pdf.setPage(p);
            pdf.setFont("Roboto", "normal");
            pdf.setFontSize(8);
            pdf.setTextColor(...TEXT_MUTE);
            const text = `Renewal by Andersen — ${job.address || ""}  •  ${new Date().toLocaleDateString()}  •  Page ${p} of ${totalPages}`;
            pdf.text(text, pageW / 2, pageH - 6, { align: "center" });
          }
        };

        renderHeader();

        if (isDetailed) {
          renderDetailedList();
          renderPrefinish(buildChecklist(job, units).extraRows.filter(r => r.isNote));
          renderExtraMaterialsTable();
          renderBayMaterial();
          renderBoardCutList();
        } else {
          renderChecklistBar();
          renderChecklistIntro();

          const { extraRows, boardRows } = buildChecklist(job, units);
          const noteRows = extraRows.filter(r => r.isNote);
          const materialRows = extraRows.filter(r => !r.isNote);
          const allRows = [...materialRows, ...(materialRows.length > 0 && boardRows.length ? [null] : []), ...boardRows];
          allRows.forEach(renderChecklistRow);

          renderPrefinish(noteRows);
          renderBayMaterial();
          renderBoardSummary();
        }
        writeFooters();

        return pdf;
      };

      const pdfFilename = (ovJob, mode = "checklist") => {
        const job = ovJob || propJob;
        const lastName = (job.customerName || "").split(" ").pop() || "Job";
        const po = job.poNumber ? ` (${job.poNumber})` : "";
        const kind = mode === "detailed" ? "Detailed Cut List" : "Material List";
        return `${lastName} ${kind}${po}.pdf`;
      };

      // On (re)submit, push the material-list PDF to the joblist app. Keyed by jobId
      // so resubmits overwrite the stored PDF. Deduped per session via joblistPushed
      // (cleared on each submit in saveJob). No-ops gracefully until configured.
      useEffect(() => {
        if (!submitted || !jobId || joblistPushed.has(jobId)) return;
        joblistPushed.add(jobId);
        let cancelled = false;
        (async () => {
          try {
            // Skip PDF generation entirely until the joblist is wired up.
            if (!(await isJoblistConfigured())) return;
            const pdf = await generatePDFDoc();
            const dataUri = pdf.output("datauristring");
            const pdfBase64 = dataUri.includes(",") ? dataUri.split(",")[1] : dataUri;
            if (cancelled) return;
            const result = await pushPdfToJoblist({
              jobId,
              customerName: job.customerName || "",
              poNumber: job.poNumber || "",
              fileName: pdfFilename(),
              savedAt: new Date().toISOString(),
              pdfBase64,
              // Linear-feet cost data for the joblist Costs tab (not on the PDF).
              materialLf: buildMaterialLf(units, job, catalog, offsets.boardWaste),
            });
            // If the push didn't go through, allow a retry on the next submit.
            if (!result || result.pushed === false) joblistPushed.delete(jobId);
          } catch (err) {
            console.error("Joblist PDF push failed:", err);
            joblistPushed.delete(jobId);
          }
        })();
        return () => { cancelled = true; };
      }, [submitted, jobId]);

      const handlePDF = async () => {
        if (pdfBusy) return;
        setPdfBusy(true);
        try {
          // Print/Save follow whichever tab is showing, so the Detailed tab no
          // longer silently saves the Checklist.
          const pdf = await generatePDFDoc(null, null, activeReport);
          pdf.save(pdfFilename(null, activeReport));
        } catch (err) {
          console.error("Save PDF failed:", err);
          alert("Failed to generate PDF: " + (err && err.message ? err.message : String(err)));
        } finally {
          setPdfBusy(false);
        }
      };

      // Export a PDF for EVERY saved + submitted job into a folder the user picks.
      // Runs each job through the same normalization applySavedJob does so the
      // output matches opening the job and hitting Save PDF. Used to snapshot the
      // whole book before/after an offsets change and diff the two folders.
      const exportAllPDFs = async () => {
        if (exportBusy) return;
        const jobs = (savedJobs || []);
        if (jobs.length === 0) { alert("No saved jobs to export."); return; }
        const normJob = sj => mergedJobDefaults(sj.job || {});
        const normUnits = sj => (sj.units || []).map(u => ({
          ...u,
          casingProfile: u.casingProfile ? normalizeCasingProfile(u.casingProfile) : u.casingProfile,
          customTrimPieces: (u.customTrimPieces || []).map(ctp => ({ ...ctp, profile: ctp.profile ? normalizeCasingProfile(ctp.profile) : ctp.profile })),
        }));
        // Sort submitted first, then by customer, for tidy folders
        const ordered = jobs.slice().sort((a, b) => (b.submitted ? 1 : 0) - (a.submitted ? 1 : 0) || (a.job?.customerName || "").localeCompare(b.job?.customerName || ""));

        let dirHandle = null;
        const canPick = typeof window.showDirectoryPicker === "function";
        if (canPick) {
          try { dirHandle = await window.showDirectoryPicker({ mode: "readwrite" }); }
          catch (e) { return; } // user cancelled the folder picker
        } else {
          alert("Your browser can't pick a folder, so each PDF will download to your Downloads folder instead. Move them into a Desktop folder afterward.");
        }

        setExportBusy({ done: 0, total: ordered.length });
        const usedNames = new Set();
        try {
          for (let i = 0; i < ordered.length; i++) {
            const sj = ordered[i];
            const j = normJob(sj), u = normUnits(sj);
            let name = (sj.submitted ? "SUBMITTED - " : "DRAFT - ") + pdfFilename(j);
            // Guard against duplicate customer/PO collisions
            if (usedNames.has(name)) name = name.replace(/\.pdf$/, "") + " #" + (i + 1) + ".pdf";
            usedNames.add(name);
            const pdf = await generatePDFDoc(j, u);
            if (dirHandle) {
              const fh = await dirHandle.getFileHandle(name, { create: true });
              const w = await fh.createWritable();
              await w.write(pdf.output("blob"));
              await w.close();
            } else {
              pdf.save(name);
            }
            setExportBusy({ done: i + 1, total: ordered.length });
          }
          if (dirHandle) alert("Exported " + ordered.length + " PDFs to the folder you picked.");
        } catch (err) {
          console.error("Export all failed:", err);
          alert("Export failed: " + (err && err.message ? err.message : String(err)));
        } finally {
          setExportBusy(null);
        }
      };

      const handlePrint = async () => {
        if (pdfBusy) return;
        setPdfBusy(true);
        try {
          const pdf = await generatePDFDoc(null, null, activeReport);
          const blob = pdf.output("blob");
          const url = URL.createObjectURL(blob);
          const win = window.open(url);
          if (win) {
            win.onload = () => { win.print(); };
          } else {
            // window.open blocked (common on iOS PWA) — fall back to download
            pdf.save(pdfFilename(null, activeReport));
          }
        } catch (err) {
          console.error("Print failed:", err);
          alert("Failed to generate PDF: " + (err && err.message ? err.message : String(err)));
        } finally {
          setPdfBusy(false);
        }
      };

      const handleEmail = async () => {
        if (pdfBusy) return;
        setPdfBusy(true);
        try {
          const pdf = await generatePDFDoc(null, null, activeReport);
          const filename = pdfFilename(null, activeReport);
          const pdfBlob = pdf.output("blob");

          const lastName = (job.customerName || "").split(" ").pop() || "Job";
          const emailSubject = `${lastName} ${job.poNumber || ""} ${activeReport === "detailed" ? "Detailed Cut List" : "Material List"}`.trim();

          if (navigator.share && navigator.canShare) {
            const file = new File([pdfBlob], filename, { type: "application/pdf" });
            if (navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  title: emailSubject,
                  text: emailSubject,
                  files: [file],
                });
                return;
              } catch (err) {
                if (err.name === "AbortError") return;
                // Fall through to mailto fallback
              }
            }
          }

          const subject = encodeURIComponent(emailSubject);
          const body = encodeURIComponent(`Hi,\n\nPlease find the material cut list for:\n\nCustomer: ${job.customerName || ""}\nAddress: ${job.address || ""}\nDate: ${job.date || ""}\nPO #: ${job.poNumber || ""}\nMeasured by: ${job.techMeasurer || ""}\n\nThe PDF is attached separately.\n\nThanks`);
          // Download PDF first, then open email. Use window.location so iOS PWA
          // actually navigates — detached <a>.click() is unreliable on Safari.
          pdf.save(filename);
          setTimeout(() => {
            window.location.href = `mailto:nina@northlandrba.com?subject=${subject}&body=${body}`;
          }, 500);
        } catch (err) {
          console.error("Share failed:", err);
          alert("Failed to share: " + (err && err.message ? err.message : String(err)));
        } finally {
          setPdfBusy(false);
        }
      };

      // ─── Aggregate materials for checklist view ───
      const buildChecklist = (ovJob, ovUnits) => {
        const job = ovJob || propJob;
        const units = ovUnits || propUnits;
        const result = optimizeBoards(units, catalog, job.optimizePerUnit, offsets.boardWaste);
        const boards = [...result.boards];
        const STOCK_LABELS = result.STOCK_LABELS;

        // Append extra boards to the board list for aggregation
        boards.push(...normalizeExtraBoards(job.extraBoards, units, catalog));

        const rows = [];

        // Customer supplying notes — list which units
        const casingUnits = units.filter(u => u.casingProfile === "Customer Supplying").map(u => u.label || "?");
        const jambUnits = units.filter(u => u.jambMaterial === "Customer Supplying").map(u => u.label || "?");
        if (casingUnits.length > 0) {
          const unitList = casingUnits.length === units.length ? "All Units" : ("Units: " + casingUnits.join(", "));
          rows.push({ category: "NOTE", description: `CUSTOMER SUPPLYING CASING — ${unitList}`, quantity: "", isNote: true });
        }
        if (jambUnits.length > 0) {
          const unitList = jambUnits.length === units.length ? "All Units" : ("Units: " + jambUnits.join(", "));
          rows.push({ category: "NOTE", description: `CUSTOMER SUPPLYING JAMBS — ${unitList}`, quantity: "", isNote: true });
        }

        // Pieces longer than the longest available stock — the optimizer splices
        // them across boards so counts aren't short, but that's rarely acceptable
        // for trim, so call it out (usually means a longer length needs stocking).
        const oversize = {};
        (result.warnings || []).forEach(w => {
          const txt = `PIECE LONGER THAN AVAILABLE STOCK — ${w.source} ${w.cutName} ${toFraction(w.length)}" — longest ${w.material} on hand is ${STOCK_LABELS[w.maxStock]}; split across ${w.pieces} boards`;
          oversize[txt] = (oversize[txt] || 0) + 1;
        });
        Object.entries(oversize).forEach(([txt, n]) => {
          rows.push({ category: "NOTE", description: n > 1 ? `${txt} (×${n})` : txt, quantity: "", isNote: true });
        });

        // Coil / extra materials first — unit-attached manual materials are
        // summed across all units so the job total reflects real quantities
        mergedExtraMaterials(job.extraMaterials, units).forEach(item => {
          const cat = (item.category || "OTHER").toUpperCase();
          rows.push({ category: cat, description: item.description, quantity: item.quantity });
        });

        // Thresholds — pre-made products, listed as line items
        const thresholdCounts = {};
        units.forEach(unit => {
          if (isStormDoor(unit)) return; // storm doors need no trim
          if (!isUnitComplete(unit)) return;
          if (unit.unitType === "Window") return;
          const desc = unit.thresholdSpecies;
          if (!desc || desc === "None") return;
          thresholdCounts[desc] = (thresholdCounts[desc] || 0) + 1;
        });
        Object.entries(thresholdCounts).forEach(([desc, qty]) => {
          rows.push({ category: "THRESHOLD", description: desc, quantity: qty });
        });

        // Aggregate boards into checklist line items (shared with the Board Summary preview)
        const sortedGroups = aggregateBoardGroups(boards, STOCK_LABELS, job.showFinishOnChecklist);

        // Insert a blank separator between coils and boards if both exist
        const hasExtras = rows.length > 0;

        // Insert separator between category groups (jamb → threshold → casing)
        const withSeparators = [];
        let lastCategory = null;
        sortedGroups.forEach(row => {
          if (lastCategory && lastCategory !== row.category) {
            withSeparators.push(null); // separator line
          }
          withSeparators.push(row);
          lastCategory = row.category;
        });

        return { extraRows: rows, boardRows: withSeparators, hasExtras };
      };

      // ─── Report header (shared by both report types) ───
      const ReportHeader = ({ subtitle }) => (
        <div data-pdf-section="header" style={{ borderBottom: "3px solid #6DB344", paddingBottom: 16, marginBottom: 28 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <img src={LOGO_FULL} alt="Renewal by Andersen" style={{ height: 50, marginBottom: 4 }} />
              <div style={{ fontSize: 11, color: "#888", letterSpacing: 2, textTransform: "uppercase" }}>{subtitle}</div>
              <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>{units.length} unit{units.length !== 1 ? "s" : ""}</div>
            </div>
            <div style={{ textAlign: "right", fontSize: 14, color: "#555", lineHeight: 1.6 }}>
              <div style={{ fontWeight: 700, color: "#1a1a1a" }}>{job.customerName || "—"}</div>
              <div>{job.address || "—"}</div>
              <div>PO# {job.poNumber || "—"}</div>
              <div style={{ fontSize: 13 }}>Tech: {job.techMeasurer || "—"}  |  {job.date}</div>
            </div>
          </div>
        </div>
      );

      // ─── CHECKLIST REPORT (summary — like the warehouse PDF) ───
      const ChecklistReport = () => {
        const { extraRows, boardRows, hasExtras } = buildChecklist();
        const noteRows = extraRows.filter(r => r.isNote);
        const materialRows = extraRows.filter(r => !r.isNote);
        const allRows = [...materialRows, ...(materialRows.length > 0 && boardRows.length ? [null] : []), ...boardRows];

        return (
          <div style={{ padding: "32px 28px", maxWidth: 900, margin: "0 auto", fontFamily: "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" }}>
            <ReportHeader subtitle="Materials Checklist" />

            <div data-pdf-section="checklist">
              {/* Column headers */}
              <div style={{ display: "flex", padding: "8px 14px", background: "#1a1a1a", color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>

                <div style={{ flex: 1 }}>Description</div>

                      <div style={{ flex: 1, fontSize: 13, fontWeight: 700, color: "#c0392b" }}>{row.description}</div>

                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", padding: "14px 14px", borderBottom: "1px solid #ddd" }}>

            </div>

            {/* Prefinishing Notes */}
            {(job.prefinishNotes || job.pfWindowsNeeded) && (
              <div data-pdf-section="prefinish" style={{ marginTop: 28, pageBreakInside: "avoid" }}>

                {job.prefinishNotes && (

                    {job.prefinishNotes}
                  </div>

                <div style={{ padding: "10px 14px", fontSize: 14, borderBottom: "1px solid #ddd" }}>

                </div>
                {noteRows.map((note, ni) => (

            {/* Customer supplying notes — shown even without prefinish section */}

                    {note.description}
                  </div>

            {/* Bay Material */}

            <div data-pdf-section="footer" style={{ marginTop: 32, paddingTop: 16, borderTop: "1px solid #ddd", fontSize: 11, color: "#999", display: "flex", justifyContent: "space-between" }}>
              <span>Materials Checklist | {job.address || ""}</span>
              <span>Page 1 / 1</span>
            </div>
          </div>
        );
      };

      // ─── DETAILED REPORT (per-unit cut list — existing style) ───
      const DetailedReport = () => {
        const extraMats = mergedExtraMaterials(job.extraMaterials, units);
        // Actual boards backing each unit's cuts. In whole-job mode one board can
        // serve several units, so attribute them the same way the Job Summary does

        const unitKeyOf = u => u.label + (u.location ? " (" + u.location + ")" : "");
        const sharedByUnit = job.optimizePerUnit ? null : jobBoardGroupsByUnit(units, catalog, offsets.boardWaste, false);

        <div style={{ padding: "32px 28px", maxWidth: 900, margin: "0 auto", fontFamily: "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" }}>
          <ReportHeader subtitle="Detailed Cut List" />

          {units.map((unit, i) => {
            // Match the board optimizer's gates: storm doors get no trim, and
            // incomplete units would render garbage lengths from missing dims
            const excluded = isStormDoor(unit) || !isUnitComplete(unit);
            const mats = excluded ? [] : calcMaterials(unit, catalog);
            const hasJD = unit.trimStyle !== "Stops" && unit.jambDepthWhole;
            return (
              <div key={unit.id} data-pdf-section={"unit-" + i} style={{ marginBottom: 24, pageBreakInside: "avoid" }}>

                  <span style={{ fontWeight: 400, opacity: 0.85 }}>
                    {unit.unitType}{unit.unitType === "Window" ? ` • ${unit.trimStyle}${unit.trimStyle === "Stops" ? ` (${unit.stopCoverage || "All Sides"})` : ""}` : ""}
                  </span>

                  <span><strong>W:</strong> {toFraction(combineMeasurement(unit.widthWhole, unit.widthFrac))}"</span>
                  <span><strong>H:</strong> {toFraction(combineMeasurement(unit.heightWhole, unit.heightFrac))}"</span>
                  {hasJD && <span><strong>JD:</strong> {toFraction(combineMeasurement(unit.jambDepthWhole, unit.jambDepthFrac))}"</span>}
                  <span><strong>Species:</strong> {unit.species}</span>
                  <span><strong>Profile:</strong> {unit.trimStyle === "Stops" ? (unit.stopProfile || "1x4 Stop") : unit.casingProfile}</span>
                  <span><strong>Finish:</strong> {unit.finish}</span>
                </div>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ background: "#F0F0EF" }}>
                      <th style={{ textAlign: "left", padding: "7px 12px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Material</th>
                      <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Qty</th>
                      <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Length</th>
                      <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Thickness</th>
                    </tr>
                  </thead>
                  <tbody>
                    {excluded && (
                      <tr>
                        <td colSpan={4} style={{ padding: "8px 12px", fontStyle: "italic", color: "#999" }}>
                          {isStormDoor(unit) ? "Storm door — no trim materials" : "Incomplete unit — not included in material list"}
                        </td>
                      </tr>
                    )}
                    {mats.map((m, j) => {
                      let thicknessDisplay = "—";
                      if (m.thickness != null) {
                        thicknessDisplay = toFraction(m.thickness) + '"';
                      } else if (m.category === "Jamb") {
                        thicknessDisplay = m.name.includes("Sill") || m.name.includes("Stool") ? '3/4"' : '5/8"';
                      }
                      return (
                        <tr key={j} style={{ borderBottom: "1px solid #ddd", background: j % 2 === 0 ? "#fff" : "#fafbfa" }}>
                          <td style={{ padding: "6px 12px" }}>{m.species ? `${m.species} ${m.name}` : m.name}</td>
                          <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 600 }}>{m.qty}</td>
                          <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 700, color: "#6DB344" }}>{toFraction(m.length)}"</td>
                          <td style={{ textAlign: "center", padding: "6px 8px" }}>{thicknessDisplay}</td>
                        </tr>
                      );
                    })}
                    {(unit.manualMaterials || []).filter(mm => mm.description).map((mm, j) => (
                      <tr key={"manual-" + j} style={{ borderBottom: "1px solid #ddd", background: "#fdf6e8" }}>
                        <td style={{ padding: "6px 12px" }}>{mm.description} <span style={{ fontSize: 10, color: "#b87333", fontWeight: 700 }}>MANUAL</span></td>
                        <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 600 }}>{mm.qty}</td>
                        <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 700, color: "#b87333" }}>{mm.length ? toFraction(mm.length) + '"' : "—"}</td>
                        <td style={{ textAlign: "center", padding: "6px 8px" }}>—</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                {/* Actual boards the cuts above come out of */}
                {!excluded && (() => {
                  const bg = boardsFor(unit);
                  if (!bg.length) return null;
                  return (
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                      <thead>
                        <tr style={{ background: "#EEF5E7" }}>

                          <th style={{ textAlign: "center", padding: "7px 8px", borderTop: "2px solid #bbb", borderBottom: "1px solid #ccc", fontWeight: 700, width: 80 }}>Qty</th>

              Prefinish / Warehouse Notes
            </div>
            {job.prefinishNotes && (
              <div style={{ padding: "12px 14px", fontSize: 15, fontWeight: 700, background: "rgba(109,179,68,0.25)", borderBottom: "1px solid #c5e0b4", color: "#1C1C1C" }}>

                  <span> — {job.pfWindowsList}</span>

          {extraMats.length > 0 && (
            <div data-pdf-section="extra-materials" style={{ marginTop: 24, pageBreakInside: "avoid" }}>

                Extra Materials

              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ background: "#F0F0EF" }}>
                    <th style={{ textAlign: "left", padding: "7px 12px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Description</th>
                    <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700, width: 80 }}>Qty</th>

                <tbody>

          {(job.bayMaterials || []).length > 0 && (
            <div data-pdf-section="bay-material" style={{ marginTop: 24, pageBreakInside: "avoid" }}>

                Bay Material
              </div>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ background: "#F0F0EF" }}>
                    <th style={{ textAlign: "left", padding: "7px 12px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Description</th>
                    <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700, width: 80 }}>Qty</th>
                  </tr>
                </thead>
                <tbody>
                  {job.bayMaterials.filter(item => item.description).map((item, j) => (
                    <tr key={j} style={{ borderBottom: "1px solid #ddd", background: j % 2 === 0 ? "#fff" : "#fafbfa" }}>
                      <td style={{ padding: "6px 12px" }}>{item.description}</td>
                      <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 600 }}>{item.quantity}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Job Summary intentionally lives only on the Checklist — the detailed
              list already shows each unit's boards inline, above. The board-by-board
              cut list goes last, as the shop's cutting reference. */}
          <div data-pdf-section="board-cut-list">
            <BoardCutList units={units} catalog={catalog} optimizePerUnit={job.optimizePerUnit} boardWaste={offsets.boardWaste} extraBoards={job.extraBoards} />

          <div data-pdf-section="footer" style={{ marginTop: 32, paddingTop: 16, borderTop: "1px solid #ddd", fontSize: 11, color: "#999", textAlign: "center" }}>
            Renewal by Andersen — Detailed Cut List • {new Date().toLocaleDateString()}
          </div>
        </div>
        );
      };

      // ─── COMBINED REPORT — always used for PDF output ───
      // Rendered hidden off-screen. Contains: Checklist (page 1) → hard page
      // break → per-unit Cut List → hard page break → Board Purchase Summary.
      const FullReport = () => {
        const { extraRows, boardRows } = buildChecklist();
        const noteRows = extraRows.filter(r => r.isNote);
        const materialRows = extraRows.filter(r => !r.isNote);
        const allRows = [...materialRows, ...(materialRows.length > 0 && boardRows.length ? [null] : []), ...boardRows];

        return (
          <div ref={reportRef} style={{ padding: "32px 28px", width: 900, fontFamily: "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif", background: "#fff", color: "#1a1a1a" }}>
            <ReportHeader subtitle="Materials Checklist" />

            {/* ━━━ CHECKLIST ━━━ */}
            <div data-pdf-section="checklist">
              <div style={{ display: "flex", padding: "8px 14px", background: "#1a1a1a", color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>
                <div style={{ flex: "0 0 160px" }}>Category</div>
                <div style={{ flex: 1 }}>Description</div>
                <div style={{ flex: "0 0 120px", textAlign: "right" }}>Quantity</div>

              {allRows.map((row, i) => {

                    <div key={i} style={{ display: "flex", alignItems: "center", padding: "10px 14px", background: "rgba(230,126,34,0.10)", borderBottom: "1px solid #e67e22" }}>
