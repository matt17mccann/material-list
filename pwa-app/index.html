            <input type="number" step="0.0625" value={value} onChange={e => onChange(e.target.value)}
              style={{ width: 80, padding: "6px 8px", border: "1px solid #ddd", borderRadius: 6, fontSize: 15, fontWeight: 700, textAlign: "center" }} />
          </div>
        );
        const OffsetCard = ({ title, section, fields }) => (
          <div style={{ background: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 12, border: "1px solid #E8E8E8" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1.5, textTransform: "uppercase" }}>{title}</div>
              <button onClick={() => resetSection(section)} style={{ background: "none", border: "none", fontSize: 11, color: "#999", cursor: "pointer", textDecoration: "underline" }}>Reset defaults</button>
            </div>
            {fields.map(f => <OffsetRow key={f.key} label={f.label} desc={f.desc} value={offsets[section]?.[f.key] ?? 0} onChange={v => updateOffset(section, f.key, v)} />)}
          </div>
        );
        return (
          <div style={{ minHeight: "100vh", background: "#F5F5F4", padding: "0 0 40px 0" }}>
            <div style={{
              position: "sticky", top: 0, zIndex: 100, background: "#1C1C1C",
              padding: "max(env(safe-area-inset-top, 0px), 50px) 16px 12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.25)"
            }}>
              <button onClick={() => setView("home")} style={{ background: "none", border: "none", color: "#fff", fontSize: 16, cursor: "pointer", fontWeight: 600}}>← Home</button>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Offsets</div>
              <div style={{ width: 70 }} />
            </div>
            <div style={{ maxWidth: 900, margin: "0 auto", padding: "16px 16px 0" }}>
              <div style={{ fontSize: 13, color: "#888", marginBottom: 16, padding: "0 4px" }}>These values are added to Width (W), Height (H), or Jamb Depth (JD) when calculating cut lengths. Negative = subtract.</div>

              <OffsetCard title="Windows — Picture Frame" section="window_pf" fields={[
                { key: "sideJamb_length", label: "Side Jamb Length", desc: "H + value" },
                { key: "topBottomJamb_length", label: "Top/Bottom Jamb Length", desc: "W + value" },
                { key: "jamb_width", label: "Jamb Width", desc: "JD + value" },
                { key: "sideCasing_length", label: "Side Casing Length", desc: "H + 2x casing width + value" },
                { key: "topBottomCasing_length", label: "Top/Bottom Casing Length", desc: "W + 2x casing width + value" },
              ]} />
              <OffsetCard title="Windows — Traditional" section="window_trad" fields={[
                { key: "sideJamb_length", label: "Side Jamb Length", desc: "H + value" },
                { key: "headJamb_length", label: "Head Jamb Length", desc: "W + value" },
                { key: "jamb_width", label: "Jamb Width", desc: "JD + value" },
                { key: "stool_length", label: "Sill/Stool Length", desc: "W + 2x casing width + 2 + value" },
                { key: "stool_width_extra", label: "Stool Width Extra", desc: "Added to jamb width" },
                { key: "sideCasing_length", label: "Side Casing Length", desc: "H + 1x casing width + value" },
                { key: "headCasing_length", label: "Head Casing Length", desc: "W + 2x casing width + value" },
                { key: "apron_length", label: "Apron Length", desc: "W + 2x casing width + value" },
              ]} />
              <OffsetCard title="Entry Doors" section="entry_door" fields={[
                { key: "sideCasing_length", label: "Side Casing Length", desc: "H + 1x casing width + value" },
                { key: "headCasing_length", label: "Head Casing Length", desc: "W + 2x casing width + value" },
                { key: "threshold_length", label: "Threshold Length", desc: "W + value" },
                { key: "sideJamb_length", label: "Side Jamb Length", desc: "H + value (deep-jamb add-on)" },
                { key: "headJamb_length", label: "Head Jamb Length", desc: "W + value (deep-jamb add-on)" },
                { key: "jamb_width", label: "Jamb Width", desc: "JD + value (deep-jamb add-on)" },
              ]} />
              <OffsetCard title="Patio Doors" section="patio_door" fields={[
                { key: "sideJamb_length", label: "Side Jamb Length", desc: "H + value" },
                { key: "headJamb_length", label: "Head Jamb Length", desc: "W + value" },
                { key: "sillJamb_length", label: "Sill Jamb Length", desc: "W + value" },
                { key: "jamb_width", label: "Jamb Width", desc: "JD + value" },
                { key: "sideCasing_length", label: "Side Casing Length", desc: "H + 1x casing width + value" },
                { key: "headCasing_length", label: "Head Casing Length", desc: "W + 2x casing width + value" },
                { key: "threshold_length", label: "Threshold Length", desc: "W + value" },
              ]} />

              <div style={{ background: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 12, border: "1px solid #E8E8E8" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>Jamb Thickness</div>
                <OffsetRow label="Extension Thickness" desc="Applied to all jamb extensions" value={offsets.thickness ?? 0.625}
                  onChange={v => { const u = { ...offsets, thickness: parseFloat(v) || 0 }; setOffsetsState(u); saveOffsetsToAPI(u); }} />
                <OffsetRow label="Board Waste (inches)" desc="Extra length added per board for split ends / bad ends" value={offsets.boardWaste ?? 5}
                  onChange={v => { const u = { ...offsets, boardWaste: parseFloat(v) || 0 }; setOffsetsState(u); saveOffsetsToAPI(u); }} />
              </div>
            </div>
          </div>
        );
      }

      // ─── BENDING METAL ───
      if (view === "metal") {
        const bm = { ...DEFAULT_OFFSETS.bending_metal, ...(offsets.bending_metal || {}) };
        const updateBM = (key, val) => {
          const updated = { ...offsets, bending_metal: { ...bm, [key]: parseFloat(val) || 0 } };
          setOffsetsState(updated);
          saveOffsetsToAPI(updated);
        };
        const resetBM = () => {
          const updated = { ...offsets, bending_metal: { ...DEFAULT_OFFSETS.bending_metal } };
          setOffsetsState(updated);
          saveOffsetsToAPI(updated);
        };

        // Per-window wrap pieces from decimal width/height
        const computeWraps = (w, h) => [
          { type: "topside", part: "Side", qty: 2, length: h + (bm.side_addon || 0) },
          { type: "topside", part: "Top",  qty: 1, length: w + (bm.top_addon || 0) },
          { type: "bottom",  part: "Bottom", qty: 1, length: w + (bm.bottom_addon || 0) },
        ];

        // Working wrap list — an editable copy used only for this calc / PDF.
        // It never writes back to the saved job. Rows: { label, location, w, h, width }.
        const coilWidth = bm.coil_width || 24;
        const defWidth = bm.strip_width || 5;
        const workSized = metalWork
          .map(r => ({ u: { label: r.label, location: r.location || "" }, w: parseFloat(r.w) || 0, h: parseFloat(r.h) || 0, width: parseFloat(r.width) || defWidth }))
          .filter(x => x.w > 0 && x.h > 0);

        const totals = { topside: { pieces: 0, inches: 0 }, bottom: { pieces: 0, inches: 0 } };
        workSized.forEach(({ w, h }) => computeWraps(w, h).forEach(p => {
          totals[p.type].pieces += p.qty;
          totals[p.type].inches += p.qty * p.length;
        }));
        const feet = inches => (inches / 12).toFixed(1);

        // Coil batching — coil is coilWidth" wide and each wrap takes its own width off it.
        // Sort by length so similar lengths sit together, then fill each coil cut until the
        // pieces' widths reach coilWidth. Cut each coil segment to the longest piece in it.
        const defBatchCount = Math.max(1, Math.floor(coilWidth / defWidth));
        const expandPieces = (windows, typeKey) => {
          const arr = [];
          windows.forEach(({ u, w, h, width }) => computeWraps(w, h).forEach(p => {
            if (p.type !== typeKey) return;
            for (let q = 0; q < p.qty; q++) arr.push({ where: (u.label || "Window") + (u.location ? " · " + u.location : ""), part: p.part, length: p.length, width });
          }));
          return arr;
        };
        const makeBatches = (pieces) => {
          const sorted = pieces.slice().sort((a, b) => b.length - a.length);
          const batches = [];
          let cur = null, curW = 0;
          sorted.forEach(p => {
            if (cur && curW + p.width > coilWidth) cur = null;
            if (!cur) { cur = { items: [], coilLen: p.length, widthUsed: 0 }; batches.push(cur); curW = 0; }
            cur.items.push(p); curW += p.width; cur.widthUsed = curW; cur.coilLen = Math.max(cur.coilLen, p.length);
          });
          return batches;
        };
        const workBatches = { topside: makeBatches(expandPieces(workSized, "topside")), bottom: makeBatches(expandPieces(workSized, "bottom")) };

        // Load a saved job's windows into the working list (copy only — never persisted back).
        const loadJobIntoWork = (s) => {
          const rows = (s.units || []).filter(u => u.unitType === "Window").map(u => {
            const wv = combineMeasurement(u.widthWhole, u.widthFrac);
            const hv = combineMeasurement(u.heightWhole, u.heightFrac);
            return { label: u.label || "", location: u.location || "", w: wv > 0 ? String(wv) : "", h: hv > 0 ? String(hv) : "", width: String(defWidth) };
          });
          setMetalWork(rows);
          setMetalListName(s.job.customerName || "");
          setMetalListPo(s.job.poNumber || "");
          setMetalSearch("");
        };
        const addWorkRow = () => setMetalWork(prev => [...prev, { label: "", location: "", w: "", h: "", width: String(defWidth) }]);
        const updateWorkRow = (i, key, val) => setMetalWork(prev => prev.map((r, idx) => idx === i ? { ...r, [key]: val } : r));
        const removeWorkRow = (i) => setMetalWork(prev => prev.filter((_, idx) => idx !== i));
        const clearWork = () => { setMetalWork([]); setMetalListName(""); setMetalListPo(""); };

        // Type-to-search job finder
        const mq = metalSearch.toLowerCase().trim();
        const metalMatches = savedJobs
          .filter(s => !mq
            || (s.job.customerName || "").toLowerCase().includes(mq)
            || (s.job.address || "").toLowerCase().includes(mq)
            || (s.job.poNumber || "").toLowerCase().includes(mq))
          .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))
          .slice(0, 12);

        // Warehouse cut list PDF — grouped by metal type, one checkbox per cut.
        // Works for a saved job or a manual list; windows = [{ u:{label,location}, w, h }].
        const runMetalPDF = async ({ name, po, date, windows }) => {
          if (!windows || windows.length === 0) return;
          setMetalExporting(true);
          try {
            const pdf = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
            const ttfB64 = async (path) => {
              const buf = await fetch(path).then(r => r.arrayBuffer());
              const bytes = new Uint8Array(buf);
              let binary = "", chunk = 0x8000;
              for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
              return btoa(binary);
            };
            const [regB64, boldB64] = await Promise.all([ttfB64("./Roboto-Regular.ttf"), ttfB64("./Roboto-Bold.ttf")]);
            pdf.addFileToVFS("Roboto-Regular.ttf", regB64);
            pdf.addFileToVFS("Roboto-Bold.ttf", boldB64);
            pdf.addFont("Roboto-Regular.ttf", "Roboto", "normal");
            pdf.addFont("Roboto-Bold.ttf", "Roboto", "bold");

            const pageW = pdf.internal.pageSize.getWidth();
            const pageH = pdf.internal.pageSize.getHeight();
            const margin = 12, contentW = pageW - margin * 2, bottomLimit = pageH - margin - 4;
            let y = margin;
            const GREEN = [109, 179, 68], COPPER = [184, 115, 51], DARK = [26, 26, 26];
            const TEXT_MUTE = [130, 130, 130], BORDER = [221, 221, 221], CB = [150, 150, 150];
            const ensure = (need, onBreak) => { if (y + need > bottomLimit) { pdf.addPage(); y = margin; if (onBreak) onBreak(); } };

            // Header — logo drawn at its true 406×151 aspect ratio (no stretch)
            const logoW = 46, logoH = logoW * 151 / 406;
            try { pdf.addImage(LOGO_FULL, "PNG", margin, y, logoW, logoH); } catch (_) {}
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(13); pdf.setTextColor(...DARK);
            pdf.text(name || "—", pageW - margin, y + 5, { align: "right" });
            pdf.setFont("Roboto", "normal"); pdf.setFontSize(9.5); pdf.setTextColor(...TEXT_MUTE);
            const sub = [po ? "PO " + po : "", date || ""].filter(Boolean).join("   ·   ");
            if (sub) pdf.text(sub, pageW - margin, y + 10.5, { align: "right" });
            y += 18;
            pdf.setFont("Roboto", "bold"); pdf.setFontSize(15); pdf.setTextColor(...DARK);
            pdf.text("L-Flange Wrap Cut List", margin, y + 2);
            y += 8;
            pdf.setDrawColor(...BORDER); pdf.setLineWidth(0.3); pdf.line(margin, y, pageW - margin, y);
            y += 6;

            // Batching note
            pdf.setFont("Roboto", "normal"); pdf.setFontSize(8.5); pdf.setTextColor(...TEXT_MUTE);
            pdf.text('Batched for ' + coilWidth + '" coil — pieces packed across the coil width and grouped by length. Cut each coil segment to the batch length, slit to width, then trim each piece.', margin, y, { maxWidth: contentW });
            y += 7;

            // Expand + batch each metal type by similar length
            const sections = [
              { key: "topside", title: "TOP / SIDE L-FLANGE", color: GREEN },
              { key: "bottom", title: "BOTTOM L-FLANGE", color: COPPER },
            ];
            const secData = {};
            sections.forEach(sec => {
              const pieces = expandPieces(windows, sec.key);
              const batches = makeBatches(pieces);
              secData[sec.key] = { pieces, batches, coilInches: batches.reduce((s, b) => s + b.coilLen, 0) };
            });

            const CB_X = margin + 2, TXT_X = margin + 11;
            const renderSectionHeader = (sec) => {
              const d = secData[sec.key];
              pdf.setFillColor(...sec.color); pdf.rect(margin, y, contentW, 8, "F");
              pdf.setFont("Roboto", "bold"); pdf.setFontSize(10); pdf.setTextColor(255, 255, 255);
              pdf.text(sec.title, margin + 3, y + 5.4);
              pdf.text(d.pieces.length + " pcs  ·  " + d.batches.length + " coil cut" + (d.batches.length === 1 ? "" : "s") + "  ·  " + feet(d.coilInches) + " ft coil", pageW - margin - 3, y + 5.4, { align: "right" });
              y += 8;
            };

            sections.forEach(sec => {
              const d = secData[sec.key];
              if (!d.pieces.length) return;
              ensure(26);
              renderSectionHeader(sec);
              d.batches.forEach((batch, bi) => {
                const bh = 7;
                ensure(bh + 9, () => renderSectionHeader(sec));
                pdf.setFillColor(238, 240, 236); pdf.rect(margin, y, contentW, bh, "F");
                pdf.setFont("Roboto", "bold"); pdf.setFontSize(9); pdf.setTextColor(...DARK);
                pdf.text("BATCH " + (bi + 1) + "   —   cut coil @ " + toFraction(batch.coilLen) + '"', margin + 3, y + 4.8);
                pdf.setFont("Roboto", "normal"); pdf.setTextColor(...TEXT_MUTE);
                pdf.text(batch.items.length + " pc" + (batch.items.length === 1 ? "" : "s") + "  ·  " + toFraction(batch.widthUsed) + '" of ' + coilWidth + '" wide', pageW - margin - 3, y + 4.8, { align: "right" });
                y += bh;
                batch.items.forEach(it => {
                  const rowH = 8.5;
                  ensure(rowH, () => renderSectionHeader(sec));
                  pdf.setDrawColor(...CB); pdf.setLineWidth(0.4);
                  pdf.rect(CB_X, y + rowH / 2 - 2.5, 5, 5, "S");
                  pdf.setFont("Roboto", "bold"); pdf.setFontSize(10); pdf.setTextColor(...DARK);
                  pdf.text(it.where, TXT_X, y + 5.6);
                  pdf.setFont("Roboto", "normal"); pdf.setFontSize(9); pdf.setTextColor(...TEXT_MUTE);
                  pdf.text(it.part, margin + contentW * 0.62, y + 5.6);
                  pdf.setFont("Roboto", "bold"); pdf.setFontSize(10.5); pdf.setTextColor(...DARK);
                  pdf.text(toFraction(it.length) + '"', pageW - margin - 3, y + 5.6, { align: "right" });
                  pdf.setDrawColor(...BORDER); pdf.setLineWidth(0.2); pdf.line(margin, y + rowH, pageW - margin, y + rowH);
                  y += rowH;
                });
                y += 3;
              });
              y += 4;
            });

            const lastName = (name || "Manual").split(" ").pop() || "Manual";
            const poTag = po ? " (" + po + ")" : "";
            pdf.save(lastName + " L-Flange Wraps" + poTag + ".pdf");
          } catch (e) {
            alert("Could not generate PDF: " + (e && e.message ? e.message : e));
          } finally {
            setMetalExporting(false);
          }
        };

        const typeColor = t => t === "bottom" ? "#b87333" : "#6DB344";
        const PieceRow = ({ p }) => (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: "1px solid #F0F0F0" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: typeColor(p.type) }} />
              <span style={{ fontSize: 14, fontWeight: 600, color: "#333" }}>{p.part}</span>
              <span style={{ fontSize: 11, color: "#999" }}>{p.type === "bottom" ? "Bottom L-Flange" : "Top/Side L-Flange"}</span>
            </div>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#1a1a1a" }}>
              {p.qty} × <span style={{ color: typeColor(p.type) }}>{toFraction(p.length)}"</span>
            </div>
          </div>
        );
        const BMRow = ({ label, desc, value, onChange }) => (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #E8E8E8", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "#333" }}>{label}</div>
              <div style={{ fontSize: 11, color: "#888" }}>{desc}</div>
            </div>
            <input type="number" step="0.25" value={value} onChange={e => onChange(e.target.value)}
              style={{ width: 80, padding: "6px 8px", border: "1px solid #ddd", borderRadius: 6, fontSize: 15, fontWeight: 700, textAlign: "center" }} />
          </div>
        );

        return (
          <div style={{ minHeight: "100vh", background: "#F5F5F4", padding: "0 0 40px 0" }}>
            <div style={{
              position: "sticky", top: 0, zIndex: 100, background: "#1C1C1C",
              padding: "max(env(safe-area-inset-top, 0px), 50px) 16px 12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.25)"
            }}>
              <button onClick={() => setView("home")} style={{ background: "none", border: "none", color: "#fff", fontSize: 16, cursor: "pointer", fontWeight: 600}}>← Home</button>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>Bending Metal</div>
              <div style={{ width: 70 }} />
            </div>

            <div style={{ maxWidth: 900, margin: "0 auto", padding: "16px 16px 0" }}>
              <div style={{ fontSize: 13, color: "#888", marginBottom: 16, padding: "0 4px" }}>
                L-flange wrap lengths per window. Sides = Height + side add-on, Top = Width + top add-on (both Top/Side L-Flange). Bottom = Width + bottom add-on (Bottom L-Flange — different bend).
              </div>

              {/* Add-on settings — collapsed by default */}
              <div style={{ background: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 12, border: "1px solid #E8E8E8" }}>
                <div onClick={() => setMetalAddonsOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1.5, textTransform: "uppercase" }}>Wrap Add-ons & Coil</div>
                  <span style={{ fontSize: 13, color: "#999" }}>{metalAddonsOpen ? "▲" : "▼"}</span>
                </div>
                {metalAddonsOpen && (
                  <div style={{ marginTop: 8 }}>
                    <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 2 }}>
                      <button onClick={resetBM} style={{ background: "none", border: "none", fontSize: 11, color: "#999", cursor: "pointer", textDecoration: "underline" }}>Reset defaults</button>
                    </div>
                    <BMRow label="Side Add-on" desc="Added to Height for each side piece" value={bm.side_addon} onChange={v => updateBM("side_addon", v)} />
                    <BMRow label="Top Add-on" desc="Added to Width for the top piece" value={bm.top_addon} onChange={v => updateBM("top_addon", v)} />
                    <BMRow label="Bottom Add-on" desc="Added to Width for the bottom piece" value={bm.bottom_addon} onChange={v => updateBM("bottom_addon", v)} />
                    <BMRow label="Coil Width" desc="Coil stock width (in)" value={bm.coil_width} onChange={v => updateBM("coil_width", v)} />
                    <BMRow label="Default Width" desc="Default coil width per wrap — editable per window below" value={bm.strip_width} onChange={v => updateBM("strip_width", v)} />
                    <div style={{ fontSize: 11, color: "#6DB344", fontWeight: 600, marginTop: 8 }}>→ ~{defBatchCount} pieces per {coilWidth}" coil cut at the default width (packs by each window's actual width)</div>
                  </div>
                )}
              </div>

              {/* Load from a job (copies windows in — never changes the saved job) */}
              <div style={{ background: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 12, border: "1px solid #E8E8E8" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 4 }}>Load from a Job</div>
                <div style={{ fontSize: 11, color: "#999", marginBottom: 10 }}>Copies the job's windows into the list below. Edits here never change the saved job.</div>
                <input type="text" value={metalSearch} onChange={e => setMetalSearch(e.target.value)} placeholder="Search by name, address, or PO #"
                  style={{ width: "100%", padding: "10px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 14, boxSizing: "border-box" }} />
                {metalSearch.trim() && (
                  <div style={{ marginTop: 10 }}>
                    {metalMatches.length === 0 && (
                      <div style={{ fontSize: 13, color: "#999", padding: "8px 2px" }}>{savedJobs.length === 0 ? "No saved jobs yet." : "No jobs match."}</div>
                    )}
                    {metalMatches.map(s => (
                      <div key={s.id} onClick={() => loadJobIntoWork(s)} style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "10px 4px", borderBottom: "1px solid #F0F0F0", cursor: "pointer"
                      }}>
                        <div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: "#1a1a1a" }}>{s.job.customerName || "Untitled Job"}</div>
                          <div style={{ fontSize: 11, color: "#999" }}>{[s.job.date, s.job.poNumber, s.job.address].filter(Boolean).join(" · ")}</div>
                        </div>
                        <span style={{ fontSize: 18, color: "#ccc" }}>›</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Wrap list — editable working copy */}
              <div style={{ background: "#fff", borderRadius: 8, padding: "12px 16px", marginBottom: 12, border: "1px solid #E8E8E8" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1.5, textTransform: "uppercase" }}>Wrap List</div>
                  {metalWork.length > 0 && <button onClick={clearWork} style={{ background: "none", border: "none", fontSize: 11, color: "#999", cursor: "pointer", textDecoration: "underline" }}>Clear</button>}
                </div>

                <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                  <input type="text" value={metalListName} onChange={e => setMetalListName(e.target.value)} placeholder="List name (for the export)"
                    style={{ flex: 2, minWidth: 0, padding: "9px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, boxSizing: "border-box" }} />
                  <input type="text" value={metalListPo} onChange={e => setMetalListPo(e.target.value)} placeholder="PO #"
                    style={{ flex: 1, minWidth: 0, padding: "9px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, boxSizing: "border-box" }} />
                </div>

                <div style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 10, color: "#aaa", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5, padding: "0 2px 4px" }}>
                  <span style={{ flex: "0 0 66px" }}>Label</span>
                  <span style={{ flex: 1, textAlign: "center" }}>W</span>
                  <span style={{ flex: "0 0 10px" }} />
                  <span style={{ flex: 1, textAlign: "center" }}>H</span>
                  <span style={{ flex: "0 0 56px", textAlign: "center" }}>Width</span>
                  <span style={{ flex: "0 0 24px" }} />
                </div>

                {metalWork.map((r, i) => {
                  const w = parseFloat(r.w) || 0, h = parseFloat(r.h) || 0, valid = w > 0 && h > 0;
                  return (
                    <div key={i} style={{ borderBottom: "1px solid #F0F0F0", paddingBottom: 8, marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <input type="text" value={r.label} onChange={e => updateWorkRow(i, "label", e.target.value)} placeholder="Label"
                          style={{ flex: "0 0 66px", width: 66, padding: "8px 6px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, boxSizing: "border-box" }} />
                        <input type="number" step="0.0625" value={r.w} onChange={e => updateWorkRow(i, "w", e.target.value)} placeholder="W"
                          style={{ flex: 1, minWidth: 0, padding: "8px 4px", border: "1px solid #ddd", borderRadius: 6, fontSize: 14, fontWeight: 700, textAlign: "center", boxSizing: "border-box" }} />
                        <span style={{ color: "#bbb", fontSize: 13, flex: "0 0 10px", textAlign: "center" }}>×</span>
                        <input type="number" step="0.0625" value={r.h} onChange={e => updateWorkRow(i, "h", e.target.value)} placeholder="H"
                          style={{ flex: 1, minWidth: 0, padding: "8px 4px", border: "1px solid #ddd", borderRadius: 6, fontSize: 14, fontWeight: 700, textAlign: "center", boxSizing: "border-box" }} />
                        <input type="number" step="0.25" value={r.width} onChange={e => updateWorkRow(i, "width", e.target.value)} placeholder={String(defWidth)}
                          style={{ flex: "0 0 56px", width: 56, padding: "8px 4px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, fontWeight: 700, textAlign: "center", color: "#b87333", boxSizing: "border-box" }} />
                        <button onClick={() => removeWorkRow(i)} style={{ flex: "0 0 20px", background: "none", border: "none", color: "#c0392b", fontSize: 20, lineHeight: 1, cursor: "pointer", padding: 0 }}>×</button>
                      </div>
                      {valid && <div style={{ marginTop: 4 }}>{computeWraps(w, h).map((p, k) => <PieceRow key={k} p={p} />)}</div>}
                    </div>
                  );
                })}

                <button onClick={addWorkRow} style={{
                  width: "100%", padding: "10px 0", marginTop: 2, border: "1px dashed #cbd5c0", borderRadius: 6,
                  background: "#F7FAF4", fontSize: 13, fontWeight: 600, color: "#6DB344", cursor: "pointer"
                }}>+ Add Window / Door</button>

                {workSized.length > 0 && (
                  <div style={{ marginTop: 12, padding: "12px 14px", background: "#F7FAF4", borderRadius: 8, border: "1px solid rgba(109,179,68,0.25)" }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>Totals · {coilWidth}" coil</div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                      <span style={{ color: "#333" }}><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#6DB344", marginRight: 6 }} />Top/Side L-Flange</span>
                      <span style={{ fontWeight: 700, color: "#1a1a1a" }}>{totals.topside.pieces} pcs · {workBatches.topside.length} coil cut{workBatches.topside.length === 1 ? "" : "s"}</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                      <span style={{ color: "#333" }}><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#b87333", marginRight: 6 }} />Bottom L-Flange</span>
                      <span style={{ fontWeight: 700, color: "#1a1a1a" }}>{totals.bottom.pieces} pcs · {workBatches.bottom.length} coil cut{workBatches.bottom.length === 1 ? "" : "s"}</span>
                    </div>
                  </div>
                )}

                {workSized.length > 0 && (
                  <button onClick={() => runMetalPDF({ name: metalListName || "Wrap List", po: metalListPo, date: "", windows: workSized })} disabled={metalExporting} style={{
                    width: "100%", marginTop: 12, padding: "13px 0", border: "none", borderRadius: 6,
                    background: metalExporting ? "#9ecb7f" : "#6DB344", fontSize: 14, fontWeight: 700,
                    color: "#fff", cursor: metalExporting ? "default" : "pointer", letterSpacing: 0.3
                  }}>{metalExporting ? "Generating…" : "⬇ Export Warehouse Cut List (PDF)"}</button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ─── SAVED JOBS ───
      if (view === "saved") {

        const searchLower = savedSearch.toLowerCase().trim();
        const filteredJobs = savedJobs
          .filter(s => savedFilter === "submitted" ? s.submitted === true : !s.submitted)
          .filter(s => {
            if (savedTechFilter && savedFilter === "submitted") {
              if ((s.job.techMeasurer || "") !== savedTechFilter) return false;
            }
            if (!searchLower) return true;
            return (s.job.customerName || "").toLowerCase().includes(searchLower)
              || (s.job.address || "").toLowerCase().includes(searchLower)
              || (s.job.poNumber || "").toLowerCase().includes(searchLower);
          })
          .sort((a, b) => {
            // Completed jobs always last
            const aC = a.status === "complete" ? 1 : 0;
            const bC = b.status === "complete" ? 1 : 0;
            if (aC !== bC) return aC - bC;
            // Starred first
            if ((b.starred ? 1 : 0) !== (a.starred ? 1 : 0)) return (b.starred ? 1 : 0) - (a.starred ? 1 : 0);
            if (savedSort === "oldest") return (a.savedAt || "").localeCompare(b.savedAt || "");
            if (savedSort === "last_name") {
              const aLast = (a.job.customerName || "").trim().split(/\s+/).pop().toLowerCase();
              const bLast = (b.job.customerName || "").trim().split(/\s+/).pop().toLowerCase();
              return aLast.localeCompare(bLast);
            }
            return (b.savedAt || "").localeCompare(a.savedAt || "");
          });

        const renderJobCard = (s) => (
            <div key={s.id} onClick={() => loadJobForReport(s)} style={{
              background: s.status === "complete" ? "rgba(109,179,68,0.06)" : "#fff", borderRadius: 8, marginBottom: 10, cursor: "pointer",
              boxShadow: s.status === "complete" ? "0 2px 8px rgba(109,179,68,0.10)" : "0 2px 8px rgba(0,0,0,0.06)",
              border: `1px solid ${s.status === "complete" ? "rgba(109,179,68,0.3)" : (s.starred ? "#f39c12" : "#E8E8E8")}`,
              overflow: "hidden", opacity: s.status === "complete" ? 0.85 : 1
            }}>
              <div style={{ display: "flex", alignItems: "stretch" }}>
                {/* Star */}
                <div onClick={(e) => { e.stopPropagation(); updateJobMeta(s, { starred: !s.starred }); }} style={{
                  width: 44, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
                  background: s.starred ? "rgba(243,156,18,0.08)" : "transparent", flexShrink: 0,
                  fontSize: 20, color: s.starred ? "#f39c12" : "#ddd", transition: "all 0.15s"
                }}>
                  {s.starred ? "★" : "☆"}
                </div>

                {/* Main content */}
                <div style={{ flex: 1, padding: "12px 12px 8px" }}>
                  <div style={{ fontWeight: 700, fontSize: 16, color: "#333" }}>{s.job.customerName || "Untitled Job"}</div>
                  <div style={{ fontSize: 13, color: "#888", marginTop: 2 }}>
                    {s.job.date} • {s.units.length} unit{s.units.length !== 1 ? "s" : ""}
                    {s.job.techMeasurer ? ` • ${s.job.techMeasurer}` : ""}
                  </div>
                  {s.job.address && <div style={{ fontSize: 12, color: "#aaa", marginTop: 2 }}>{s.job.address}</div>}
                  {jobHasSuspectExtras(s) && (
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#c0392b", marginTop: 4 }}>
                      ⚠ Extra material qty may be wrong on the original report — reopen to verify
                    </div>
                  )}
                </div>

                {/* Complete + Delete */}
                <div style={{ display: "flex", alignItems: "center", gap: 6, paddingRight: 10 }}>
                  <button onClick={(e) => { e.stopPropagation(); updateJobMeta(s, { status: s.status === "complete" ? (s.submitted ? "submitted" : "in_progress") : "complete" }); }} style={{
                    background: s.status === "complete" ? "#6DB344" : "rgba(109,179,68,0.08)",
                    border: "1px solid " + (s.status === "complete" ? "#6DB344" : "#ddd"),
                    color: s.status === "complete" ? "#fff" : "#999",
                    padding: "6px 12px", borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: "pointer",
                    transition: "all 0.15s", whiteSpace: "nowrap"
                  }}>{s.status === "complete" ? "✓ Complete" : "Job Complete"}</button>
                  <button onClick={(e) => { e.stopPropagation(); if (confirm("Delete this job?")) deleteJob(s.id); }} style={{
                    background: "none", border: "none", fontSize: 16, color: "#c0392b", cursor: "pointer", padding: 8
                  }}>✕</button>
                </div>
              </div>
            </div>
        );

        return (
          <div style={{ minHeight: "100vh", background: "#F5F5F4", padding: "0 0 40px 0" }}>
            {/* Top Bar */}
            <div style={{
              position: "sticky", top: 0, zIndex: 100, background: "#1C1C1C",
              padding: "max(env(safe-area-inset-top, 0px), 50px) 16px 12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center",
              boxShadow: "0 2px 12px rgba(0,0,0,0.25)"
            }}>
              <button onClick={() => { setView("home"); setSavedSearch(""); }} style={{ background: "none", border: "none", color: "#fff", fontSize: 16, cursor: "pointer", fontWeight: 600}}>← Home</button>
              <div style={{ textAlign: "center", lineHeight: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>{savedFilter === "submitted" ? "Submitted Jobs" : "Saved Jobs"}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.5)", marginTop: 2 }}>{filteredJobs.length} job{filteredJobs.length !== 1 ? "s" : ""}</div>
              </div>
              <div style={{ width: 70 }} />
            </div>
            <div style={{ maxWidth: 900, margin: "0 auto", padding: "16px 16px 0" }}>

              {/* Search */}
              <input
                type="text" value={savedSearch} onChange={e => setSavedSearch(e.target.value)}
                placeholder="Search by name, address, or PO#..."
                style={{
                  width: "100%", padding: "11px 14px", border: "1px solid #ddd", borderRadius: 8, fontSize: 15,
                  background: "#fff", boxSizing: "border-box", marginBottom: 14
                }}
              />

              {/* Sort bar */}
              <div style={{ display: "flex", gap: 6, marginBottom: savedFilter === "submitted" ? 8 : 12 }}>
                {[
                  { key: "newest", label: "Newest" },
                  { key: "oldest", label: "Oldest" },
                  { key: "last_name", label: "Last Name" },
                ].map(opt => (
                  <button key={opt.key} onClick={() => setSavedSort(opt.key)} style={{
                    padding: "6px 12px", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer",
                    border: savedSort === opt.key ? "1.5px solid #6DB344" : "1px solid #ddd",
                    background: savedSort === opt.key ? "rgba(109,179,68,0.08)" : "#fff",
                    color: savedSort === opt.key ? "#6DB344" : "#999",
                    transition: "all 0.15s"
                  }}>{opt.label}</button>
                ))}
              </div>
              {/* Tech measurer filter — submitted jobs only */}
              {savedFilter === "submitted" && (
              <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
                <span style={{ fontSize: 11, fontWeight: 700, color: "#888", alignSelf: "center", marginRight: 2 }}>Tech:</span>
                {["", ...TECH_MEASURERS].map(tech => (
                  <button key={tech} onClick={() => setSavedTechFilter(tech)} style={{

              {filteredJobs.length === 0 ? (
                <div style={{ textAlign: "center", padding: 40, color: "#999" }}>
                  <div style={{ fontSize: 40, marginBottom: 12 }}>📋</div>

              ) : (() => {
                const activeJobs = filteredJobs.filter(j => j.status !== "complete");
                const completeJobs = filteredJobs.filter(j => j.status === "complete");
                return <>
                  {activeJobs.map(s => renderJobCard(s))}
                  {completeJobs.length > 0 && activeJobs.length > 0 && (
                    <div style={{ display: "flex", alignItems: "center", margin: "18px 0 12px", gap: 12 }}>

              <button onClick={() => saveJob(false)} style={{

                  background: "#6DB344", fontSize: 14, fontWeight: 700,

              </div>

            }}>

                <span style={{ width: 22, height: 22, background: "#6DB344", color: "#fff", borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800 }}>1</span>
                Job Info
              </div>
              <div style={{ display: "grid", gap: 10 }}>
                <div>
                  <label style={lbl}>Customer / Job Name</label>
                  <input style={inp} value={job.customerName} onChange={e => updateJob("customerName", e.target.value)} placeholder="e.g. Johnson Residence" />
                </div>
                <div>
                  <label style={lbl}>Address</label>
                  <input style={inp} value={job.address} onChange={e => updateJob("address", e.target.value)} placeholder="123 Main St" />

                  </div>
                </div>

              </div>

            {/* Trim Selection */}

                          <input type="checkbox" checked={!!customMode.globalStop} onChange={() => setCustomMode(p => ({ ...p, globalStop: !p.globalStop }))} style={{ width: 13, height: 13 }} /> Custom
                        </label>
                      </div>
                      {customMode.globalStop
                        ? <input style={inp} value={globalTrim.stopProfile || ""} onChange={e => updateGlobalTrim("stopProfile", e.target.value)} placeholder="Type custom stop profile..." />

                          </select>

                    </div>
                    ) : (

                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                        </label>
                      </div>
                      {customMode.globalCasing

                        : <select style={sel} value={globalTrim.casingProfile} onChange={e => updateGlobalTrim("casingProfile", e.target.value)}>
                            <option value="None">None (no casing)</option>
                            <option value="Customer Supplying">Customer Supplying</option>
                            {getAvailableProfiles(globalTrim.species, catalog).map(p => {
                              const avail = isProfileAvailableInCatalog(catalog, p.label, globalTrim.species);
                              return <option key={p.label} value={p.label} disabled={!avail}>{p.label}{!avail ? " (unavailable)" : ""}</option>;
                            })}
                          </select>
                      }
                    </div>
                    )}
                    {/* Jamb Species + Material (not used for Stops trim) */}
                    {globalTrim.trimStyle !== "Stops" && (
                    <div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <label style={lbl}>Jamb Species</label>
                        <label style={{ fontSize: 10, color: "#999", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
                          <input type="checkbox" checked={!!customMode.globalJambSp} onChange={() => setCustomMode(p => ({ ...p, globalJambSp: !p.globalJambSp }))} style={{ width: 13, height: 13 }} /> Custom
                        </label>
                      </div>
                      {customMode.globalJambSp
                        ? <input style={inp} value={globalTrim.jambSpecies || globalTrim.species} onChange={e => { setJambSpeciesManuallySet(true); updateGlobalTrim("jambSpecies", e.target.value); }} placeholder="Type custom species..." />
                        : <select style={sel} value={globalTrim.jambSpecies || globalTrim.species} onChange={e => { setJambSpeciesManuallySet(true); updateGlobalTrim("jambSpecies", e.target.value); }}>
                            {(() => { const v = globalTrim.jambSpecies || globalTrim.species; return v && !SPECIES.includes(v) ? <option value={v}>{v} (custom)</option> : null; })()}
                            {SPECIES.map(s => {
                              const avail = isSpeciesAvailableInCatalog(catalog, s);
                              return <option key={s} value={s} disabled={!avail}>{s}{!avail ? " (unavailable)" : ""}</option>;
                            })}
                          </select>
                      }
                    </div>
                    )}
                    {globalTrim.trimStyle !== "Stops" && (
                    <div>
                      <label style={lbl}>Jamb Material</label>
                      <select style={sel} value={globalTrim.jambMaterial || ""} onChange={e => updateGlobalTrim("jambMaterial", e.target.value)}>
                        <option value="">Auto ({(() => {
                          if (!globalTrim.jambDepthWhole) return "set jamb depth";
                          const jd = combineMeasurement(globalTrim.jambDepthWhole, globalTrim.jambDepthFrac);
                          const jw = jd + (offsets?.window_pf?.jamb_width || -2.75);
                          return getJambStockWidth(jw, catalog).label;
                        })()})</option>
                        <option value="None">None (no jambs)</option>
                        <option value="Customer Supplying">Customer Supplying</option>
                        <JambStockOptions catalog={catalog} allowTraditional={(globalTrim.trimStyle || "Picture Frame") === "Traditional"} />
                      </select>
                    </div>
                    )}
                  </div>
                  {(globalTrim.trimStyle || "Picture Frame") === "Traditional" && (
                    <div style={{ marginTop: 8 }}>
                      <label style={{ fontSize: 13, color: "#333", cursor: "pointer", display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: globalTrim.stool5_4 ? "rgba(230,126,34,0.1)" : "#f9f9f9", borderRadius: 6, border: globalTrim.stool5_4 ? "1px solid #e67e22" : "1px solid #e8e8e8" }}>
                        <input type="checkbox" checked={!!globalTrim.stool5_4} onChange={() => updateGlobalTrim("stool5_4", !globalTrim.stool5_4)} style={{ width: 16, height: 16 }} />
                        <span style={{ fontWeight: 600 }}>5/4" Stool</span>
                        <span style={{ fontSize: 11, color: "#888" }}>Use 5/4" thick material for sill/stool</span>
                      </label>
                    </div>
                  )}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 10 }}>
                    <div>
                      <label style={lbl}>Finish Type</label>
                      <select style={sel} value={globalTrim.finishType} onChange={e => {
                        const newType = e.target.value;
                        if (newType === "Multiple") {
                          const updated = { ...globalTrim, finishType: "Multiple", finish: "Multiple" };
                          setGlobalTrim(updated);
                          // Don't override per-unit finishes — leave them as-is
                          return;
                        }
                        const newFinish = newType === "No Prefinish" ? "No Prefinish" : "";
                        const updated = { ...globalTrim, finishType: newType, finish: newFinish };
                        if (globalTrim.species !== "Pine") {
                          const profile = CASING_PROFILES.find(p => p.label === updated.casingProfile);
                          if (profile && profile.pineOnly) updated.casingProfile = '2-1/2" Colonial (C115)';
                        }
                        setGlobalTrim(updated);
                        setUnits(prev => prev.map(u => ({ ...u, finishType: newType, finish: newFinish })));
                      }}>
                        {FINISH_TYPES.map(t => <option key={t}>{t}</option>)}
                        <option value="Multiple">Multiple (per unit)</option>
                      </select>
                    </div>
                    {globalTrim.finishType !== "Multiple" && globalTrim.finishType !== "No Prefinish" && (
                    <div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <label style={lbl}>{globalTrim.finishType === "Stain" ? "Stain Color" : "Paint Color"}</label>
                        <label style={{ fontSize: 10, color: "#999", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
                          <input type="checkbox" checked={!!customMode.globalFinish} onChange={() => setCustomMode(p => ({ ...p, globalFinish: !p.globalFinish }))} style={{ width: 13, height: 13 }} /> Custom
                        </label>
                      </div>
                      {customMode.globalFinish
                        ? <input style={inp} value={globalTrim.finish} onChange={e => updateGlobalTrim("finish", e.target.value)} placeholder="Type custom color..." />
                        : <select style={sel} value={globalTrim.finish} onChange={e => updateGlobalTrim("finish", e.target.value)}>
                            <option value="">Not yet selected</option>
                            {globalTrim.finishType === "Stain"
                              ? getStainOptions(catalog).map(s => <option key={s} value={s}>{s}</option>)
                              : getPaintOptions(catalog).map(p => <option key={p} value={p}>{p}</option>)
                            }
                          </select>
                      }
                    </div>
                    )}
                    {globalTrim.finishType === "Multiple" && (
                      <div style={{ display: "flex", alignItems: "center", fontSize: 12, color: "#888", fontStyle: "italic", padding: "4px 0" }}>

                      </div>
                    )}
                  </div>
                  <div style={{ marginTop: 10, padding: "8px 12px", background: "rgba(109,179,68,0.12)", borderRadius: 6, border: "1px solid rgba(109,179,68,0.25)", display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 700, color: "#2d5016" }}>{globalTrim.finishType === "No Prefinish" ? "No Prefinish" : `${globalTrim.finishType}: ${globalTrim.finish || "Not yet selected"}`}</span>
                  </div>
                  {/* Global Jamb Depth (not used for Stops trim) */}
                  {globalTrim.trimStyle !== "Stops" && (
                  <div style={{ marginTop: 10 }}>
                    <FractionInput
                      label="Jamb Depth (all units)"
                      wholeValue={globalTrim.jambDepthWhole}
                      fracValue={globalTrim.jambDepthFrac}
                      onWholeChange={v => updateGlobalTrim("jambDepthWhole", v)}
                      onFracChange={v => updateGlobalTrim("jambDepthFrac", v)}
                      placeholder="4"
                      labelStyle={lbl}
                    />
                    <div style={{ fontSize: 11, color: "#999", marginTop: 4 }}>Changes here update all units. Override individually in each unit below.</div>
                  </div>
                  )}

              </div>
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#6DB344", marginBottom: 10, display: "flex", alignItems: "center", gap: 8, padding: "0 4px" }}>

                Units ({units.length})
              </div>

              {units.map((unit, idx) => {
                const expanded = expandedUnit === idx;
                const complete = isUnitComplete(unit);
                const mats = complete ? calcMaterials(unit, catalog) : [];
                const needsJD = unit.trimStyle !== "Stops" && (unit.unitType !== "Entry Door" || unit.entryDoorJambs);
                const needsJambDepth = unit.trimStyle !== "Stops";
                const needsTrim = unit.unitType === "Window";
                const needsThreshold = unit.unitType !== "Window";

                return (
                  <div key={unit.id} style={{
                    background: "#fff", borderRadius: 8, marginBottom: 8,
                    boxShadow: "0 2px 10px rgba(0,0,0,0.05)",
                    border: `1px solid ${complete ? "#6DB344" : "#E8E8E8"}`,
                    overflow: "hidden", transition: "all 0.2s"
                  }}>
                    {/* Header */}
                    <div onClick={() => setExpandedUnit(expanded ? -1 : idx)} style={{
                      padding: "12px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between",

                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{ width: 9, height: 9, borderRadius: "50%", background: complete ? "#6DB344" : "#ccc", flexShrink: 0 }} />
                        <div>
                          <span style={{ fontWeight: 700, fontSize: 15, color: unit.label ? "#6DB344" : "#bbb" }}>{unit.label || `Unit ${idx + 1}`}</span>
                          <span style={{ fontSize: 12, color: "#888", marginLeft: 8 }}>
                            {unit.unitType}{complete ? ` • ${toFraction(combineMeasurement(unit.widthWhole, unit.widthFrac))}" × ${toFraction(combineMeasurement(unit.heightWhole, unit.heightFrac))}"` : ""}
                          </span>
                        </div>
                      </div>
                      <span style={{ fontSize: 16, color: "#999", transition: "transform 0.2s", transform: expanded ? "rotate(180deg)" : "none" }}>▾</span>
                    </div>

                    {expanded && (
                      <div style={{ padding: "14px 16px 18px" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                          <div>
                            <label style={lbl}>Unit Label</label>
                            <input style={inp} value={unit.label} onChange={e => updateUnit(idx, "label", e.target.value)} placeholder="101" />
                          </div>
                          <div>
                            <label style={lbl}>Location</label>
                            <input style={inp} value={unit.location} onChange={e => updateUnit(idx, "location", e.target.value)} placeholder="Master Bedroom" />
                          </div>
                          <div>
                            <label style={lbl}>Unit Type</label>
                            <select style={sel} value={unit.unitType} onChange={e => updateUnit(idx, "unitType", e.target.value)}>
                              {UNIT_TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                          </div>
                          {needsTrim && (
                            <div>
                              <label style={lbl}>Trim Style</label>
                              <select style={sel} value={unit.trimStyle} onChange={e => updateUnit(idx, "trimStyle", e.target.value)}>
                                {TRIM_STYLES.map(t => <option key={t}>{t}</option>)}
                              </select>
                            </div>
                          )}
                          {unit.trimStyle === "Stops" && needsTrim && (
                            <div>
                              <label style={lbl}>Stop Coverage</label>

                              </select>
                            </div>

                                <input type="checkbox" checked={!!customMode["species_"+idx]} onChange={() => setCustomMode(p => ({ ...p, ["species_"+idx]: !p["species_"+idx] }))} style={{ width: 13, height: 13 }} /> Custom
                              </label>

              </div>
              <div style={{ padding: "8px 16px", borderBottom: "1px solid #E8E8E8", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13 }}>
                  <input type="checkbox" checked={job.optimizePerUnit === false} onChange={e => updateJob("optimizePerUnit", !e.target.checked)} style={{ width: 16, height: 16, accentColor: "#6DB344" }} />
                  <span style={{ fontWeight: 600 }}>Calculate per job</span>
                  <span style={{ fontSize: 11, color: "#888", fontWeight: 400 }}>(default: per unit / grain matching)</span>
                </label>
                <span style={{ color: "#ddd" }}>|</span>
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13 }}>
                  <input type="checkbox" checked={job.showFinishOnChecklist || false} onChange={e => updateJob("showFinishOnChecklist", e.target.checked)} style={{ width: 16, height: 16, accentColor: "#6DB344" }} />
                  <span style={{ fontWeight: 600 }}>Show prefinish color</span>
                  <span style={{ fontSize: 11, color: "#888", fontWeight: 400 }}>(on checklist)</span>
                </label>
              </div>
              {(() => {
                const completeUnits = units.filter(isUnitComplete);
                // Storm doors are intentionally excluded from boards — don't warn about them
                const incompleteCount = units.filter(u => !isStormDoor(u) && !isUnitComplete(u)).length;
                const hasExtras = (job.extraBoards || []).length > 0;
                if (completeUnits.length === 0 && !hasExtras) {
                  return (
                    <div style={{ padding: "16px", fontSize: 13, color: "#999", textAlign: "center" }}>
                      Complete a unit or add extra boards to see board calculations
                    </div>
                  );
                }
                const { boards: unitBoards, STOCK_LABELS } = optimizeBoards(completeUnits, catalog, job.optimizePerUnit, offsets.boardWaste);
                const extraBoardEntries = (job.extraBoards || []).map(normalizeExtraBoardProfile).map(eb => ({
                  stockLength: parseInt(eb.stockLength) || 120,
                  materialType: eb.materialType || "Casing",
                  species: eb.species || units[0]?.species || "Oak",
                  profile: eb.profile || "",
                  finish: eb.finish || units[0]?.finish || "",
                  note: eb.note || "",
                  isExtra: true,
                }));
                const allBoards = [...unitBoards, ...extraBoardEntries];
                const summary = {};
                allBoards.forEach(b => { summary[b.stockLength] = (summary[b.stockLength] || 0) + 1; });
                // Same aggregation the submitted checklist uses, so this preview matches it
                const groups = aggregateBoardGroups([...unitBoards, ...normalizeExtraBoards(job.extraBoards || [], units, catalog)], STOCK_LABELS, job.showFinishOnChecklist);
                return (
                  <div style={{ padding: "12px 16px" }}>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 8 }}>
                      <div style={{ background: "#6DB344", color: "#fff", padding: "8px 16px", borderRadius: 8, fontWeight: 700, fontSize: 18 }}>
                        {allBoards.length} board{allBoards.length !== 1 ? "s" : ""} total
                        {extraBoardEntries.length > 0 && (
                          <span style={{ fontSize: 12, fontWeight: 500, marginLeft: 8, opacity: 0.9 }}>
                            ({unitBoards.length} from units + {extraBoardEntries.length} extra)
                          </span>
                        )}
                      </div>
                      {Object.entries(summary).sort((a,b) => Number(a[0]) - Number(b[0])).map(([len, count]) => (
                        <div key={len} style={{ background: "rgba(109,179,68,0.08)", padding: "8px 16px", borderRadius: 8, fontWeight: 600, fontSize: 15, border: "1px solid #E8E8E8" }}>
                          {count}× {STOCK_LABELS[len] || (Math.floor(len/12) + "'")}
                        </div>
                      ))}
                    </div>
                    {groups.length > 0 && (
                      <div style={{ marginTop: 4, background: "#fff", border: "1px solid #E8E8E8", borderRadius: 6, padding: "8px 12px" }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>Material List</div>
                        {groups.map((g, i) => {
                          const newCat = i > 0 && groups[i - 1].category !== g.category;
                          return (
                            <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 13, color: "#333", padding: "3px 0", borderTop: i === 0 ? "none" : (newCat ? "1px solid #e8e8e8" : "1px solid #f6f6f6") }}>
                              <span>{g.description}</span>
                              <span style={{ fontWeight: 700, color: "#6DB344", whiteSpace: "nowrap" }}>×{g.quantity}</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {extraBoardEntries.length > 0 && (
                      <div style={{ marginTop: 10, background: "#fff", border: "1px solid #E8E8E8", borderRadius: 6, padding: "8px 12px" }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>Extras included</div>
                        {extraBoardEntries.map((b, i) => (
                          <div key={i} style={{ fontSize: 12, color: "#444", padding: "3px 0", borderBottom: i < extraBoardEntries.length - 1 ? "1px solid #f0f0f0" : "none" }}>
                            <strong>{b.species}</strong> {b.materialType}{b.profile ? ` — ${b.profile}` : ""} — {STOCK_LABELS[b.stockLength] || (Math.floor(b.stockLength/12) + "'")}{b.note ? <span style={{ color: "#999", fontStyle: "italic" }}> · {b.note}</span> : null}
                          </div>
                        ))}
                      </div>
                    )}
                    {incompleteCount > 0 && (
                      <div style={{ fontSize: 12, color: "#c08428", marginTop: 8 }}>
                        ⚠ {incompleteCount} unit{incompleteCount !== 1 ? "s" : ""} not yet complete — not included in board count
                      </div>
                    )}
                    <div style={{ fontSize: 12, color: "#888", marginTop: 6 }}>Pulls latest lumber availability — full breakdown in report</div>
                  </div>
                );
              })()}
            </div>

            {/* Submit / Re-submit + Generate Reports */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {!submitted ? (
                <button onClick={() => saveJob(true)} disabled={!allComplete} style={{
                  width: "100%", padding: "18px 0", border: "none", borderRadius: 8,
                  background: allComplete ? "#6DB344" : "#ccc",
                  fontSize: 17, fontWeight: 800, color: allComplete ? "#fff" : "#888",
                  cursor: allComplete ? "pointer" : "not-allowed",
                  boxShadow: allComplete ? "0 4px 20px rgba(109,179,68,0.3)" : "none",
                  letterSpacing: 0.5
                }}>
                  {allComplete ? (savedJobs.some(j => j.id === jobId) ? "Re-Submit Job" : "Submit Job") : "Complete all units to submit"}
                </button>
              ) : (
                <>
                  <div style={{
                    background: "#e8f5e1", border: "1px solid #6DB344", borderRadius: 8,
                    padding: "14px 18px", display: "flex", alignItems: "center", gap: 10
                  }}>
                    <span style={{ fontSize: 22 }}>✓</span>
                    <div>
                      <div style={{ fontWeight: 700, color: "#2d6b1a", fontSize: 15 }}>Job Submitted</div>
                      <div style={{ fontSize: 12, color: "#555" }}>Saved and visible to all team members</div>
                    </div>
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#555", textAlign: "center", letterSpacing: 0.5, textTransform: "uppercase", marginTop: 4 }}>Generate Material List Report</div>
                  <div style={{ display: "flex", gap: 10 }}>
                    <button onClick={() => { setReportType("checklist"); setReportFrom("editor"); setView("report"); }} style={{
                      flex: 1, padding: "16px 0", border: "none", borderRadius: 8,
                      background: "#6DB344", fontSize: 15, fontWeight: 700, color: "#fff",
                      cursor: "pointer", boxShadow: "0 4px 20px rgba(109,179,68,0.3)",
                      letterSpacing: 0.3
                    }}>Materials Checklist</button>
                    <button onClick={() => { setReportType("detailed"); setReportFrom("editor"); setView("report"); }} style={{
                      flex: 1, padding: "16px 0", border: "1px solid #E8E8E8", borderRadius: 8,
                      background: "#fff", fontSize: 15, fontWeight: 700, color: "#6DB344",
                      cursor: "pointer", letterSpacing: 0.3
                    }}>Detailed Cut List</button>
                  </div>
                </>
              )}

              <button onClick={() => saveJob(false)} style={{
                width: "100%", padding: "14px 0", border: "1px solid #ddd", borderRadius: 8,
                background: "#fff", fontSize: 14, fontWeight: 600, color: "#888",
                cursor: "pointer", marginTop: 4
              }}>Save Progress</button>
            </div>
          </div>

          {/* Preview Modal — renders on editor view */}
          {pdfPreview && (
            <div style={{
              position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
              background: "rgba(0,0,0,0.5)", zIndex: 9999,
              display: "flex", alignItems: "center", justifyContent: "center", padding: 16
            }}>
              <div style={{
                background: "#fff", borderRadius: 16, width: "100%", maxWidth: 500,
                maxHeight: "80vh", display: "flex", flexDirection: "column", overflow: "hidden",
                boxShadow: "0 8px 40px rgba(0,0,0,0.25)"
              }}>
                <div style={{ padding: "16px 20px", borderBottom: "1px solid #eee", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontSize: 17, fontWeight: 700, color: "#1a1a1a" }}>Extracted Units</div>
                    <div style={{ fontSize: 13, color: "#888", marginTop: 2 }}>
                      {pdfPreview.units.length} unit{pdfPreview.units.length !== 1 ? "s" : ""} found
                      {pdfPreview.jobInfo?.customerName ? ` — ${pdfPreview.jobInfo.customerName}` : ""}
                    </div>
                    {pdfPreview.jobInfo && (
                      <div style={{ fontSize: 12, color: "#6DB344", marginTop: 2, fontWeight: 600 }}>
                        {pdfPreview.jobInfo.trimStyle || "Picture Frame"}
                        {pdfPreview.jobInfo.species ? ` | ${pdfPreview.jobInfo.species}` : ""}
                        {pdfPreview.jobInfo.casingProfile ? ` | ${pdfPreview.jobInfo.casingProfile.split(" (")[0]}` : ""}
                        {pdfPreview.jobInfo.finishNote ? ` | ${pdfPreview.jobInfo.finishNote}` : ""}
                      </div>
                    )}
                    {pdfPreview.jobInfo && !pdfPreview.jobInfo.finishNote && (
                      <div style={{ fontSize: 12, color: "#c0392b", marginTop: 4, fontWeight: 700, background: "#fdecea", padding: "4px 8px", borderRadius: 4 }}>
                        Stain/finish not found — select manually after import
                      </div>
                    )}
                  </div>
                  <button onClick={() => setPdfPreview(null)} style={{
                    background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#999", padding: "0 4px"
                  }}>✕</button>
                </div>
                <div style={{ flex: 1, overflowY: "auto", padding: "12px 20px" }}>
                  {pdfPreview.units.map((u, i) => (
                    <div key={i} style={{
                      padding: "10px 12px", marginBottom: 8, borderRadius: 10,
                      border: "1px solid #e5e5e5", background: "#fafbfa"
                    }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontWeight: 700, fontSize: 14, color: "#2e5a7c" }}>
                          {u.label || `Unit ${i + 1}`}
                          {u.location ? <span style={{ fontWeight: 400, color: "#888", marginLeft: 6 }}>{u.location}</span> : null}
                        </span>
                        <span style={{
                          fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 6,
                          background: u.unitType === "Window" ? "rgba(109,179,68,0.08)" : u.unitType === "Entry Door" ? "#fdf2e9" : "#e8eef5",
                          color: u.unitType === "Window" ? "#6DB344" : u.unitType === "Entry Door" ? "#b87333" : "#2e5a7c"
                        }}>{u.unitType || "Window"}</span>
                      </div>
                      <div style={{ fontSize: 13, color: "#555", display: "flex", gap: 12, flexWrap: "wrap" }}>
                        <span>W: <b>{u.widthWhole || 0}{fracSuffix(u.widthFrac)}"</b></span>
                        <span>H: <b>{u.heightWhole || 0}{fracSuffix(u.heightFrac)}"</b></span>
                        {u.jambDepthWhole != null ? <span>Jamb: <b>{u.jambDepthWhole}{fracSuffix(u.jambDepthFrac)}"</b></span> : null}
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{ padding: "12px 20px", borderTop: "1px solid #eee", display: "flex", gap: 10 }}>
                  <button onClick={() => setPdfPreview(null)} style={{
                    flex: 1, padding: "12px 0", borderRadius: 10, border: "1px solid #ddd",
                    background: "#fff", fontSize: 14, fontWeight: 600, color: "#666", cursor: "pointer"
                  }}>Cancel</button>
                  <button onClick={confirmPdfUnits} style={{
                    flex: 2, padding: "12px 0", borderRadius: 10, border: "none",
                    background: "#6DB344", fontSize: 14, fontWeight: 700, color: "#fff", cursor: "pointer"
                  }}>Add {pdfPreview.units.length} Unit{pdfPreview.units.length !== 1 ? "s" : ""}</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
