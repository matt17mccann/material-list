    const SPECIES = ["Oak", "Pine", "Maple", "Basswood"];

    const stepperBtnStyle = { width: 32, height: 32, borderRadius: 6, border: "1px solid #ccc", background: "#f5f5f5", fontSize: 18, fontWeight: 700, color: "#333", cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 0, lineHeight: 1 };
    function QtyStepper({ value, onChange, min = 1 }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button type="button" onClick={() => onChange(Math.max(min, (value || 1) - 1))} style={stepperBtnStyle}>−</button>

          <button type="button" onClick={() => onChange((value || 1) + 1)} style={stepperBtnStyle}>+</button>
        </div>
      );
    }

    function FractionInput({ label, wholeValue, fracValue, onWholeChange, onFracChange, placeholder, labelStyle }) {
      return (
        <div>
          <label style={labelStyle}>{label}</label>
          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
            <input
              style={{ width: "50%", padding: "12px 8px", border: "1px solid #ddd", borderRadius: "6px 0 0 6px", fontSize: 20, fontWeight: 800, textAlign: "center", boxSizing: "border-box", outline: "none" }}

    function combineMeasurement(whole, frac) {
      return (parseFloat(whole) || 0) + (parseFloat(frac) || 0);

    const UNIT_TYPES = ["Window", "Entry Door", "Patio Door"];

    const JAMB_STOCK_WIDTHS = [
      { label: '5/8x4', width: 3.5, thickness: 0.625 },
      { label: '5/8x6', width: 5.5, thickness: 0.625 },
      { label: '3/4x8', width: 7.25, thickness: 0.75 },

      { label: '3/4x12', width: 11.25, thickness: 0.75 },

    // Infer jamb-stock thickness from its label prefix — catalog items store only
    // label + width, so thickness comes from the nominal size.
    function jambThicknessFromLabel(label) {
      if (/^\s*5\/8x/i.test(label)) return 0.625;
      if (/^\s*(5\/4|1-1\/4)x/i.test(label)) return 1.25;
      return 0.75;
    }
    // Working jamb-stock list: the catalog (Available Material) overrides/extends the
    // constant so inventory edits drive selection, while known labels keep the
    // constant's structural metadata (thickness, traditionalOnly). Falls back to the
    // constant when no catalog is supplied.
    function jambStockList(catalog) {
      if (!catalog?.jambStock?.length) return JAMB_STOCK_WIDTHS;
      return catalog.jambStock.map(c => {
        const base = JAMB_STOCK_WIDTHS.find(j => j.label === c.label);
        return base
          ? { ...base, width: c.width != null ? c.width : base.width }
          : { label: c.label, width: c.width, thickness: jambThicknessFromLabel(c.label) };
      }).slice().sort((a, b) => a.width - b.width);
    }
    function findJambStock(label, catalog) {
      const resolvedLabel = JAMB_STOCK_RENAMES[label] || label;
      return jambStockList(catalog).find(j => j.label === resolvedLabel) || null;
    }
    // Jamb-stock <option>s grouped and labeled by thickness so 5/8" and 5/4"
    // (which sort next to each other by width) can't be grabbed by mistake.
    function JambStockOptions({ catalog, allowTraditional }) {
      const list = jambStockList(catalog).filter(j => !j.traditionalOnly || allowTraditional);
      const groups = [
        { t: 0.625, label: '——  5/8" thick  ——' },
        { t: 0.75, label: '——  3/4" thick  ——' },
        { t: 1.25, label: '——  5/4" THICK (heavy)  ——' },
      ];
      return groups.map(g => {
        const items = list.filter(j => (j.thickness != null ? j.thickness : jambThicknessFromLabel(j.label)) === g.t);
        if (!items.length) return null;
        return (
          <optgroup key={g.t} label={g.label}>
            {items.map(j => <option key={j.label} value={j.label}>{j.label} ({toFraction(j.width)}")</option>)}
          </optgroup>
        );
      });
    }
    function getJambStockWidth(neededWidth, catalog) {
      const list = jambStockList(catalog);
      for (const stock of list) {
        if (stock.width >= neededWidth) return stock;

      return list[list.length - 1];

    function getStoolStock(neededWidth, use5_4) {
      const list = use5_4 ? STOOL_STOCK_5_4 : STOOL_STOCK_3_4;
      return list.find(s => s.width >= neededWidth) || list[list.length - 1];

    const BASSWOOD_STOCK_5_8 = [

    function basswoodStockFor(width) {

    // Rewrite any nominal thickness prefix (1x, 3/4x, 5/4x) to 5/8x for basswood

    function toFraction(decimal) {
      if (decimal == null || isNaN(decimal)) return "—";
      if (decimal === 0) return "0";
      const neg = decimal < 0;
      decimal = Math.abs(decimal);
      const whole = Math.floor(decimal);
      const frac = decimal - whole;
      const fractions = [
        [1/16,"1/16"],[1/8,"1/8"],[3/16,"3/16"],[1/4,"1/4"],
        [5/16,"5/16"],[3/8,"3/8"],[7/16,"7/16"],[1/2,"1/2"],
        [9/16,"9/16"],[5/8,"5/8"],[11/16,"11/16"],[3/4,"3/4"],
        [13/16,"13/16"],[7/8,"7/8"],[15/16,"15/16"],[1,""]
      ];
      let result;
      if (frac < 0.01) {
        result = `${whole}`;
      } else {
        let closest = fractions[0];
        for (const f of fractions) {
          if (Math.abs(f[0] - frac) < Math.abs(closest[0] - frac)) closest = f;
        }
        if (closest[0] === 1) result = `${whole + 1}`;
        else result = whole > 0 ? `${whole}-${closest[1]}` : closest[1];
      }
      return neg ? `-${result}` : result;
    }

      const casingMap = [
        [/\bC-?115\b/i, '2-1/2" Colonial (C115)'], [/\bC-?118\b/i, '2-1/2" Colonial (C118)'],
        [/\bH-?115\b/i, '2-1/4" Colonial (H115)'], [/lakeside/i, '2-1/2" Lakeside Colonial (RBA-Lside-2.5)'],
        [/3[\s.-]?1\/4.{0,8}colonial/i, '3-1/4" Colonial (RBA-Col-3.25)'],
        [/2[\s.-]?1\/2.{0,8}colonial/i, '2-1/2" Colonial (C115)'],
        [/2[\s.-]?1\/4.{0,8}colonial/i, '2-1/4" Colonial (H115)'],
        [/2[\s.-]?1\/2.{0,8}flat/i, '2-1/2" Flat (RBA-Flat-2.5)'], [/3[\s.-]?1\/4.{0,8}flat/i, '3-1/4" Flat (RBA-Flat-3.25)'],
        [/2[\s.-]?1\/2.{0,8}ranch/i, '2-1/2" Ranch'], [/2[\s.-]?1\/4.{0,8}ranch/i, '2-1/4" Ranch'],
        [/knotty[\s-]?pine/i, '1x4 Knotty Pine'],
        [/\bS4S[\s-]?3[\s.]?5\b/i, '5/8x4 (RBA-S4S-3.5)'], [/\b1x4[\s-]?S4S\b/i, '5/8x4 (RBA-S4S-3.5)'],
        [/\bS4S[\s-]?2[\s.]?5\b/i, '5/8x3 (RBA-S4S-2.5)'], [/\b1x3[\s-]?S4S\b/i, '5/8x3 (RBA-S4S-2.5)'],
        [/\bRBA[\s-]?S4S\b/i, '5/8x4 (RBA-S4S-3.5)'],
        [/\b1x4\b.*\b(flat|s4s)\b/i, '5/8x4 (RBA-S4S-3.5)'], [/\b1x3\b.*\b(flat|s4s)\b/i, '5/8x3 (RBA-S4S-2.5)'],
      ];
      for (const [pat, label] of casingMap) { if (pat.test(text)) { out.casingProfile = label; break; } }

      // --- Trim style (mitered corners = picture frame) ---
      if (/picture[\s-]?frame|\bmiter/i.test(text)) out.trimStyle = "Picture Frame";
      else if (/traditional|stool\s*(?:and|&|\/)\s*apron/i.test(text)) out.trimStyle = "Traditional";

      return out;
    }

    // ─── CSV PARSER (rSuite Measured Project export) ───
    // rSuite CSV exports are UTF-16 (usually without a BOM) — sniff the encoding.
    function decodeTextBuffer(u8) {
      let enc = "utf-8";
      if (u8[0] === 0xFF && u8[1] === 0xFE) enc = "utf-16le";
      else if (u8[0] === 0xFE && u8[1] === 0xFF) enc = "utf-16be";
      else {
        let nulEven = 0, nulOdd = 0;
        const n = Math.min(u8.length, 4000);
        for (let i = 0; i < n; i++) { if (u8[i] === 0) (i % 2 ? nulOdd++ : nulEven++); }
        if (nulOdd > n / 8) enc = "utf-16le";
        else if (nulEven > n / 8) enc = "utf-16be";
      }
      return new TextDecoder(enc).decode(u8);
    }

    function splitCSVLine(line) {
      const out = [];
      let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQ) {
          if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += ch;
        } else if (ch === '"' && cur.trim() === "") { inQ = true; }
        else if (ch === ",") { out.push(cur.trim()); cur = ""; }
        else cur += ch;
      }
      out.push(cur.trim());
      return out;
    }

    function parseMeasuredProjectCSV(text) {
      const jobInfo = { customerName: "", address: "", poNumber: "", techMeasurer: "", ...detectTrimDetails(text) };
      const rows = text.split(/\r\n|\r|\n/).map(splitCSVLine);

      // Job header: a "Project ID, Address, ..." row followed by the values row.
      const headIdx = rows.findIndex(r => /^project\s*id/i.test(r[0] || ""));
      if (headIdx >= 0 && rows[headIdx + 1]) {
        const keys = rows[headIdx].map(k => k.toLowerCase().replace(/\s+/g, " ").trim());
        const vals = rows[headIdx + 1];
        const get = (name) => { const i = keys.indexOf(name); return i >= 0 ? (vals[i] || "").trim() : ""; };
        jobInfo.customerName = get("primary contact");
        jobInfo.address = [get("address"), get("city"), (get("state") + " " + get("zip")).trim()].filter(Boolean).join(", ");
        jobInfo.techMeasurer = get("tech measure");
      }
      if (!jobInfo.techMeasurer) jobInfo.techMeasurer = TECH_MEASURERS.find(t => text.includes(t)) || "";

      // Unit sections: each starts with a "Unit ID #, ..." header row naming its columns.
      const found = new Map();
      let cols = null;
      for (const r of rows.slice(headIdx >= 0 ? headIdx + 2 : 0)) {
        const first = r[0] || "";
        // Secondary/other-quote sections repeat units with shuffled columns — the
        // sold (measured) section above them is the authoritative one.
        if (/^(secondary|other)\b.*quote/i.test(first)) break;
        if (/^unit\s*id/i.test(first)) {
          cols = {};
          r.forEach((name, i) => { const k = name.toLowerCase().replace(/\s+/g, " ").trim(); if (k && !(k in cols)) cols[k] = i; });
          continue;
        }
        if (!cols || !/^\d{1,4}[Ss]?$/.test(first)) continue;
        const uid = first;
        if (/[Ss]$/.test(uid)) continue; // storm door — no trim
        const idNum = parseInt(uid, 10);
        if (!idNum || idNum >= 900) continue; // misc / job-level line items
        const val = (...names) => { for (const n of names) { const i = cols[n]; if (i != null && r[i]) return r[i]; } return ""; };
        const w = parseFraction(val("final width", "measured width", "interior width", "width"));
        const h = parseFraction(val("final height", "measured height", "interior height", "height"));
        if (w.whole + w.frac < 10 || h.whole + h.frac < 10) continue;
        const typeStr = val("type") + " " + val("style") + " " + val("configuration");
        let unitType = "Window";
        if (/entry/i.test(typeStr)) unitType = "Entry Door";
        else if (/patio|gliding|sliding|french/i.test(typeStr)) unitType = "Patio Door";
        const jd = parseFraction(val("jamb depth"));
        const hasJd = jd.whole + jd.frac >= 2 && jd.whole + jd.frac <= 12;
        if (!found.has(uid)) {
          found.set(uid, {
            unitType, label: uid, location: val("room name", "room"),
            widthWhole: w.whole, widthFrac: w.frac, heightWhole: h.whole, heightFrac: h.frac,
            jambDepthWhole: hasJd ? jd.whole : null, jambDepthFrac: hasJd ? jd.frac : null,
          });
        }
      }

      const units = Array.from(found.values()).sort((a, b) => parseInt(a.label) - parseInt(b.label));
      if (/extension jamb/i.test(text)) units.forEach(u => { if (u.unitType === "Entry Door") u.entryDoorJambs = true; });
      return { jobInfo, units };
    }

    function parseInstallerPackageText(text) {
      const jobInfo = { customerName: "", address: "", poNumber: "", techMeasurer: "", ...detectTrimDetails(text) };

      // --- Tech measurer: find a known tech name anywhere in the text ---
      jobInfo.techMeasurer = TECH_MEASURERS.find(t => text.includes(t)) || "";

      // --- Address: street number + street name + city/state/zip ---
      const addrM = text.match(/(\d+\s+[^\n,]{5,60}(?:Road|Rd|Avenue|Ave|Street|St|Drive|Dr|Lane|Ln|Way|Court|Ct|Blvd|County Road|Cty Rd)[^\n]*)\s*\n\s*([A-Za-z][\w\s]+,\s*[A-Z]{2}\s+\d{5})/i);
      if (addrM) jobInfo.address = `${addrM[1].trim()}, ${addrM[2].trim()}`;

      // --- Customer name: the line directly above the street address ---
      if (addrM) {
        const lines = text.slice(0, addrM.index).split("\n").map(l => l.trim()).filter(Boolean);
        const cand = lines[lines.length - 1] || "";
        if (/^[A-Z][A-Za-z.'-]+(?: [A-Z][A-Za-z.'-]+){1,3}$/.test(cand) && !/renewal|andersen|legal|solutions|inc\b|llc\b/i.test(cand)) {
          jobInfo.customerName = cand;
        }
      }
      // Fallback: name printed after the "dba:" header line (never the "Legal Name:" line)
      if (!jobInfo.customerName) {
        const nameM = text.match(/(?:dba:|RENEWAL BY ANDERSEN)[^\n]*\n\s*(?!Legal\b)([A-Z][a-z]+(?: [A-Z][a-z]+)+)/);
        if (nameM) jobInfo.customerName = nameM[1].trim();
      }

      // --- PO number: starts with R, RD, or RP followed by digits, often near phone numbers ---
      const poM = text.match(/\b(R[PD]?\d[\d-]{3,15})\b/i);
      if (poM) jobInfo.poNumber = poM[1].toUpperCase();

      // --- Units ---
      // Unit IDs are 3-digit numbers at the start of a line (001–899, "S" suffix = storm door)
      const idPat = /(?:^|\n)[ \t]*(\d{3}[Ss]?)\b/g;
      const FRAC = '(\\d+(?:[-\\s]\\d+\\/\\d+)?)';
      // Labeled sizes ('37-9/16" W  81-1/2" H' or '37 9/16" W x 81 1/2" H') are unambiguous
      // and carry the measured size — always prefer them.
      const sizeLabeled = new RegExp(FRAC + '"?\\s*W\\s*(?:x\\s*)?' + FRAC + '"?\\s*H\\b', "g");
      // Two adjacent quoted dimensions — fallback for older package layouts. In newer
      // order summaries this can pair stacked exact/measured widths, so it never
      // overwrites a labeled match.
      const sizePlain = new RegExp(FRAC + '"\\s+' + FRAC + '"', "g");
      const found = new Map();
      const allIds = [...text.matchAll(idPat)];
      // Nearest unit ID to a size match: last ID within 600 chars before it, else first within 400 after
      function nearestId(pos) {
        let b = -1, a = -1;
        for (let i = 0; i < allIds.length; i++) {
          if (allIds[i].index < pos) b = i;
          else { a = i; break; }
        }
        if (b >= 0 && pos - allIds[b].index <= 600) return { i: b, side: "before" };
        if (a >= 0 && allIds[a].index - pos <= 400) return { i: a, side: "after" };
        return null;
      }

      function extractUnitsFromRegex(re, labeled) {
        let sm;
        while ((sm = re.exec(text)) !== null) {
          const w = parseFraction(sm[1]), h = parseFraction(sm[2]);
          // Skip tiny/zero dimensions (headers, misc lines)
          if (w.whole + w.frac < 10 || h.whole + h.frac < 10) continue;
          const near = nearestId(sm.index);
          if (!near) continue;
          const idM = allIds[near.i];
          const uid = idM[1];
          if (/[Ss]$/.test(uid)) continue; // storm door — no trim details needed
          const idNum = parseInt(uid, 10);
          if (!idNum || idNum >= 900) continue;

          // Unit type + jamb depth: scan this unit's own block only — clip at the
          // neighboring unit IDs so packed order summaries don't bleed into each other
          const blockStart = near.side === "before"
            ? idM.index + idM[0].length
            : Math.max(near.i > 0 ? allIds[near.i - 1].index + allIds[near.i - 1][0].length : 0, sm.index - 600);
          const nextId = allIds[near.i + 1];
          const blockEnd = Math.min(nextId ? nextId.index : text.length, sm.index + 1200);
          const ctx = text.slice(blockStart, blockEnd);
          let unitType = "Window";
          if (/entry[\s-]?door/i.test(ctx)) unitType = "Entry Door";
          else if (/patio[\s-]?door/i.test(ctx)) unitType = "Patio Door";

          const jdM = ctx.match(/Jamb\s*Depth:?\s*(\d+(?:[-\s]\d+\/\d+)?)/i);
          const jd = jdM ? parseFraction(jdM[1]) : null;
          const hasJd = jd && jd.whole + jd.frac >= 2 && jd.whole + jd.frac <= 12;

          // Room: the text between the unit ID and its size is the room name
          // ("001  Downstairs  37-9/16"..." or "001 \nDownstairs \n37-9/16" W").
          // That rule only applies when the ID sits *before* the size.
          let location = "", roomConfident = false;
          if (near.side === "before") {
            const between = text.slice(idM.index + idM[0].length, sm.index).replace(/\s+/g, " ").trim();
            if (/^[A-Za-z][A-Za-z0-9 /'&-]{1,29}$/.test(between) && !/misc|window|door|unit|job|page|notes/i.test(between)) {
              location = between;
              roomConfident = true;
            }
          }
          if (!location) {
            const rooms = ["Living","Dining","Kitchen","Master Bedroom","Bedroom","Bathroom","Bath","Office","Family Room","Garage","Basement","Downstairs","Upstairs","Sunroom","Laundry","Mudroom","Hallway","Entry(?!\\s*Door)","Foyer","Den","Loft","Porch","Nook","Stairway"];
            for (const r of rooms) {
              const m = ctx.match(new RegExp("\\b" + r + "\\b", "i"));
              if (m) { location = m[0]; break; }
            }
          }

          const prev = found.get(uid);
          // Labeled sizes always win; within the same tier prefer fractional sizes
          const hasFrac = w.frac > 0 || h.frac > 0;
          if (prev && prev.labeled && !labeled) continue;
          if (!prev || (labeled && !prev.labeled) || hasFrac) {
            // A room read straight off the unit's own line beats a nearby-text guess
            if (prev && prev.roomConfident && !roomConfident) { location = prev.location; roomConfident = true; }
            found.set(uid, {
              unitType, label: uid, location, roomConfident, labeled,
              widthWhole: w.whole, widthFrac: w.frac, heightWhole: h.whole, heightFrac: h.frac,
              jambDepthWhole: hasJd ? jd.whole : (prev?.jambDepthWhole ?? null),
              jambDepthFrac: hasJd ? jd.frac : (prev?.jambDepthFrac ?? null),
            });
          } else if (prev && hasJd && prev.jambDepthWhole == null) {
            prev.jambDepthWhole = jd.whole; prev.jambDepthFrac = jd.frac;
          }
        }
      }

      extractUnitsFromRegex(sizeLabeled, true);
      extractUnitsFromRegex(sizePlain, false);

      const units = Array.from(found.values()).sort((a, b) => parseInt(a.label) - parseInt(b.label));
      units.forEach(u => { delete u.labeled; delete u.roomConfident; });
      if (/extension jamb/i.test(text)) units.forEach(u => { if (u.unitType === "Entry Door") u.entryDoorJambs = true; });
      return { jobInfo, units };
    }

    function calcMaterials(unit, catalog) {
      const h = combineMeasurement(unit.heightWhole, unit.heightFrac);
      const w = combineMeasurement(unit.widthWhole, unit.widthFrac);
      const jd = combineMeasurement(unit.jambDepthWhole, unit.jambDepthFrac);
      const off = loadOffsets();
      const t = off.thickness;
      const materials = [];

      const skipCasing = unit.casingProfile === "None" || unit.casingProfile === "Customer Supplying";
      // Casing length = dimension + 2× casing width (miter overhang both ends) + offset
      const casingW = skipCasing ? 0 : getProfileWidth(unit.casingProfile, catalog);
      const skipJambs = unit.jambMaterial === "None" || unit.jambMaterial === "Customer Supplying";
      const jambSp = unit.jambSpecies || unit.species;
      // Manual jamb material override — use selected stock instead of auto-calculating
      const manualJambStock = unit.jambMaterial && !skipJambs
        ? findJambStock(unit.jambMaterial, catalog) : null;
      const resolveJambStock = (calcWidth) => manualJambStock || getJambStockWidth(calcWidth, catalog);
      const resolveJambWidth = (calcWidth) => manualJambStock ? manualJambStock.width : calcWidth;

      if (unit.unitType === "Window") {
        if (unit.trimStyle === "Stops") {
          if (unit.stopProfile !== "None" && unit.stopCoverage !== "None") {
            const stopW = getStopProfileWidth(unit.stopProfile, catalog);
            const isAllSides = unit.stopCoverage !== "Sides and Top";
            materials.push(
              { name: "Side Stop", qty: 2, length: h, width: stopW, thickness: null, species: unit.species, category: "Stop", profile: unit.stopProfile },
              { name: isAllSides ? "Top/Bottom Stop" : "Top Stop", qty: isAllSides ? 2 : 1, length: w, width: stopW, thickness: null, species: unit.species, category: "Stop", profile: unit.stopProfile }
            );
          }
        } else if (unit.trimStyle === "Picture Frame") {
          const o = off.window_pf;
          const jw = jd + o.jamb_width;
          if (!skipJambs) {
            materials.push(
              { name: "Side Jamb Extension", qty: 2, length: h + o.sideJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
              { name: "Top/Bottom Jamb Extension", qty: 2, length: w + o.topBottomJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
            );
          }
          if (!skipCasing) {
            materials.push(
              { name: "Side Casing", qty: 2, length: h + casingW * 2 + o.sideCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
              { name: "Top/Bottom Casing", qty: 2, length: w + casingW * 2 + o.topBottomCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile }
            );
          }
        } else {
          const o = off.window_trad;
          const jw = jd + o.jamb_width;
          if (!skipJambs) {
            const stoolW = resolveJambWidth(jw) + o.stool_width_extra;
            // Stools are always 3/4" (or 5/4" when toggled), never the 5/8" jamb stock.
            const stoolStock = getStoolStock(stoolW, unit.stool5_4);
            const stoolThick = stoolStock.thickness;
            materials.push(
              { name: "Side Jamb Extension", qty: 2, length: h + o.sideJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
              { name: "Head Jamb Extension", qty: 1, length: w + o.headJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
              // Stool spans the casings plus a 1" horn each side: W + 2x casing width + 2, then offset
              { name: "Sill / Stool", qty: 1, length: w + casingW * 2 + 2 + o.stool_length, width: stoolW, thickness: stoolThick, species: jambSp, category: "Jamb", jambStock: stoolStock },
            );
          }
          if (!skipCasing) {
            materials.push(
              // Traditional sides miter only at the top (bottom lands on the stool) — 1x width
              { name: "Side Casing", qty: 2, length: h + casingW + o.sideCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
              { name: "Head Casing", qty: 1, length: w + casingW * 2 + o.headCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
              { name: "Apron", qty: 1, length: w + casingW * 2 + o.apron_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile }
            );
          }
        }
      } else if (unit.unitType === "Entry Door") {
        const o = off.entry_door;
        if (unit.entryDoorJambs && !skipJambs) {
          const jw = jd + (o.jamb_width ?? -4.5625);
          materials.push(
            { name: "Side Jamb Extension", qty: 2, length: h + (o.sideJamb_length ?? 2), width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
            { name: "Head Jamb Extension", qty: 1, length: w + (o.headJamb_length ?? 2), width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
          );
        }
        if (!skipCasing) {
          materials.push(
            { name: "Side Casing", qty: 2, length: h + casingW + o.sideCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
            { name: "Head Casing", qty: 1, length: w + casingW * 2 + o.headCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
          );
        }
        if (unit.thresholdSpecies && unit.thresholdSpecies !== "None") {
          materials.push({ name: "Threshold", qty: 1, length: w + o.threshold_length, width: null, thickness: null, species: unit.thresholdSpecies, category: "Threshold" });
        }
      } else if (unit.unitType === "Patio Door") {
        const o = off.patio_door;
        const jw = jd + o.jamb_width;
        if (!skipJambs) {
          materials.push(
            { name: "Side Jamb Extension", qty: 2, length: h + o.sideJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
            { name: "Head Jamb Extension", qty: 1, length: w + o.headJamb_length, width: resolveJambWidth(jw), thickness: t, species: jambSp, category: "Jamb", jambStock: resolveJambStock(jw) },
          );
        }
        if (!skipCasing) {
          materials.push(
            { name: "Side Casing", qty: 2, length: h + casingW + o.sideCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
            { name: "Head Casing", qty: 1, length: w + casingW * 2 + o.headCasing_length, width: getProfileWidth(unit.casingProfile, catalog), thickness: null, species: unit.species, category: "Casing", profile: unit.casingProfile },
          );
        }
        if (unit.thresholdSpecies && unit.thresholdSpecies !== "None") {
          materials.push({ name: "Threshold", qty: 1, length: w + o.threshold_length, width: null, thickness: null, species: unit.thresholdSpecies, category: "Threshold" });
        }
      }
      // Update jamb thickness based on stock size (5/8x4, 5/8x6 = 5/8"; 3/4x8+ = 3/4")
      materials.forEach(m => {
        if (m.jambStock && m.jambStock.thickness != null) {
          m.thickness = m.jambStock.thickness;
        }
      });
      // Basswood only comes in 5/8" — force all basswood jamb/stool stock to the
      // 5/8" board of the same width (no 3/4"/5/4" basswood is ever carried).
      materials.forEach(m => {
        if (m.species === "Basswood" && m.jambStock) {
          m.jambStock = basswoodStockFor(m.jambStock.width);
          m.thickness = 0.625;
        }
      });

      // Apply custom trim overrides
      if (unit.customTrimPieces && unit.customTrimPieces.length > 0) {
        // "Head Casing" (traditional/doors) and "Top Casing" refer to the same
        // horizontal top piece — treat them as aliases so an override replaces the
        // auto-generated piece instead of being added as a duplicate.
        const HEAD_CASING_ALIASES = ["Head Casing", "Top Casing"];
        unit.customTrimPieces.forEach(ctp => {
          // Find and replace matching piece, or add as new
          const aliases = HEAD_CASING_ALIASES.includes(ctp.piece) ? HEAD_CASING_ALIASES : [ctp.piece];
          // "Other" is a free-form catch-all, so each one is its own line item.
          // Never match an existing material — otherwise a second "Other" would
          // find the first and overwrite it instead of adding alongside it.
          const isOther = ctp.piece === "Other";
          const matchIdx = isOther ? -1 : materials.findIndex(m => aliases.includes(m.name));
          const isJamb = ctp.piece.includes("Jamb") || ctp.piece.includes("Stool") || ctp.piece.includes("Sill");
          // Resolve the selected profile explicitly: jamb-stock labels for jamb/stool
          // pieces, then casing, then stop profiles. (getProfileWidth alone always
          // falls back to a number, which made the stop lookup unreachable and
          // silently ignored a picked jamb stock like "3/4x10".)
          const jambStockOverride = isJamb ? findJambStock(ctp.profile, catalog) : null;
          const casingMatch = catalog?.casingProfiles?.find(p => p.label === ctp.profile) || CASING_PROFILES.find(p => p.label === ctp.profile);
          const stopMatch = catalog?.stopProfiles?.find(p => p.label === ctp.profile) || STOP_PROFILES.find(p => p.label === ctp.profile);
          const profileWidth = jambStockOverride?.width ?? casingMatch?.width ?? stopMatch?.width ?? 3.5;
          const explicitThickness = ctp.thickness ? parseFloat(ctp.thickness) : null;
          const override = {
            // Name an "Other" after its profile so several of them stay tellable
            // apart on the report instead of all reading "Other".
            name: isOther && ctp.profile ? ctp.profile : ctp.piece,
            qty: ctp.qty || 1,
            length: matchIdx >= 0 ? materials[matchIdx].length : (ctp.piece.includes("Side") ? h : w),
            // Custom (typed) profile — width is unknown, so leave it blank rather than guess
            width: ctp.customProfile ? null : (isJamb ? (jambStockOverride?.width ?? materials[matchIdx]?.width ?? profileWidth) : profileWidth),
            thickness: explicitThickness != null ? explicitThickness : (isJamb ? t : null),
            species: ctp.species || unit.species,
            category: isJamb ? "Jamb" : (ctp.piece.includes("Stop") ? "Stop" : "Casing"),
            profile: isJamb ? null : ctp.profile,
            jambStock: isJamb ? (jambStockOverride || materials[matchIdx]?.jambStock || getJambStockWidth(profileWidth, catalog)) : undefined,
            stockLengths: (ctp.stockLengths && ctp.stockLengths.length) ? ctp.stockLengths : undefined,
          };
          if (matchIdx >= 0) {
            materials[matchIdx] = override;
          } else {
            materials.push(override);
          }
        });
      }

      return materials;
    }

    function emptyUnit(num) {
      return {
        id: Date.now() + Math.random(),
        label: "",
        location: "",
        unitType: "Window",
        species: "Oak",
        trimStyle: "Traditional",
        thresholdSpecies: '1-1/4" x 8\' Oak',
        casingProfile: '2-1/2" Colonial (C115)',
        finishType: "Stain",
        finish: "",
        widthWhole: "",
        widthFrac: 0,
        heightWhole: "",
        heightFrac: 0,
        jambDepthWhole: "",
        jambDepthFrac: 0,
        jambSpecies: "Oak",
        jambMaterial: "",
        entryDoorJambs: false,
        stopCoverage: "All Sides",
        stopProfile: "1x4 Stop",
        customTrimPieces: [],
        manualMaterials: [],
      };
    }

    // Storm doors carry a trailing "S" on their unit ID (e.g. "101S") and need no trim.
    function isStormDoor(u) {
      return /^\s*\d+\s*[Ss]\s*$/.test(String(u?.label ?? ""));
    }

    function isUnitComplete(u) {
      if (!u.heightWhole || !u.widthWhole) return false;
      // Jamb depth isn't needed for Stops trim, for entry doors without
      // extension jambs, or when jambs are "None" — mirror the editor's needsJD
      // logic, otherwise these units can never be complete and get silently
      // dropped from the calc.
      const needsJD = u.trimStyle !== "Stops" && (u.unitType !== "Entry Door" || u.entryDoorJambs) && u.jambMaterial !== "None";
      if (needsJD && !u.jambDepthWhole) return false;
      return true;
    }

    // ─── SAVED JOBS (localStorage) ───
    function loadSavedJobs() {
      try {
        const data = localStorage.getItem("cutlist_jobs");
        return data ? JSON.parse(data) : [];
      } catch { return []; }
    }
    function saveJobToStorage(jobData) {
      try {
        const jobs = loadSavedJobs();
        const existing = jobs.findIndex(j => j.id === jobData.id);
        if (existing >= 0) jobs[existing] = jobData;
        else jobs.unshift(jobData);
        localStorage.setItem("cutlist_jobs", JSON.stringify(jobs.slice(0, 50)));
      } catch {}
    }
    function deleteJobFromStorage(jobId) {
      try {
        const jobs = loadSavedJobs().filter(j => j.id !== jobId);
        localStorage.setItem("cutlist_jobs", JSON.stringify(jobs));
      } catch {}
    }

    // ─── PENDING SYNC QUEUE (jobs saved while offline) ───
    // Full job payloads that failed to reach the server. Kept in their own key so
    // they survive the localStorage cache being overwritten by a server fetch.
    function loadPendingJobs() {
      try {
        const data = localStorage.getItem("cutlist_pending");
        return data ? JSON.parse(data) : [];
      } catch { return []; }
    }
    function queuePendingJob(jobData) {
      try {
        const pending = loadPendingJobs().filter(j => j.id !== jobData.id);
        pending.push(jobData);
        localStorage.setItem("cutlist_pending", JSON.stringify(pending));
      } catch {}
    }
    function unqueuePendingJob(jobId) {
      try {
        const pending = loadPendingJobs().filter(j => j.id !== jobId);
        localStorage.setItem("cutlist_pending", JSON.stringify(pending));
      } catch {}
    }

    // ─── SHARED STORAGE API (Netlify Blobs) ───
    // All API calls try the server first, fall back to localStorage when offline.

    async function apiRequest(path, method = "GET", body = null) {
      const opts = { method, headers: {} };
      if (body) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(`API ${res.status}`);
      return res.json();
    }

    // Jobs API
    async function fetchJobsFromAPI() {
      try {
        let jobs = await apiRequest("/api/jobs");
        if (!Array.isArray(jobs)) jobs = [];
        // Pending local edits (offline saves or in-flight posts) are newer than
        // the server copy — overlay them so a fetch can't clobber unsynced work
        const pending = loadPendingJobs();
        if (pending.length) {
          const byId = new Map(jobs.map(j => [j.id, j]));
          pending.forEach(p => byId.set(p.id, p));
          jobs = [...byId.values()].sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""));
          // The server is clearly reachable — flush the queue in the background
          syncPendingJobs();
        }
        // Cache to localStorage for offline fallback
        localStorage.setItem("cutlist_jobs", JSON.stringify(jobs.slice(0, 50)));
        return jobs;
      } catch {
        return loadSavedJobs(); // offline fallback
      }
    }
    async function saveJobToAPI(jobData) {
      // Always save to localStorage as backup. Queue BEFORE the POST so a
      // concurrent fetch overlays this copy instead of resurrecting the old one.
      saveJobToStorage(jobData);
      queuePendingJob(jobData);
      try {
        await apiRequest("/api/jobs", "POST", jobData);
        unqueuePendingJob(jobData.id); // server confirmed — no longer pending
        return true;
      } catch {
        return false; // stays queued — retried on reconnect / next fetch
      }
    }
    // Push any offline-saved jobs to the server. Returns the number synced.
    // Stops on the first failure (still offline) and leaves the rest queued.
    async function syncPendingJobs() {
      const pending = loadPendingJobs();
      if (!pending.length) return 0;
      let synced = 0;
      for (const job of pending) {
        try {
          await apiRequest("/api/jobs", "POST", job);
          unqueuePendingJob(job.id);
          synced++;
        } catch {
          break; // still offline — keep the remaining jobs queued
        }
      }
      return synced;
    }
    async function deleteJobFromAPI(jobId) {
      deleteJobFromStorage(jobId);
      unqueuePendingJob(jobId); // never let a queued offline save resurrect a deleted job
      try {
        await apiRequest("/api/jobs?id=" + encodeURIComponent(jobId), "DELETE");
        return true;
      } catch {
        return false;
      }
    }

    // Jobs whose PDF has already been pushed to the joblist app this session.
    // Cleared per-job on (re)submit so a resubmit pushes the updated PDF.
    const joblistPushed = new Set();
    // Whether the joblist integration is wired up (JOBLIST_API_URL/KEY env vars).
    // Cached after the first check so we don't generate PDFs when it's a no-op.
    async function isJoblistConfigured() {
      try {
        const res = await fetch("/api/push-to-joblist");
        if (!res.ok) return false;
        const data = await res.json();
        return !!data.configured;
      } catch {
        return false;
      }
    }
    // Sends the material-list PDF to the external joblist app (server-side function
    // holds the API key). No-ops gracefully when the joblist isn't configured/offline.
    async function pushPdfToJoblist(payload) {
      try {
        const res = await fetch("/api/push-to-joblist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) return { pushed: false };
        return await res.json();
      } catch {
        return { pushed: false };
      }
    }

    // Aggregate the optimized board list (the same math the PDF's Job Summary
    // uses) to linear feet per (materialType, profile / jamb stock, species,
    // finish), for the joblist app's cost analysis. DATA ONLY — sent alongside
    // the PDF push, never rendered on the printed material list (LF stays off
    // the PDFs by design). Thresholds are pre-made products excluded from board
    // stock, so their piece lengths are added from calcMaterials directly.
    // Fail-open: any error returns null so the PDF push can never break on it.
    function buildMaterialLf(units, job, catalog, boardWaste) {
      try {
        const result = optimizeBoards(units, catalog, job.optimizePerUnit, boardWaste);
        const boards = [...result.boards, ...normalizeExtraBoards(job.extraBoards, units, catalog)];
        const agg = new Map();
        const add = (key, seed, feet) => {
          const cur = agg.get(key) || { ...seed, feet: 0, boards: 0 };
          cur.feet += feet;
          cur.boards++;
          agg.set(key, cur);
        };
        boards.forEach(b => {
          if (!b.stockLength) return;
          const jamb = b.jambStock ? b.jambStock.label : null;
          const key = [b.materialType, b.profile || "", jamb || "", b.species, b.finish || ""].join("|");
          add(key, { materialType: b.materialType, profileCode: b.profile || null, jambStock: jamb, species: b.species, finish: b.finish || null }, b.stockLength / 12);
        });
        (units || []).forEach(u => {
          if (isStormDoor(u) || !isUnitComplete(u)) return;
          calcMaterials(u, catalog).forEach(m => {
            if (m.category !== "Threshold") return;
            const key = ["Threshold", "", "", m.species, u.finish || ""].join("|");
            add(key, { materialType: "Threshold", profileCode: null, jambStock: null, species: m.species, finish: u.finish || null }, ((m.length || 0) / 12) * (m.qty || 1));
          });
        });
        const lines = [...agg.values()]
          .map(l => ({ ...l, feet: Math.round(l.feet * 10) / 10 }))
          .filter(l => l.feet > 0);
        return lines.length ? { lines, savedAt: new Date().toISOString() } : null;
      } catch (e) {
        console.warn("materialLf aggregation failed", e);
        return null;
      }
    }

    // ONE-TIME BACKFILL HOOK (2026-07-29): compute + push LF cost data for every
    // SAVED job, without touching the stored PDFs. Run from the browser console:
    //   await window.__joblistLfBackfill()      → dry-run (computes, pushes nothing)
    //   await window.__joblistLfBackfill(true)  → push to the joblist app
    // Every normal submit already pushes LF automatically — this only exists to
    // seed history. Harmless to leave in place; it does nothing unless called.
    window.__joblistLfBackfill = async function (write = false) {
      const [jobsList, catalog, offsetsApi] = await Promise.all([
        apiRequest("/api/jobs"),
        fetchCatalogFromAPI(),
        fetchOffsetsFromAPI(),
      ]);
      const offsets = { ...DEFAULT_OFFSETS, ...(offsetsApi || {}) };
      const out = [];
      for (const rec of jobsList || []) {
        const job = rec.job || {};
        const units = rec.units || [];
        const name = job.customerName || rec.id;
        if (!job.poNumber) { out.push({ name, skip: "no PO #" }); continue; }
        const materialLf = buildMaterialLf(units, job, catalog, offsets.boardWaste);
        if (!materialLf) { out.push({ name, po: job.poNumber, skip: "no LF (no complete units)" }); continue; }
        const feet = Math.round(materialLf.lines.reduce((s, l) => s + l.feet, 0));
        let pushed = "dry-run";
        if (write) {
          const res = await pushPdfToJoblist({
            jobId: rec.id,
            customerName: job.customerName || "",
            poNumber: job.poNumber || "",
            savedAt: rec.savedAt || new Date().toISOString(),
            materialLf,
          });
          pushed = res && res.pushed ? "pushed" : "FAILED";
        }
        out.push({ name, po: job.poNumber, lines: materialLf.lines.length, feet, pushed });
      }
      console.table(out);
      return out;
    };

    // Catalog API
    // Bring a catalog's jamb stock up to date: rename legacy "1xN" labels to canonical
    // stock labels so toggles match the calc, ensure Basswood-only widths (5/8x8/10/12)
    // exist (basswood relabels wide stock to 5/8xN), and dedupe by label — a length
    // stays OFF if OFF in any duplicate, custom lengths are unioned. Idempotent.
    function migrateJambStock(data) {
      if (!data) return data;
      data.jambStock = data.jambStock || [];
      data.jambStock.forEach(item => {
        if (JAMB_STOCK_RENAMES[item.label]) item.label = JAMB_STOCK_RENAMES[item.label];
      });
      const merged = [];
      data.jambStock.forEach(item => {
        const existing = merged.find(j => j.label === item.label);
        if (!existing) { merged.push(item); return; }
        existing.extraLengths = [...new Set([...(existing.extraLengths || []), ...(item.extraLengths || [])])];
        existing.availability = existing.availability || {};
        ALL_SPECIES.forEach(sp => {
          const b = item.availability?.[sp] || {};
          existing.availability[sp] = { ...b, ...(existing.availability[sp] || {}) };
          Object.keys(b).forEach(k => { if (b[k] === false) existing.availability[sp][k] = false; });
        });
      });
      BASSWOOD_STOCK_5_8.forEach(b => {
        if (!merged.some(j => j.label === b.label)) {
          merged.push({ label: b.label, width: b.width, availability: makeAvailability(), extraLengths: [] });
        }
      });
      data.jambStock = merged;
      return data;
    }

    // Re-sync casing profile labels from their rename map / stable code (e.g.
    // "1x4 (RBA-S4S-3.5)" -> "5/8x4 (RBA-S4S-3.5)"). Units store the normalized label,
    // so the catalog must match or the optimizer can't find a profile's availability.
    function syncCasingLabels(data) {
      if (!data) return data;
      (data.casingProfiles || []).forEach(item => {
        item.label = normalizeCasingProfile(item.label);
        const canonical = CASING_PROFILES.find(p => p.code === item.code);
        if (canonical && item.label !== canonical.label) item.label = canonical.label;
      });
      return data;
    }

    function migrateCatalog(data) {
      if (data && !data.stopProfiles) {
        data.stopProfiles = STOP_PROFILES.map(p => ({
          label: p.label, code: p.code, width: p.width, pineOnly: p.pineOnly || false,
          availability: makeAvailability()
        }));
      }
      // Ensure each item has an extraLengths array (for custom stockpile lengths like 14')
      if (data) {
        ["casingProfiles", "jambStock", "stopProfiles"].forEach(sec => {
          (data[sec] || []).forEach(item => {
            if (!Array.isArray(item.extraLengths)) item.extraLengths = [];
          });
        });
        syncCasingLabels(data);
        migrateJambStock(data);
      }
      return data;
    }

    async function fetchCatalogFromAPI() {
      try {
        const data = await apiRequest("/api/catalog");
        if (data) {
          const migrated = migrateCatalog(data);
          localStorage.setItem("cutlist_lumber_catalog", JSON.stringify(migrated));
          return migrated;
        }
        return null; // not yet seeded on server
      } catch {
        return null; // offline — caller uses localStorage
      }
    }
    async function saveCatalogToAPI(catalog) {
      saveCatalog(catalog);
      try {
        await apiRequest("/api/catalog", "PUT", catalog);
        return true;
      } catch {
        return false;
      }
    }

    // Offsets API
    async function fetchOffsetsFromAPI() {
      try {
        const data = await apiRequest("/api/offsets");
        if (data) {
          localStorage.setItem("cutlist_offsets", JSON.stringify(data));
          return data;
        }
        return null;
      } catch {
        return null;
      }
    }
    async function saveOffsetsToAPI(offsets) {
      saveOffsets(offsets);
      try {
        await apiRequest("/api/offsets", "PUT", offsets);
        return true;
      } catch {
        return false;
      }
    }


    // ─── DEFAULT OFFSETS ───
    const DEFAULT_OFFSETS = {
      window_pf: { sideJamb_length: -1.25, topBottomJamb_length: 0, jamb_width: -2.75, sideCasing_length: -1, topBottomCasing_length: 0 },
      window_trad: { sideJamb_length: -1.25, headJamb_length: 0, jamb_width: -2.75, stool_length: 10, stool_width_extra: 2, sideCasing_length: -1, headCasing_length: 0, apron_length: 10 },
      entry_door: { sideCasing_length: 6, headCasing_length: 8, threshold_length: 8, sideJamb_length: 2, headJamb_length: 2, jamb_width: -4.5625 },
      patio_door: { sideJamb_length: 2, headJamb_length: 2, sillJamb_length: 2, jamb_width: -4.5625, sideCasing_length: 6, headCasing_length: 8, threshold_length: 8 },
      bending_metal: { side_addon: 1, top_addon: 3, bottom_addon: 3, coil_width: 24, strip_width: 5 },
      thickness: 0.625,
      boardWaste: 5,
    };

    function loadOffsets() {
      try { const d = localStorage.getItem("cutlist_offsets"); return d ? { ...DEFAULT_OFFSETS, ...JSON.parse(d) } : { ...DEFAULT_OFFSETS }; }
      catch { return { ...DEFAULT_OFFSETS }; }
    }
    function saveOffsets(offsets) {
      try { localStorage.setItem("cutlist_offsets", JSON.stringify(offsets)); } catch {}
    }

    // ─── LUMBER CATALOG ───
    const ALL_SPECIES = SPECIES;
    const ALL_LENGTHS = [{ key: "96", label: "8'" }, { key: "120", label: "10'" }, { key: "144", label: "12'" }];

    function makeAvailability() {
      const a = {};
      ALL_SPECIES.forEach(s => { a[s] = {}; ALL_LENGTHS.forEach(l => a[s][l.key] = true); });
      return a;
    }
    function defaultCatalog() {
      return {
        casingProfiles: CASING_PROFILES.map(p => ({
          label: p.label, code: p.code, width: p.width, pineOnly: p.pineOnly || false,
          availability: makeAvailability()
        })),
        jambStock: [
          ...JAMB_STOCK_WIDTHS.map(j => ({ label: j.label, width: j.width, availability: makeAvailability() })),
          // Basswood-only 5/8" wide widths (8/10/12) — basswood relabels wide jamb
          // stock to 5/8xN, so these must exist for availability/length toggles to match.
          ...BASSWOOD_STOCK_5_8
            .filter(b => !JAMB_STOCK_WIDTHS.some(j => j.label === b.label))
            .map(b => ({ label: b.label, width: b.width, availability: makeAvailability() })),
        ],
        stopProfiles: STOP_PROFILES.map(p => ({
          label: p.label, code: p.code, width: p.width, pineOnly: p.pineOnly || false,
          availability: makeAvailability()
        })),
        stains: {},
        paints: {},
      };
    }
    function loadCatalog() {
      try {
        const d = localStorage.getItem("cutlist_lumber_catalog");
        if (!d) return defaultCatalog();
        const parsed = JSON.parse(d);
        // Migrate: if old format (not array, or missing availability), reset to defaults
        if (parsed.casingProfiles && !Array.isArray(parsed.casingProfiles)) return defaultCatalog();
        if (parsed.casingProfiles?.[0] && !parsed.casingProfiles[0].availability) return defaultCatalog();
        // Migrate: add stopProfiles if missing
        if (!parsed.stopProfiles) {
          parsed.stopProfiles = STOP_PROFILES.map(p => ({
            label: p.label, code: p.code, width: p.width, pineOnly: p.pineOnly || false,
            availability: makeAvailability()
          }));
        }
        // Migrate: ensure each item has extraLengths
        ["casingProfiles", "jambStock", "stopProfiles"].forEach(sec => {
          (parsed[sec] || []).forEach(item => {
            if (!Array.isArray(item.extraLengths)) item.extraLengths = [];
          });
        });
        // Migrate: re-sync casing profile labels (handles renames) — see syncCasingLabels.
        syncCasingLabels(parsed);
        // Migrate jamb stock: rename legacy "1xN" labels, ensure Basswood-only widths,
        // and dedupe — see migrateJambStock.
        migrateJambStock(parsed);
        return parsed;
      } catch { return defaultCatalog(); }
    }
    function saveCatalog(catalog) {
      try { localStorage.setItem("cutlist_lumber_catalog", JSON.stringify(catalog)); } catch {}
    }

    // Dynamic stock label lookup — supports any custom length added in the catalog
    const STOCK_LABELS_PROXY = new Proxy({}, {
      get: (_, key) => formatStockLabel(key),
      has: () => true,
    });

    // ─── BOARD OPTIMIZER ───
    // Groups cuts by material type + species + finish, then bin-packs into standard lengths
    function optimizeBoards(units, catalog, perUnit, boardWaste) {
      // Per-unit mode: run optimizer separately for each unit, then combine
      if (perUnit) {
        let allBoards = [];
        const allWarnings = [];
        units.forEach(unit => {
          const result = optimizeBoards([unit], catalog, false, boardWaste);
          allBoards.push(...result.boards);
          allWarnings.push(...result.warnings);
        });
        allBoards.sort((a, b) => {
          if (a.materialType !== b.materialType) return a.materialType.localeCompare(b.materialType);
          if (a.species !== b.species) return a.species.localeCompare(b.species);
          return b.stockLength - a.stockLength;
        });
        const summary = {};
        allBoards.forEach(board => { summary[board.stockLength] = (summary[board.stockLength] || 0) + 1; });
        return { boards: allBoards, summary, warnings: allWarnings, STOCK_LABELS: STOCK_LABELS_PROXY };
      }
      // 8'/10'/12' standard, plus any custom lengths declared in the catalog
      const ALL_STOCK_LENGTHS = [...new Set([96, 120, 144, ...getCatalogExtraLengths(catalog)])].sort((a, b) => a - b);
      const STOCK_LABELS = STOCK_LABELS_PROXY;

      const MIN_CUTOFF = boardWaste ?? 5; // configurable waste per board from offsets
      const KERF = 0.125; // 1/8" saw blade kerf between cuts

      // Collect all cuts from all units
      const allCuts = [];
      units.forEach(unit => {
        if (isStormDoor(unit)) return; // storm doors need no trim
        if (!isUnitComplete(unit)) return;
        const mats = calcMaterials(unit, catalog);
        mats.forEach(m => {
          if (m.category === "Threshold") return; // thresholds are pre-made products, not cut from stock
          for (let i = 0; i < m.qty; i++) {
            allCuts.push({
              length: m.length, // bad-end waste is reserved once per board, not per cut
              rawLength: m.length,
              materialType: m.name.includes("Jamb") || m.name.includes("Sill") || m.name.includes("Stool") ? "Jamb Extension" : m.name.includes("Apron") ? "Apron" : m.category === "Stop" ? "Stop" : "Casing",
              species: m.species,
              finish: unit.finish || "",
              profile: m.profile || null,
              width: m.width,
              thickness: m.thickness,
              jambStock: m.jambStock || null,
              stockLengths: m.stockLengths || null,
              source: unit.label + (unit.location ? " (" + unit.location + ")" : ""),
              cutName: m.name,
            });
          }
        });
      });

      // Group cuts by material type + species + finish + profile + jambStock
      const groups = {};
      allCuts.forEach(cut => {
        const key = [cut.materialType, cut.species, cut.finish, cut.profile || "none", cut.jambStock ? cut.jambStock.label : "none", cut.stockLengths ? cut.stockLengths.join(",") : "auto"].join("|");
        if (!groups[key]) {
          groups[key] = {
            materialType: cut.materialType,
            species: cut.species,
            finish: cut.finish,
            profile: cut.profile,
            jambStock: cut.jambStock,
            width: cut.width,
            thickness: cut.thickness,
            stockLengths: cut.stockLengths,
            cuts: []
          };
        }
        groups[key].cuts.push(cut);
      });

      // For each group, try ALL possible combinations of stock lengths and pick the one with least total waste
      const allBoards = [];
      const warnings = []; // cuts that don't fit any available stock length
      Object.values(groups).forEach(group => {
        const allSorted = [...group.cuts].sort((a, b) => b.length - a.length);

        // Determine available stock lengths for this group's species from catalog
        const section = group.materialType === "Casing" ? "casingProfiles" : group.materialType === "Stop" ? "stopProfiles" : "jambStock";
        const itemLabel = section === "jambStock" ? (group.jambStock ? group.jambStock.label : null) : group.profile;
        let STOCK_LENGTHS = (group.stockLengths && group.stockLengths.length)
          ? group.stockLengths
          : (catalog ? getAvailableLengthsForItem(catalog, group.species, section, itemLabel) : ALL_STOCK_LENGTHS);
        STOCK_LENGTHS = STOCK_LENGTHS.filter(l => ALL_STOCK_LENGTHS.includes(l)).sort((a, b) => a - b);
        if (!STOCK_LENGTHS.length) STOCK_LENGTHS = ALL_STOCK_LENGTHS;
        const maxStock = STOCK_LENGTHS[STOCK_LENGTHS.length - 1];

        // Cuts longer than the longest available board can't be made from a single
        // board — they must be spliced across multiple boards. Allocate those up front
        // (ceil of needed length over the max board) so quantities are never short.
        const splicedBoards = [];
        const sorted = [];
        const usableMax = Math.max(1, maxStock - MIN_CUTOFF); // per-board waste reserve
        allSorted.forEach(cut => {
          if (cut.length > usableMax) {
            const n = Math.ceil(cut.length / usableMax);
            warnings.push({
              source: cut.source,
              cutName: cut.cutName,
              length: cut.rawLength,
              material: `${group.species} ${group.profile || (group.jambStock && group.jambStock.label) || group.materialType}`,
              maxStock,
              pieces: n,
            });
            let remainingLen = cut.length;
            for (let i = 0; i < n; i++) {
              const seg = Math.min(remainingLen, usableMax);
              remainingLen -= seg;
              splicedBoards.push({
                stockLength: maxStock,
                // NOTE: `source` must stay the plain unit key — per-unit attribution
                // (jobBoardGroupsByUnit) matches on it. Splice info goes in spliceNote.
                cuts: [{ ...cut, rawLength: seg, length: seg, spliceNote: `spliced ${i + 1}/${n} of ${toFraction(cut.rawLength)}"` }],
                remaining: usableMax - seg,
                materialType: group.materialType,
                species: group.species,
                finish: group.finish,
                profile: group.profile,
                jambStock: group.jambStock,
                width: group.width,
                thickness: group.thickness,
                spliced: true,
              });
            }
          } else {
            sorted.push(cut);
          }
        });

        // Try each stock length strategy and pick the best
        let bestBoards = null;
        let bestTotalWaste = Infinity;

        // Strategy: try packing with preference for each stock length, then pick best overall
        for (const preferredStock of [null, ...STOCK_LENGTHS]) {
          // Seed with the spliced boards so their leftover (the tail board of a
          // spliced piece can have a lot left) is available to the other cuts.
          const boards = splicedBoards.map(b => ({ ...b, cuts: [...b.cuts] }));

          sorted.forEach(cut => {
            // Try to fit into existing board
            let bestBoard = null;
            let bestRemaining = Infinity;

            boards.forEach(board => {
              const needed = cut.length + KERF; // kerf between this cut and previous
              const newRemaining = board.remaining - needed;
              if (newRemaining >= 0 && newRemaining < bestRemaining) {
                bestBoard = board;
                bestRemaining = newRemaining;
              }
            });

            if (bestBoard) {
              bestBoard.cuts.push(cut);
              bestBoard.remaining -= (cut.length + KERF);
            } else {
              // New board needed - pick best stock length (reserving per-board waste)
              let stockLength;
              if (preferredStock && preferredStock - MIN_CUTOFF >= cut.length) {
                stockLength = preferredStock;
              } else {
                // Pick smallest that fits
                stockLength = STOCK_LENGTHS.find(s => s - MIN_CUTOFF >= cut.length);
                if (!stockLength) stockLength = STOCK_LENGTHS[STOCK_LENGTHS.length - 1];
              }
              boards.push({
                stockLength,
                cuts: [cut],
                remaining: stockLength - MIN_CUTOFF - cut.length,
                materialType: group.materialType,
                species: group.species,
                finish: group.finish,
                profile: group.profile,
                jambStock: group.jambStock,
                width: group.width,
                thickness: group.thickness,
              });
            }
          });

          // Downsize boards where possible (cuts + kerf + the per-board waste reserve)
          boards.forEach(board => {
            const kerfTotal = Math.max(0, board.cuts.length - 1) * KERF;
            const totalUsed = board.cuts.reduce((sum, c) => sum + c.length, 0) + kerfTotal + MIN_CUTOFF;
            for (const sl of STOCK_LENGTHS) {
              if (sl >= totalUsed) {
                board.stockLength = sl;
                board.remaining = sl - totalUsed;
                break;
              }
            }
          });

          const totalWaste = boards.reduce((sum, b) => sum + b.remaining, 0);
          if (totalWaste < bestTotalWaste) {
            bestTotalWaste = totalWaste;
            bestBoards = boards;
          }
        }

        allBoards.push(...(bestBoards || []));
      });

      // Sort boards: by material type, then species, then stock length
      allBoards.sort((a, b) => {
        if (a.materialType !== b.materialType) return a.materialType.localeCompare(b.materialType);
        if (a.species !== b.species) return a.species.localeCompare(b.species);
        return b.stockLength - a.stockLength;
      });

      // Summary counts
      const summary = {};
      allBoards.forEach(board => {
        const key = board.stockLength;
        summary[key] = (summary[key] || 0) + 1;
      });

      return { boards: allBoards, summary, warnings, STOCK_LABELS };
    }

    // Normalize the job's extra boards into the same shape optimizeBoards emits, so
    // they can be aggregated alongside unit boards (shared by checklist + Board Summary).
    function normalizeExtraBoards(extraBoards, units, catalog) {
      if (!extraBoards || !extraBoards.length) return [];
      const defaultFinish = units[0]?.finish || "";
      return extraBoards.map(normalizeExtraBoardProfile).map(eb => {
        const stockLen = parseInt(eb.stockLength) || 120;
        const isJamb = eb.materialType === "Jamb Extension";
        return {
          stockLength: stockLen,
          materialType: eb.materialType || "Casing",
          species: eb.species || units[0]?.species || "Oak",
          finish: eb.finish || defaultFinish,
          profile: isJamb ? null : (eb.profile || null),
          jambStock: isJamb ? (findJambStock(eb.profile, catalog) || { label: eb.profile || "1x6", width: 5.5 }) : null,
          isExtra: true,
        };
      });
    }

    // Merge job-level extra materials with manual materials attached to units.
    // Unit-attached quantities are summed across the job and are the source of
    // truth when the same description also exists at the job level.
    function mergedExtraMaterials(extraMaterials, units) {
      const unitTotals = {};
      (units || []).forEach(u => (u.manualMaterials || []).forEach(mm => {
        if (!mm.description) return;
        unitTotals[mm.description] = (unitTotals[mm.description] || 0) + (mm.qty || 1);
      }));
      // Sum duplicate job-level rows by description (each dupe would otherwise
      // re-emit the full unit total), keeping the first row's category and order
      const jobTotals = {};
      const jobCats = {};
      (extraMaterials || []).forEach(item => {
        if (!item.description) return;
        jobTotals[item.description] = (jobTotals[item.description] || 0) + (item.quantity || 1);
        if (!jobCats[item.description]) jobCats[item.description] = item.category || "Other";
      });
      const rows = [];
      Object.keys(jobTotals).forEach(desc => {
        rows.push({ category: jobCats[desc], description: desc, quantity: unitTotals[desc] != null ? unitTotals[desc] : jobTotals[desc] });
      });
      Object.keys(unitTotals).forEach(desc => {
        if (jobTotals[desc] == null) rows.push({ category: "Other", description: desc, quantity: unitTotals[desc] });
      });
      return rows;
    }

    // Jobs saved before the unit-extras fix printed unit-attached materials as a
    // single job-level line whose quantity never updated (stuck at 1). Flag any
    // saved job where the unit totals disagree with the job-level entry the old
    // report would have printed, so the team can double-check what went out.
    function jobHasSuspectExtras(saved) {
      const totals = {};
      (saved.units || []).forEach(u => (u.manualMaterials || []).forEach(mm => {
        if (!mm.description) return;
        totals[mm.description] = (totals[mm.description] || 0) + (mm.qty || 1);
      }));
      const jobLevel = {};
      (((saved.job || {}).extraMaterials) || []).forEach(m => { if (m.description) jobLevel[m.description] = m.quantity || 1; });
      return Object.keys(totals).some(d => jobLevel[d] != null && jobLevel[d] !== totals[d]);
    }

    // Aggregate boards into checklist line items: { category, description, quantity, length },
    // grouped by material type + species + profile/stock + length (+ finish when showFinish).
    function aggregateBoardGroups(boards, STOCK_LABELS, showFinish) {
      const boardGroups = {};
      boards.forEach(board => {
        const isStool = board.cuts && board.cuts.some(c => c.cutName && (c.cutName.includes("Stool") || c.cutName.includes("Sill")));
        const isJamb = board.materialType === "Jamb Extension" && !isStool;
        const isApron = board.materialType === "Apron";
        const finishTag = showFinish && board.finish ? ` — ${board.finish}` : "";
        let label, cat;
        if (isStool) {
          const stockLabel = fixBasswoodThickness(board.species, board.jambStock ? board.jambStock.label : "5/8x6");
          label = `Stool - ${board.species} ${stockLabel}x${STOCK_LABELS[board.stockLength]}${finishTag}`;
          cat = "STOOL";
        } else if (isJamb) {
          const stockLabel = fixBasswoodThickness(board.species, board.jambStock ? board.jambStock.label : "5/8x6");
          label = `${board.species} ${stockLabel}x${STOCK_LABELS[board.stockLength]}${finishTag}`;
          cat = "JAMB MATERIAL";
        } else if (isApron) {
          const profile = fixBasswoodThickness(board.species, board.profile || "Casing");
          label = `Apron - ${board.species} ${profile} - ${STOCK_LABELS[board.stockLength]}${finishTag}`;
          cat = `${board.species.toUpperCase()} APRON`;
        } else if (board.materialType === "Stop") {
          const profile = fixBasswoodThickness(board.species, board.profile || "Stop");
          label = `${board.species} ${profile} - ${STOCK_LABELS[board.stockLength]}${finishTag}`;
          cat = `${board.species.toUpperCase()} STOP`;
        } else {
          const profile = fixBasswoodThickness(board.species, board.profile || "Casing");
          label = `${board.species} ${profile} - ${STOCK_LABELS[board.stockLength]}${finishTag}`;
          cat = `${board.species.toUpperCase()} CASING`;
        }
        const key = cat + "|" + label;
        if (!boardGroups[key]) boardGroups[key] = { category: cat, description: label, quantity: 0, length: STOCK_LABELS[board.stockLength], unitKeys: new Set() };
        boardGroups[key].quantity++;
        // Union of units whose cuts landed on any board merged into this group —
        // used to flag boards shared across units in whole-job optimization mode.
        // Empty when boards weren't tagged with _unitKeys (unitBoardGroups' single-unit case).
        (board._unitKeys || []).forEach(k => boardGroups[key].unitKeys.add(k));
      });
      const catOrder = { "JAMB MATERIAL": 0, "STOOL": 1 }; // apron/casing/stop sort after by name
      const getCatOrder = (c) => catOrder[c] ?? (c.endsWith("APRON") ? 3 : 2);
      return Object.values(boardGroups).sort((a, b) => {
        const oa = getCatOrder(a.category), ob = getCatOrder(b.category);
        if (oa !== ob) return oa - ob;
        return a.description.localeCompare(b.description);
      }).map(g => ({ ...g, unitKeys: [...g.unitKeys] }));
    }

    // Extra boards (job.extraBoards) are entered one-per-card with no qty field,
    // so identical entries (same species/type/profile/length/note) are grouped
    // here and counted — mirrors aggregateBoardGroups' category/description/quantity shape.
    function groupExtraBoards(extraBoards, STOCK_LABELS) {
      const groups = {};
      (extraBoards || []).map(normalizeExtraBoardProfile).forEach(eb => {
        const species = eb.species || "Oak";
        const stockLen = parseInt(eb.stockLength) || 120;
        const lengthLabel = STOCK_LABELS[stockLen] || (eb.stockLength + '"');
        const cat = (eb.materialType || "Casing").toUpperCase();
        const profileLabel = (eb.materialType === "Jamb Extension" || eb.materialType === "Casing")
          ? fixBasswoodThickness(species, eb.profile || cat)
          : (eb.profile || cat);
        let desc = `${species} ${profileLabel} - ${lengthLabel}`;
        if (eb.note) desc += ` — ${eb.note}`;
        const key = cat + "|" + desc;
        if (!groups[key]) groups[key] = { category: cat, description: desc, quantity: 0 };
        groups[key].quantity++;
      });
      return Object.values(groups).sort((a, b) => a.category.localeCompare(b.category) || a.description.localeCompare(b.description));
    }

    // Boards/material assigned to a single unit — the same aggregated stock lines
    // shown on the checklist/PDF, scoped to one unit (not the individual cuts).
    function unitBoardGroups(unit, catalog, boardWaste, showFinish) {
      const { boards, STOCK_LABELS } = optimizeBoards([unit], catalog, false, boardWaste);
      return aggregateBoardGroups(boards, STOCK_LABELS, showFinish);
    }

    // Whole-job (optimizePerUnit = false) board groups, split out per unit. In this
    // mode the bin-packer shares a single board's cuts across multiple units, so a
    // per-unit board list built by re-optimizing each unit alone (unitBoardGroups)
    // would be wrong — it can't see that sharing. Instead this runs the real
    // job-wide optimizer ONCE, then attributes each resulting board to every unit
    // whose cuts landed on it, tagging groups touched by 2+ units with `sharedWith`
    // (the other unit keys) so each unit's table can note where else it's used.
    function jobBoardGroupsByUnit(units, catalog, boardWaste, showFinish) {
      const { boards, STOCK_LABELS } = optimizeBoards(units, catalog, false, boardWaste);
      const byUnit = {};
      boards.forEach(board => {
        const keys = [...new Set((board.cuts || []).map(c => c.source))];
        board._unitKeys = keys;
        keys.forEach(k => { (byUnit[k] = byUnit[k] || []).push(board); });
      });
      const result = {};
      Object.keys(byUnit).forEach(k => {
        const groups = aggregateBoardGroups(byUnit[k], STOCK_LABELS, showFinish);
        groups.forEach(g => { g.sharedWith = g.unitKeys.filter(u => u !== k); });
        result[k] = groups;
      });
      return result;
    }

    // ─── BOARD CUT LIST (the original OptiCutter-style view) ───
    // Every physical board that gets bought, numbered, with the exact cuts that
    // come off it and the drop left over. Detailed report only — the checklist
    // and the per-unit Job Summary stay aggregated.
    function BoardCutList({ units, catalog, optimizePerUnit, extraBoards, boardWaste }) {
      const result = optimizeBoards(units, catalog, optimizePerUnit, boardWaste);
      const boards = [...result.boards];
      const summary = { ...result.summary };
      const STOCK_LABELS = result.STOCK_LABELS;

      // Extra boards are real boards to buy, so they get numbered rows too —
      // they just carry no cuts. normalizeExtraBoards keeps them 1:1 with the
      // source array (and maps legacy profile labels forward), so notes zip by index.
      const ebNotes = (extraBoards || []).map(eb => eb.note || "");
      normalizeExtraBoards(extraBoards, units, catalog).forEach((b, i) => {
        boards.push({ ...b, cuts: [], remaining: 0, extraNote: ebNotes[i] });
        summary[b.stockLength] = (summary[b.stockLength] || 0) + 1;
      });

      if (boards.length === 0) return null;

      return (
        <div style={{ marginTop: 28, pageBreakBefore: "always" }}>
          <div style={{ background: "#6DB344", color: "#fff", padding: "10px 14px", fontSize: 16, fontWeight: "bold", borderRadius: "6px 6px 0 0" }}>
            Board Cut List
            <span style={{ fontSize: 11, fontWeight: 400, marginLeft: 12, opacity: 0.85 }}>— every board, and the cuts that come off it</span>
          </div>

          <div style={{ background: "#F5F5F4", padding: "10px 14px", display: "flex", gap: 20, fontSize: 14, borderBottom: "1px solid #E8E8E8", flexWrap: "wrap" }}>
            <span><strong>Total Boards:</strong> {boards.length}</span>
            {Object.entries(summary).sort((a, b) => Number(a[0]) - Number(b[0])).map(([len, count]) => (
              <span key={len}><strong>{STOCK_LABELS[len]}:</strong> {count}</span>
            ))}
          </div>

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr style={{ background: "#F0F0EF" }}>
                <th style={{ textAlign: "left", padding: "7px 10px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Board #</th>
                <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Stock</th>
                <th style={{ textAlign: "left", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Type / Size</th>
                <th style={{ textAlign: "left", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Species</th>
                <th style={{ textAlign: "left", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Finish</th>
                <th style={{ textAlign: "left", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Cuts from this board</th>
                <th style={{ textAlign: "center", padding: "7px 8px", borderBottom: "2px solid #bbb", fontWeight: 700 }}>Waste</th>
              </tr>
            </thead>
            <tbody>
              {boards.map((board, i) => (
                <tr key={i} style={{ borderBottom: "1px solid #ddd", background: i % 2 === 0 ? "#fff" : "#fafcf8" }}>
                  <td style={{ padding: "6px 10px", fontWeight: 600 }}>{i + 1}</td>
                  <td style={{ textAlign: "center", padding: "6px 8px", fontWeight: 700, color: "#6DB344" }}>{STOCK_LABELS[board.stockLength]}</td>
                  <td style={{ padding: "6px 8px" }}>
                    {board.species} {board.materialType}
                    {board.jambStock ? ` (${fixBasswoodThickness(board.species, board.jambStock.label)})` : ""}
                    {board.profile ? ` — ${fixBasswoodThickness(board.species, board.profile)}` : ""}
                    {board.isExtra && <span style={{ fontStyle: "italic", color: "#999", marginLeft: 6 }}>(Extra{board.extraNote ? ` — ${board.extraNote}` : ""})</span>}
                  </td>
                  <td style={{ padding: "6px 8px" }}>{board.species}</td>
                  <td style={{ padding: "6px 8px" }}>{board.finish}</td>
                  <td style={{ padding: "6px 8px", fontSize: 11 }}>
                    {board.cuts.length === 0
                      ? <span style={{ color: "#bbb" }}>—</span>
                      : board.cuts.map((c, j) => (
                          <span key={j}>{j > 0 && ", "}{toFraction(c.rawLength)}" — {c.source}</span>
                        ))}
                  </td>
                  <td style={{ textAlign: "center", padding: "6px 8px", color: board.remaining > 24 ? "#c0392b" : "#888" }}>
                    {toFraction(board.remaining)}"
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function BoardSummary({ units, catalog, optimizePerUnit, extraBoards, jobExtraMaterials, boardWaste }) {
      // Purchasing totals are still board-optimized so nothing is lost — but the
      // detail is shown per unit, not as a big factory board list.
      const result = optimizeBoards(units, catalog, optimizePerUnit, boardWaste);
      const summary = { ...result.summary };
      let totalBoards = result.boards.length;
      (extraBoards || []).forEach(eb => { const len = parseInt(eb.stockLength) || 120; summary[len] = (summary[len] || 0) + 1; totalBoards++; });
      const STOCK_LABELS = result.STOCK_LABELS;

      // Whole-job (optimizePerUnit off) boards can be shared across units — compute
      // those once, per unit, so shared rows can be flagged; per-unit mode never
      // shares boards, so it keeps re-optimizing each unit in isolation as before.
      const unitKey = u => u.label + (u.location ? " (" + u.location + ")" : "");
      const jobSharedByUnit = optimizePerUnit ? null : jobBoardGroupsByUnit(units, catalog, boardWaste, false);
      const perUnit = (units || [])
        .filter(u => !isStormDoor(u))
        .map(u => ({ u, groups: optimizePerUnit ? unitBoardGroups(u, catalog, boardWaste, false) : (jobSharedByUnit[unitKey(u)] || []), extras: (u.manualMaterials || []).filter(m => m.description) }))
        .filter(x => x.groups.length || x.extras.length);
      const jobExtras = (jobExtraMaterials || []).filter(m => m.description);

      if (perUnit.length === 0 && (extraBoards || []).length === 0 && jobExtras.length === 0) return null;

      const th = { textAlign: "left", padding: "6px 10px", fontWeight: 700, color: "#6DB344", fontSize: 11 };
      const thC = { ...th, textAlign: "center", color: "#5A9637" };

      return (
        <div style={{ marginTop: 28, pageBreakBefore: "always" }}>
          <div style={{ background: "#6DB344", color: "#fff", padding: "10px 14px", fontSize: 16, fontWeight: "bold", borderRadius: "6px 6px 0 0" }}>
            Job Summary — By Unit
          </div>

          {/* Purchasing totals (kept) */}
          <div style={{ background: "#F5F5F4", padding: "10px 14px", display: "flex", gap: 20, fontSize: 14, borderBottom: "1px solid #E8E8E8", flexWrap: "wrap" }}>
            <span><strong>Total Boards:</strong> {totalBoards}</span>
            {Object.entries(summary).sort((a,b) => Number(a[0]) - Number(b[0])).map(([len, count]) => (
              <span key={len}><strong>{STOCK_LABELS[len]}:</strong> {count}</span>
            ))}
          </div>

          {/* Per-unit boards / material assigned (not cuts — cuts live on the Detailed list) */}
          {perUnit.map(({ u, groups, extras }, ui) => {
            const w = combineMeasurement(u.widthWhole, u.widthFrac);
            const h = combineMeasurement(u.heightWhole, u.heightFrac);
            const jd = combineMeasurement(u.jambDepthWhole, u.jambDepthFrac);
            return (
              <div key={ui} style={{ marginTop: ui === 0 ? 0 : 14, border: "1px solid #E8E8E8", borderRadius: 6, overflow: "hidden" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "8px 12px", background: "rgba(109,179,68,0.10)" }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: "#1a1a1a" }}>{u.label || "Unit"}{u.location ? <span style={{ fontWeight: 500, color: "#777" }}> — {u.location}</span> : null}</span>
                  <span style={{ fontSize: 12, color: "#777" }}>{u.unitType}{u.unitType === "Window" ? " • " + u.trimStyle : ""} · {toFraction(w)}"×{toFraction(h)}"{jd > 0 ? " · JD " + toFraction(jd) + '"' : ""} · {u.species}{u.finish ? " · " + u.finish : ""}</span>
                </div>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr style={{ background: "#F5F5F4" }}>
                      <th style={{ ...th, flex: "0 0 150px", width: 150 }}>Category</th>
                      <th style={th}>Board / Material</th>
                      <th style={thC}>Qty</th>
                    </tr>
                  </thead>
                  <tbody>
                    {groups.map((g, j) => (
                      <tr key={j} style={{ borderTop: "1px solid #e4ede0", background: j % 2 ? "#fafcf8" : "#fff" }}>
                        <td style={{ padding: "7px 10px", fontSize: 11, fontWeight: 600, color: "#777", textTransform: "uppercase", letterSpacing: 0.4, width: 150 }}>{g.category}</td>
                        <td style={{ padding: "7px 10px", fontWeight: 600 }}>
                          {g.description}
                          {g.sharedWith && g.sharedWith.length > 0 && (
                            <span style={{ fontSize: 10, fontWeight: 500, color: "#999", marginLeft: 6 }}>(also used on {g.sharedWith.join(", ")})</span>
                          )}
