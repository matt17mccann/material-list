                }
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", padding: "14px 14px", borderBottom: "1px solid #ddd" }}>
                    <div style={{ flex: "0 0 160px", fontSize: 12, fontWeight: 600, color: "#555", textTransform: "uppercase", letterSpacing: 0.5 }}>{row.category}</div>
                    <div style={{ flex: 1, fontSize: 15, fontWeight: 700, color: "#1a1a1a" }}>{row.description}</div>
                    <div style={{ flex: "0 0 120px", textAlign: "right", fontSize: 15 }}>
                      {row.length ? <span>{row.quantity} x {row.length}</span> : <span>{row.quantity}</span>}
                    </div>
                    <div style={{ flex: "0 0 40px", display: "flex", justifyContent: "center" }}>
                      <div style={{ width: 18, height: 18, border: "1.5px solid #ccc", borderRadius: 2 }} />
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Prefinishing Notes */}
            {(job.prefinishNotes || job.pfWindowsNeeded) && (
              <div data-pdf-section="prefinish" style={{ marginTop: 28 }}>
                <div style={{ display: "flex", padding: "8px 14px", background: "#1a1a1a", color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>
                  Prefinish / Warehouse Notes
                </div>
                {job.prefinishNotes && (
                  <div style={{ padding: "12px 14px", fontSize: 15, fontWeight: 700, background: "rgba(109,179,68,0.25)", borderBottom: "1px solid #c5e0b4", color: "#1C1C1C" }}>
                    {job.prefinishNotes}
                  </div>
                )}
                <div style={{ padding: "10px 14px", fontSize: 14, borderBottom: "1px solid #ddd" }}>
                  <strong>Windows needing PF:</strong> {job.pfWindowsNeeded ? "Yes" : "No"}
                  {job.pfWindowsNeeded && job.pfWindowsList && <span> — {job.pfWindowsList}</span>}
                </div>
                {noteRows.map((note, ni) => (
                  <div key={"note-" + ni} style={{ padding: "10px 14px", fontSize: 13, fontWeight: 700, color: "#c0392b", background: "rgba(230,126,34,0.10)", borderBottom: "1px solid #e67e22" }}>
                    {note.description}
                  </div>
                ))}
              </div>
            )}
            {!(job.prefinishNotes || job.pfWindowsNeeded) && noteRows.length > 0 && (
              <div data-pdf-section="notes" style={{ marginTop: 28 }}>
                {noteRows.map((note, ni) => (
                  <div key={"note-" + ni} style={{ padding: "10px 14px", fontSize: 13, fontWeight: 700, color: "#c0392b", background: "rgba(230,126,34,0.10)", borderBottom: "1px solid #e67e22" }}>
                    {note.description}
                  </div>
                ))}
              </div>
            )}

            {/* Bay Material */}
            {(job.bayMaterials || []).length > 0 && (
              <div data-pdf-section="bay-material" style={{ marginTop: 24 }}>
                <div style={{ display: "flex", padding: "8px 14px", background: "#1a1a1a", color: "#fff", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>
                  Bay Material
                </div>
                {job.bayMaterials.filter(item => item.description).map((item, j) => (
                  <div key={j} style={{ display: "flex", alignItems: "center", padding: "10px 14px", borderBottom: "1px solid #ddd" }}>
                    <div style={{ flex: 1, fontSize: 15, fontWeight: 700, color: "#1a1a1a" }}>{item.description}</div>
                    <div style={{ flex: "0 0 80px", textAlign: "right", fontSize: 15 }}>{item.quantity}</div>
                  </div>
                ))}
              </div>
            )}

            {/* Detailed per-unit Cut List is intentionally omitted from the PDF
                for now — not dialed in yet. Keep the code path ready: just
                restore the cut-list-start marker + units.map block when ready. */}

            {/* ━━━ PAGE BREAK — Board Summary on its own page ━━━ */}
            <div data-pdf-new-page="true" data-pdf-section="board-summary">
              <BoardSummary units={units} catalog={catalog} optimizePerUnit={job.optimizePerUnit} boardWaste={offsets.boardWaste} extraBoards={job.extraBoards} jobExtraMaterials={job.extraMaterials} />
            </div>

            <div data-pdf-section="footer" style={{ marginTop: 32, paddingTop: 16, borderTop: "1px solid #ddd", fontSize: 11, color: "#999", textAlign: "center" }}>
              Renewal by Andersen — {job.address || ""} • {new Date().toLocaleDateString()}
            </div>
          </div>
        );
      };

      return (
        <div style={{ background: "#fff", minHeight: "100vh" }}>
          <div className="no-print" style={{
            position: "sticky", top: 0, zIndex: 100, padding: "max(env(safe-area-inset-top, 0px), 50px) 16px 10px 16px",
            background: "#1C1C1C", display: "flex", alignItems: "center",
            boxShadow: "0 2px 12px rgba(0,0,0,0.25)"
          }}>
            <button onClick={onBack} style={{
              background: "none", border: "none", color: "#fff", fontSize: 15, cursor: "pointer", fontWeight: 600, marginRight: "auto", padding: "6px 0"
            }}>← Back</button>

            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ display: "flex", background: "rgba(255,255,255,0.1)", borderRadius: 6, overflow: "hidden", border: "1px solid rgba(255,255,255,0.15)" }}>
                <button onClick={() => setActiveReport("checklist")} style={{
                  padding: "8px 14px", border: "none", fontSize: 12, fontWeight: 700, cursor: "pointer",
                  background: activeReport === "checklist" ? "#6DB344" : "transparent",
                  color: activeReport === "checklist" ? "#fff" : "rgba(255,255,255,0.6)"
                }}>Checklist</button>
                <button onClick={() => setActiveReport("detailed")} style={{
                  padding: "8px 14px", border: "none", fontSize: 12, fontWeight: 700, cursor: "pointer",
                  background: activeReport === "detailed" ? "#6DB344" : "transparent",
                  color: activeReport === "detailed" ? "#fff" : "rgba(255,255,255,0.6)"
                }}>Detailed</button>
              </div>
              {onEdit && <button onClick={onEdit} style={{
                background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", color: "#fff",
                padding: "8px 14px", borderRadius: 6, fontWeight: 700, fontSize: 12, cursor: "pointer", letterSpacing: 0.5
              }}>EDIT JOB</button>}
              {onSubmit && (
                submitted ? (
                  <span title="Job submitted" style={{
                    background: "rgba(109,179,68,0.18)", border: "1px solid rgba(109,179,68,0.5)", color: "#bfe5a3",
                    padding: "8px 12px", borderRadius: 6, fontWeight: 700, fontSize: 12, letterSpacing: 0.5, whiteSpace: "nowrap"
                  }}>✓ SUBMITTED</span>
                ) : (
                  <button onClick={onSubmit} disabled={!allComplete} title={allComplete ? "" : "Complete all units to submit"} style={{
                    background: allComplete ? "#6DB344" : "rgba(255,255,255,0.08)",
                    border: allComplete ? "1px solid #6DB344" : "1px solid rgba(255,255,255,0.15)",
                    color: allComplete ? "#fff" : "rgba(255,255,255,0.4)",
                    padding: "8px 14px", borderRadius: 6, fontWeight: 800, fontSize: 12,
                    cursor: allComplete ? "pointer" : "not-allowed", letterSpacing: 0.5,
                    boxShadow: allComplete ? "0 2px 10px rgba(109,179,68,0.35)" : "none"
                  }}>SUBMIT JOB</button>
                )
              )}
              <button onClick={handlePrint} disabled={pdfBusy} style={{
                background: "none", border: "1px solid rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.8)",
                padding: "8px 14px", borderRadius: 6, fontWeight: 600, fontSize: 12, cursor: pdfBusy ? "wait" : "pointer",
                opacity: pdfBusy ? 0.5 : 1
              }}>{pdfBusy ? "Working…" : "Print"}</button>
              <button onClick={handlePDF} disabled={pdfBusy} style={{
                background: "none", border: "1px solid rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.8)",
                padding: "8px 14px", borderRadius: 6, fontWeight: 600, fontSize: 12, cursor: pdfBusy ? "wait" : "pointer",
                opacity: pdfBusy ? 0.5 : 1
              }}>{pdfBusy ? "Working…" : "Save PDF"}</button>
              <button onClick={exportAllPDFs} disabled={!!exportBusy} title="Save a PDF of every saved + submitted job into a folder you pick" style={{
                background: "none", border: "1px solid rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.8)",
                padding: "8px 14px", borderRadius: 6, fontWeight: 600, fontSize: 12, cursor: exportBusy ? "wait" : "pointer",
                opacity: exportBusy ? 0.6 : 1
              }}>{exportBusy ? `Exporting ${exportBusy.done}/${exportBusy.total}…` : "Export All PDFs"}</button>
            </div>

            <button onClick={handleEmail} disabled={pdfBusy} style={{
              background: "#6DB344", border: "none", color: "#fff",
              padding: "8px 16px", borderRadius: 6, fontWeight: 700, fontSize: 12, cursor: pdfBusy ? "wait" : "pointer",
              marginLeft: "auto", opacity: pdfBusy ? 0.5 : 1
            }}>{pdfBusy ? "Working…" : "Share"}</button>
          </div>

          {activeReport === "checklist" ? <ChecklistReport /> : <DetailedReport />}

          {/* Off-screen combined report used by the PDF generator. Hidden
              visually but kept in the layout so html2canvas can measure and
              render it at a consistent 900px width. */}
          <div aria-hidden="true" style={{
            position: "fixed", left: "-99999px", top: 0,
            width: 960, pointerEvents: "none", zIndex: -1,
          }}>
            <FullReport />
          </div>
        </div>
      );
    }

    // ─── RBA MARK SVG ───
    function RBaMark({ size = 180, bgColor = "#1C1C1C" }) {
      return (
        <svg viewBox="0 0 200 100" width={size} height={size / 2} xmlns="http://www.w3.org/2000/svg">
          <polygon points="0,0 100,0 0,100" fill="#6DB344"/>
          <polygon points="100,0 100,100 0,100" fill={bgColor}/>
          <polygon points="100,0 200,0 200,100" fill="#6DB344"/>
          <polygon points="100,0 200,100 100,100" fill="#ffffff"/>
        </svg>
      );
    }

    // ─── MAIN APP ───
    function App() {
      const [view, setView] = useState("home");
      const [jobId, setJobId] = useState(null);
      const [job, setJob] = useState({ customerName: "", address: "", poNumber: "", techMeasurer: "", date: new Date().toISOString().split("T")[0], prefinishNotes: "", pfWindowsNeeded: false, pfWindowsList: "", extraMaterials: [], extraBoards: [], bayMaterials: [], customTrimMode: false, optimizePerUnit: true, showFinishOnChecklist: false });
      const [units, setUnits] = useState([emptyUnit(1)]);
      const [expandedUnit, setExpandedUnit] = useState(0);
      const [showPfSection, setShowPfSection] = useState(false);
      const [showBayMaterial, setShowBayMaterial] = useState(false);
      const [expandedCatalogItem, setExpandedCatalogItem] = useState(null);
      const [sameTrim, setSameTrim] = useState(true); // always start with common trim active
      const [globalTrim, setGlobalTrim] = useState({
        trimStyle: "Picture Frame",
        species: "Oak",
        jambSpecies: "Oak",
        jambMaterial: "",
        casingProfile: '2-1/2" Colonial (C115)',
        stopProfile: "1x4 Stop",
        finishType: "Stain",
        finish: "",
        jambDepthWhole: "",
        jambDepthFrac: 0,
      });
      const [savedJobs, setSavedJobs] = useState([]);
      const [pdfParsing, setPdfParsing] = useState(false);
      const [pdfPreview, setPdfPreview] = useState(null); // { jobInfo, units } for review
      const [catalog, setCatalog] = useState(loadCatalog);
      const [offsets, setOffsetsState] = useState(loadOffsets);
      const [customMode, setCustomMode] = useState({}); // tracks which fields are in "type custom" mode
      const [jambSpeciesManuallySet, setJambSpeciesManuallySet] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncing, setSyncing] = useState(false);
      const [boardCalcKey, setBoardCalcKey] = useState(0); // bump to force board recalculation
      const [recalculating, setRecalculating] = useState(false);
      const [savedTab, setSavedTab] = useState("quick"); // "quick" or "edit"
      const [savedSearch, setSavedSearch] = useState("");
      const [savedFilter, setSavedFilter] = useState("drafts"); // "drafts" or "submitted"
      const [savedSort, setSavedSort] = useState("newest"); // "newest", "oldest", "last_name", "status"
      const [savedTechFilter, setSavedTechFilter] = useState(""); // filter by tech measurer
      const [extraLenDrafts, setExtraLenDrafts] = useState({}); // per-catalog-item input drafts for adding custom lengths
      const [reportFrom, setReportFrom] = useState("editor"); // where to go back from report view
      const [submitted, setSubmitted] = useState(false); // tracks if current job has been submitted
      const [reportType, setReportType] = useState("checklist"); // "checklist" or "detailed"
      const [metalSearch, setMetalSearch] = useState(""); // type-to-search job finder
      const [metalExporting, setMetalExporting] = useState(false); // export PDF in progress
      const [metalAddonsOpen, setMetalAddonsOpen] = useState(false); // collapse wrap add-ons (hidden by default)
      const [metalWork, setMetalWork] = useState([]); // editable working wrap list: [{label, location, w, h, width}]
      const [metalListName, setMetalListName] = useState(""); // list title for export (job customer or manual)
      const [metalListPo, setMetalListPo] = useState(""); // list PO for export
      const pdfInputRef = useRef(null);

      // Online/offline tracking — flush queued offline jobs on reconnect
      useEffect(() => {
        const goOnline = async () => {
          setIsOnline(true);
          setSyncing(true);
          const synced = await syncPendingJobs();
          if (synced > 0) {
            const jobs = await fetchJobsFromAPI();
            setSavedJobs(jobs);
          }
          setSyncing(false);
        };
        const goOffline = () => setIsOnline(false);
        window.addEventListener("online", goOnline);
        window.addEventListener("offline", goOffline);
        return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };
      }, []);

      // Browser history management — back button and refresh support
      const skipPush = useRef(false);
      useEffect(() => {
        if (skipPush.current) { skipPush.current = false; return; }
        window.history.pushState({ view }, "", null);
      }, [view]);

      useEffect(() => {
        // Replace initial history entry with home
        window.history.replaceState({ view: "home" }, "", null);
        const onPop = (e) => {
          const target = e.state?.view || "home";
          skipPush.current = true;
          setView(target);
        };
        window.addEventListener("popstate", onPop);
        return () => window.removeEventListener("popstate", onPop);
      }, []);

      // Load shared data from API on mount
      useEffect(() => {
        (async () => {
          setSyncing(true);
          try {
            // Flush any jobs queued offline in a previous session
            await syncPendingJobs();

            // Fetch catalog from API, seed defaults if not yet on server
            const apiCatalog = await fetchCatalogFromAPI();
            if (apiCatalog) {
              setCatalog(apiCatalog);
            } else {
              // First time — seed server with local defaults
              const def = loadCatalog();
              setCatalog(def);
              saveCatalogToAPI(def);
            }

            // Fetch offsets from API, seed defaults if not yet on server
            const apiOffsets = await fetchOffsetsFromAPI();
            if (apiOffsets) {
              setOffsetsState(prev => ({ ...DEFAULT_OFFSETS, ...apiOffsets }));
            } else {
              const def = loadOffsets();
              setOffsetsState(def);
              saveOffsetsToAPI(def);
            }
          } catch {}
          setSyncing(false);
        })();
      }, []);

      // Load saved jobs from API when switching to views that need them
      useEffect(() => {
        (async () => {
          const jobs = await fetchJobsFromAPI();
          setSavedJobs(jobs);
        })();
      }, [view]);

      const updateJob = (f, v) => { setJob(p => ({ ...p, [f]: v })); setSubmitted(false); };
      const updateUnit = (idx, f, v) => { setUnits(p => p.map((u, i) => i === idx ? { ...u, [f]: v } : u)); setSubmitted(false); };
      const addUnit = () => {
        let newUnit = emptyUnit(units.length + 1);
        if (sameTrim) {
          newUnit = { ...newUnit, species: globalTrim.species, casingProfile: globalTrim.casingProfile, stopProfile: globalTrim.stopProfile || "1x4 Stop", finishType: globalTrim.finishType, finish: globalTrim.finish };
        }
        // Autofill jamb depth from most common value across existing units (fallback: global)
        const jdCounts = {};
        units.forEach(u => {
          if (u.jambDepthWhole !== "" && u.jambDepthWhole != null) {
            const key = `${u.jambDepthWhole}|${u.jambDepthFrac || 0}`;
            jdCounts[key] = (jdCounts[key] || 0) + 1;
          }
        });
        const topJD = Object.entries(jdCounts).sort((a, b) => b[1] - a[1])[0];
        if (topJD) {
          const [whole, frac] = topJD[0].split("|");
          newUnit.jambDepthWhole = whole;
          newUnit.jambDepthFrac = Number(frac);
        } else if (globalTrim.jambDepthWhole) {
          newUnit.jambDepthWhole = globalTrim.jambDepthWhole;
          newUnit.jambDepthFrac = globalTrim.jambDepthFrac || 0;
        }
        setUnits(p => [...p, newUnit]);
        setExpandedUnit(units.length);
      };
      const removeUnit = (idx) => { if (units.length <= 1) return; setUnits(p => p.filter((_, i) => i !== idx)); };
      const duplicateUnit = (idx) => {
        // Deep copy — a shallow spread would share nested arrays (manualMaterials,
        // customTrimPieces) by reference between the original and the copy
        const c = { ...structuredClone(units[idx]), id: Date.now() + Math.random(), label: `${units[idx].label} (copy)` };
        setUnits(p => [...p.slice(0, idx + 1), c, ...p.slice(idx + 1)]);
        setExpandedUnit(idx + 1);
      };
      const applyGlobalToUnit = (u, g, force) => {
        const updates = { trimStyle: g.trimStyle || "Picture Frame", species: g.species, jambSpecies: g.jambSpecies || g.species, jambMaterial: g.jambMaterial || "", casingProfile: g.casingProfile, stopProfile: g.stopProfile || "1x4 Stop", stool5_4: g.stool5_4 || false };
        // When "Multiple" is selected, don't override per-unit finish
        if (g.finishType !== "Multiple") {
          updates.finishType = g.finishType;
          updates.finish = g.finish;
        }
        // Only apply jamb depth if global has a value AND (force=true OR unit has no value yet)
        if (g.jambDepthWhole !== "" && g.jambDepthWhole != null) {
          if (force || !u.jambDepthWhole) {
            updates.jambDepthWhole = g.jambDepthWhole;
            updates.jambDepthFrac = g.jambDepthFrac || 0;
          }
        }
        return { ...u, ...updates };
      };

      const updateGlobalTrim = (field, value) => {
        const newGlobal = { ...globalTrim, [field]: value };
        // If changing species away from Pine, reset knotty pine profile
        if (field === "species") {
          if (value !== "Pine") {
            const profile = CASING_PROFILES.find(p => p.label === newGlobal.casingProfile);
            if (profile && profile.pineOnly) newGlobal.casingProfile = '2-1/2" Colonial (C115)';
          }
          // Default jambSpecies to match casing species unless user manually set it
          if (!jambSpeciesManuallySet) {
            newGlobal.jambSpecies = value;
          }
        }
        setGlobalTrim(newGlobal);
        setSubmitted(false);
        // Apply to all existing units — force jamb depth so every change propagates
        const forceJamb = field === "jambDepthWhole" || field === "jambDepthFrac";
        setUnits(prev => prev.map(u => applyGlobalToUnit(u, newGlobal, forceJamb)));
      };

      // ─── PROCESS JSON TEXT (shared by file upload and paste) ───
      const processJSONText = (text) => {
        const jsonData = JSON.parse(text);
        return parseRSuiteJSON(jsonData);
      };

      // ─── FILE UPLOAD & PARSE (JSON or PDF) ───
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setPdfParsing(true);
        try {
          if (pdfInputRef.current) pdfInputRef.current.value = "";
          const ext = file.name.split(".").pop().toLowerCase();

          let data;

          if (ext === "zip") {
            // ── ZIP — extract first .json file inside ──
            if (typeof JSZip === "undefined") {
              throw new Error("ZIP library failed to load. Check your internet connection and reload.");
            }
            const zipData = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(zipData);
            const jsonFile = Object.keys(zip.files).find(name => name.toLowerCase().endsWith(".json"));
            if (!jsonFile) {
              throw new Error("No .json file found inside the ZIP. Make sure it contains an rSuite export.");
            }
            const text = await zip.files[jsonFile].async("string");
            data = processJSONText(text);
          } else if (ext === "csv") {
            // ── CSV (rSuite Measured Project export — usually UTF-16) ──
            const buf = new Uint8Array(await file.arrayBuffer());
            data = parseMeasuredProjectCSV(decodeTextBuffer(buf));
          } else if (ext === "json") {
            // ── JSON (rSuite DL Export) — use FileReader for max Safari compatibility ──
            const text = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(new Error("Failed to read file"));
              reader.readAsText(file);
            });
            data = processJSONText(text);
          } else {
            // ── PDF (Installer Package) ──
            if (typeof pdfjsLib === "undefined") {
              throw new Error("PDF library failed to load. Check your internet connection and reload the page.");
            }
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              let lastY = null, pageText = "";
              for (const item of content.items) {
                if (!item.str) continue;
                const y = item.transform[5];
                if (lastY !== null && Math.abs(y - lastY) > 3) pageText += "\n";
                pageText += item.str + (item.str.endsWith(" ") ? "" : " ");
                lastY = y;
              }
              fullText += pageText + "\n\n";
            }
            data = parseInstallerPackageText(fullText);
          }

          if (!data.units || !data.units.length) {
            alert("No units found in this file.\n\nSupported formats:\n• rSuite DL Export (.json or .zip)\n• rSuite Measured Project (.csv)\n• RBA Installer Package (.pdf)");
            setPdfParsing(false);
            return;
          }
          setPdfPreview({ jobInfo: data.jobInfo || {}, units: data.units });
        } catch (err) {
          alert("Upload error: " + (err.message || String(err)));
          console.error("Upload error:", err);
        }
        setPdfParsing(false);
      };

      const confirmPdfUnits = () => {
        if (!pdfPreview) return;
        const { jobInfo, units: pdfUnits } = pdfPreview;

        // Populate job info from PDF
        if (jobInfo) {
          if (jobInfo.customerName) updateJob("customerName", jobInfo.customerName);
          if (jobInfo.address) updateJob("address", jobInfo.address);
          if (jobInfo.poNumber) updateJob("poNumber", jobInfo.poNumber);
          if (jobInfo.techMeasurer) updateJob("techMeasurer", jobInfo.techMeasurer);
        }

        // Extract job-wide trim details from the 900 line item info
        const pdfTrimStyle = jobInfo?.trimStyle || "Picture Frame";
        const pdfSpecies = (jobInfo?.species && SPECIES.includes(jobInfo.species)) ? jobInfo.species : "Oak";
        const pdfCasing = (jobInfo?.casingProfile && CASING_PROFILES.find(p => p.label === jobInfo.casingProfile))
          ? jobInfo.casingProfile : '2-1/2" Colonial (C115)';

        // Determine finish type and color from the 900 line item
        let pdfFinishType = "Stain";
        let pdfFinish = "";
        let finishNotFound = true;
        if (jobInfo?.finishNote) {
          const isStain = STAINS.find(s => s.label === jobInfo.finishNote || s.label.startsWith(jobInfo.finishNote + " ("));
          const isPaint = PAINTS.includes(jobInfo.finishNote);
          if (isStain) { pdfFinishType = "Stain"; pdfFinish = isStain.label; finishNotFound = false; }
          else if (isPaint) { pdfFinishType = "Paint"; pdfFinish = jobInfo.finishNote; finishNotFound = false; }
          else { pdfFinishType = "Stain"; pdfFinish = jobInfo.finishNote; finishNotFound = false; }
        }

        // Auto-set global trim from imported data
        const importedTrim = { ...globalTrim, trimStyle: pdfTrimStyle, species: pdfSpecies, jambSpecies: pdfSpecies, casingProfile: pdfCasing, finishType: pdfFinishType, finish: pdfFinish };
        setGlobalTrim(importedTrim);
        setJambSpeciesManuallySet(false);
        setSameTrim(true);

        const startNum = units.length + 1;
        const newUnits = pdfUnits.map((u, i) => {
          let nu = emptyUnit(startNum + i);
          nu.label = u.label || `Unit ${startNum + i}`;
          nu.location = u.location || "";
          nu.unitType = u.unitType || "Window";
          nu.trimStyle = pdfTrimStyle;
          nu.species = pdfSpecies;
          nu.casingProfile = pdfCasing;
          nu.finishType = pdfFinishType;
          nu.finish = pdfFinish;
          if (u.widthWhole != null) nu.widthWhole = u.widthWhole;
          if (u.widthFrac != null) nu.widthFrac = u.widthFrac;
          if (u.heightWhole != null) nu.heightWhole = u.heightWhole;
          if (u.heightFrac != null) nu.heightFrac = u.heightFrac;
          if (u.jambDepthWhole != null) nu.jambDepthWhole = u.jambDepthWhole;
          if (u.jambDepthFrac != null) nu.jambDepthFrac = u.jambDepthFrac;
          if (u.entryDoorJambs != null) nu.entryDoorJambs = u.entryDoorJambs;
          return nu;
        });
        // If only the default empty unit exists, replace it; otherwise append
        if (units.length === 1 && !units[0].widthWhole && !units[0].heightWhole) {
          setUnits(newUnits);
        } else {
          setUnits(prev => [...prev, ...newUnits]);
        }
        setPdfPreview(null);
        setExpandedUnit(0);
        setView("editor");
      };

      // Storm doors need no trim (every calc path skips them) — don't let one block submission
      const allComplete = units.every(u => isStormDoor(u) || isUnitComplete(u));

      const startNewJob = () => {
        setSameTrim(true);
        setJobId(Date.now().toString() + "-" + Math.random().toString(36).slice(2, 8));
        setJob({ customerName: "", address: "", poNumber: "", techMeasurer: "", date: new Date().toISOString().split("T")[0], prefinishNotes: "", pfWindowsNeeded: false, pfWindowsList: "", extraMaterials: [], extraBoards: [], bayMaterials: [], customTrimMode: false, optimizePerUnit: true, showFinishOnChecklist: false });
        setUnits([emptyUnit(1)]);
        // Jamb depth is measured per job — don't carry it into a new job
        setGlobalTrim(prev => ({ ...prev, jambDepthWhole: "", jambDepthFrac: 0 }));
        setExpandedUnit(0);
        setSubmitted(false);
        setShowPfSection(false);
        // New, uncompleted job — back button should return to Saved Jobs
        setSavedFilter("drafts");
        setView("editor");
      };

      const saveJob = async (isSubmit) => {
        // Preserve existing status/starred if this job was previously saved
        const existing = savedJobs.find(j => j.id === jobId);
        const status = isSubmit ? "submitted" : (existing?.status === "complete" ? "in_progress" : (existing?.status || "in_progress"));
        const submitted = isSubmit ? true : (existing?.submitted || false);
        const data = { id: jobId, job, units, globalTrim, savedAt: new Date().toISOString(), status, submitted, starred: existing?.starred || false };
        // Optimistic: update the local list immediately instead of refetching
        // everything from the server. Failed server writes land in the offline
        // pending queue and sync on reconnect, so the UI never has to wait.
        setSavedJobs(prev => [data, ...prev.filter(j => j.id !== data.id)]);
        if (isSubmit) {
          // Allow the (re)submitted PDF to be pushed to the joblist app again.
          joblistPushed.delete(jobId);
          setSubmitted(true);
          // Back button from the report should return to the Submitted Jobs list, not drafts.
          setSavedFilter("submitted");
          saveJobToAPI(data); // background sync — no need to block the UI
        } else {
          const synced = await saveJobToAPI(data);
          alert(synced ? "Job saved!" : "Job saved locally (offline)");
        }
      };

      const detectCustomModeFromUnits = (units) => {
        const cm = {};
        const casingLabels = new Set(CASING_PROFILES.map(p => p.label));
        const stopLabels = new Set(STOP_PROFILES.map(p => p.label));
        const speciesSet = new Set(SPECIES);
        const stainLabels = new Set(STAINS.map(s => s.label));
        const paintLabels = new Set(PAINTS);
        const threshSet = new Set(THRESHOLD_OPTIONS);
        units.forEach((u, idx) => {
          if (u.species && !speciesSet.has(u.species)) cm["species_"+idx] = true;
          if (u.casingProfile && u.casingProfile !== "None" && u.casingProfile !== "Customer Supplying" && !casingLabels.has(u.casingProfile)) cm["casing_"+idx] = true;
          if (u.stopProfile && u.stopProfile !== "None" && !stopLabels.has(u.stopProfile)) cm["stop_"+idx] = true;
          if (u.jambSpecies && !speciesSet.has(u.jambSpecies)) cm["jambSp_"+idx] = true;
          if (u.finish && u.finish !== "Multiple" && !stainLabels.has(u.finish) && !paintLabels.has(u.finish)) cm["finish_"+idx] = true;
          if (u.thresholdSpecies && !threshSet.has(u.thresholdSpecies)) cm["thresh_"+idx] = true;
        });
        return cm;
      };

      const detectSameTrim = (units) => {
        if (!units || units.length < 2) return true;
        const first = units[0];
        return units.every(u =>
          u.species === first.species &&
          u.trimStyle === first.trimStyle &&
          u.casingProfile === first.casingProfile &&
          (u.finishType || "") === (first.finishType || "") &&
          (u.finish || "") === (first.finish || "")
        );
      };

      const applySavedJob = (saved, { goToReport = false } = {}) => {
        setJobId(saved.id);
        const mergedJob = mergedJobDefaults(saved.job || {});
        setJob(mergedJob);
        // Migrate renamed casing-profile labels on load (saved jobs store the label string)
        const savedUnits = (saved.units || []).map(u => ({
          ...u,
          casingProfile: u.casingProfile ? normalizeCasingProfile(u.casingProfile) : u.casingProfile,
          customTrimPieces: (u.customTrimPieces || []).map(ctp => ({ ...ctp, profile: ctp.profile ? normalizeCasingProfile(ctp.profile) : ctp.profile })),
        }));
        setUnits(savedUnits);
        // Remember origin so the editor's back button returns to the right list
        setSavedFilter(saved.submitted ? "submitted" : "drafts");
        if (saved.globalTrim) {
          setGlobalTrim({ ...saved.globalTrim, casingProfile: saved.globalTrim.casingProfile ? normalizeCasingProfile(saved.globalTrim.casingProfile) : saved.globalTrim.casingProfile });
          setJambSpeciesManuallySet(saved.globalTrim.jambSpecies && saved.globalTrim.jambSpecies !== saved.globalTrim.species);
        } else if (savedUnits.length > 0) {
          // Reconstruct globalTrim from first unit for older saved jobs
          const u = savedUnits[0];
          setGlobalTrim(prev => ({ ...prev, trimStyle: u.trimStyle || prev.trimStyle, species: u.species || prev.species, jambSpecies: u.jambSpecies || u.species || prev.species, jambMaterial: u.jambMaterial || "", casingProfile: u.casingProfile || prev.casingProfile, stopProfile: u.stopProfile || prev.stopProfile, finishType: u.finishType || prev.finishType, finish: u.finish || prev.finish, jambDepthWhole: u.jambDepthWhole || "", jambDepthFrac: u.jambDepthFrac || 0 }));
        }
        setExpandedUnit(0);
        // Auto-expand collapsible sections when they have content
        setShowPfSection(!!(mergedJob.prefinishNotes || mergedJob.pfWindowsNeeded));
        setShowBayMaterial((mergedJob.bayMaterials || []).length > 0);
        // Restore sameTrim by detecting whether all units share the same trim
        setSameTrim(detectSameTrim(savedUnits));
        // Restore "Custom" toggles for any unit field whose value isn't in the
        // standard list — including the GLOBAL trim toggles and extra boards,
        // otherwise a custom species renders as a blank/wrong select after load
        const cm = detectCustomModeFromUnits(savedUnits);
        const g = saved.globalTrim || savedUnits[0] || {};
        const speciesSet = new Set(SPECIES);
        const casingLabels = new Set(CASING_PROFILES.map(p => p.label));
        const stopLabels = new Set(STOP_PROFILES.map(p => p.label));
        const stainLabels = new Set(STAINS.map(s => s.label));
        const paintLabels = new Set(PAINTS);
        if (g.species && !speciesSet.has(g.species)) cm.globalSpecies = true;
        if (g.jambSpecies && !speciesSet.has(g.jambSpecies)) cm.globalJambSp = true;
        const gCasing = g.casingProfile ? normalizeCasingProfile(g.casingProfile) : "";
        if (gCasing && gCasing !== "None" && gCasing !== "Customer Supplying" && !casingLabels.has(gCasing)) cm.globalCasing = true;
        if (g.stopProfile && g.stopProfile !== "None" && !stopLabels.has(g.stopProfile)) cm.globalStop = true;
        if (g.finish && g.finish !== "Multiple" && g.finish !== "No Prefinish" && !stainLabels.has(g.finish) && !paintLabels.has(g.finish)) cm.globalFinish = true;
        (mergedJob.extraBoards || []).forEach((eb, i) => {
          if (eb.species && !speciesSet.has(eb.species)) cm["eb_species_" + i] = true;
        });
        setCustomMode(cm);
        if (goToReport) {
          setSubmitted(saved.submitted === true);
          setReportType("checklist");
          setReportFrom("saved");
          setView("report");
        } else {
          setSubmitted(saved.status && saved.status !== "in_progress");
          setView("editor");
        }
      };

      const loadJob = (saved) => applySavedJob(saved, { goToReport: false });

      const deleteJob = async (id) => {
        // Optimistic: drop it from the list immediately, delete on the server in background
        setSavedJobs(prev => prev.filter(j => j.id !== id));
        deleteJobFromAPI(id);
      };

      const updateJobMeta = (savedJob, updates) => {
        const updated = { ...savedJob, ...updates };
        // Update UI immediately
        setSavedJobs(prev => prev.map(j => j.id === savedJob.id ? updated : j));
        // Then persist in background
        saveJobToAPI(updated);
      };

      const loadJobForReport = (saved) => applySavedJob(saved, { goToReport: true });

      const inp = { width: "100%", padding: "12px 14px", border: "1px solid #ddd", borderRadius: 6, fontSize: 17, background: "#fff", boxSizing: "border-box" };
      const sel = { ...inp, appearance: "auto" };
      const lbl = { fontSize: 12, fontWeight: 700, color: "#666", marginBottom: 5, display: "block", letterSpacing: 0.8, textTransform: "uppercase" };

      // ─── HOME SCREEN ───
      if (view === "home") {
        return (
          <div style={{ minHeight: "100vh", background: "#1C1C1C", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>

            <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", width: "100%", maxWidth: 360 }}>
              {/* Logo mark */}
              <div style={{ marginBottom: 20 }}>
                <RBaMark size={200} />
              </div>

              {/* Brand name */}
              <div style={{ textAlign: "center", marginBottom: 32 }}>
                <div style={{ fontSize: 22, fontWeight: 900, color: "#fff", letterSpacing: 1, lineHeight: 1.15 }}>RENEWAL</div>
                <div style={{ fontSize: 17, fontWeight: 700, color: "#fff", letterSpacing: 0.5 }}>by ANDERSEN</div>
                <div style={{ width: 40, height: 2, background: "#6DB344", margin: "12px auto 10px" }} />
                <div style={{ fontSize: 11, fontWeight: 700, color: "#6DB344", letterSpacing: 2.5, textTransform: "uppercase" }}>Lake Superior Region</div>
                <div style={{ fontSize: 13, fontWeight: 500, color: "rgba(255,255,255,0.45)", letterSpacing: 1.5, textTransform: "uppercase", marginTop: 4 }}>Material Cut List</div>
                <div style={{ fontSize: 9, color: "rgba(255,255,255,0.2)", marginTop: 8 }}>v2.2 — Apr 8 2026</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginTop: 6 }}>
                  <div style={{ width: 7, height: 7, borderRadius: "50%", background: isOnline ? "#6DB344" : "#f39c12", boxShadow: isOnline ? "0 0 6px rgba(109,179,68,0.5)" : "0 0 6px rgba(243,156,18,0.5)" }} />
                  <span style={{ fontSize: 10, color: isOnline ? "rgba(109,179,68,0.7)" : "rgba(243,156,18,0.7)" }}>{syncing ? "Syncing..." : isOnline ? "Connected" : "Offline"}</span>
                </div>
              </div>

              <button onClick={startNewJob} style={{
                width: "100%", padding: "16px 0", border: "none", borderRadius: 6,
                background: "#6DB344", fontSize: 15, fontWeight: 700,
                color: "#fff", cursor: "pointer",
                letterSpacing: 0.5, marginBottom: 10
              }}>+ New Job</button>

              <button onClick={() => { setSavedFilter("drafts"); setView("saved"); }} style={{
                width: "100%", padding: "14px 0", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6,
                background: "rgba(255,255,255,0.06)", fontSize: 14, fontWeight: 600,
                color: "rgba(255,255,255,0.7)", cursor: "pointer", letterSpacing: 0.3, marginBottom: 8
              }}>Saved Jobs ({savedJobs.filter(j => !j.submitted).length})</button>

              <button onClick={() => { setSavedFilter("submitted"); setView("saved"); }} style={{
                width: "100%", padding: "14px 0", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 6,
                background: "rgba(255,255,255,0.06)", fontSize: 14, fontWeight: 600,
                color: "rgba(255,255,255,0.7)", cursor: "pointer", letterSpacing: 0.3
              }}>Submitted Jobs ({savedJobs.filter(j => j.submitted).length})</button>

              <div style={{ display: "flex", gap: 8, width: "100%", marginTop: 10 }}>
                <button onClick={() => setView("lumber")} style={{
                  flex: 1, padding: "12px 0", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 6,
                  background: "rgba(255,255,255,0.04)", fontSize: 12, fontWeight: 600,
                  color: "rgba(255,255,255,0.5)", cursor: "pointer", letterSpacing: 0.3
                }}>Available Material</button>
                <button onClick={() => setView("offsets")} style={{
                  flex: 1, padding: "12px 0", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 6,
                  background: "rgba(255,255,255,0.04)", fontSize: 12, fontWeight: 600,
                  color: "rgba(255,255,255,0.5)", cursor: "pointer", letterSpacing: 0.3
                }}>Offsets</button>
              </div>

              <button onClick={() => setView("metal")} style={{
                width: "100%", padding: "12px 0", marginTop: 8, border: "1px solid rgba(255,255,255,0.1)", borderRadius: 6,
                background: "rgba(255,255,255,0.04)", fontSize: 12, fontWeight: 600,
                color: "rgba(255,255,255,0.5)", cursor: "pointer", letterSpacing: 0.3
              }}>Bending Metal</button>
            </div>

          </div>
        );
      }

      // ─── AVAILABLE LUMBER ───
      if (view === "lumber") {
        const updateCatalog = (updated) => { setCatalog(updated); saveCatalogToAPI(updated); };

        const toggleAvail = (section, index, species, lengthKey) => {
          const arr = [...catalog[section]];
          const item = { ...arr[index], availability: { ...arr[index].availability } };
          item.availability[species] = { ...item.availability[species], [lengthKey]: !item.availability[species]?.[lengthKey] };
          arr[index] = item;
          updateCatalog({ ...catalog, [section]: arr });
        };

        const addExtraLength = (section, index, inches) => {
          const n = parseInt(inches);
          if (!Number.isFinite(n) || n <= 0) { alert("Enter a length in inches (e.g. 168 for 14')"); return; }
          if ([96, 120, 144].includes(n)) { alert(formatStockLabel(n) + " is already a standard length."); return; }
          const arr = [...catalog[section]];
          const item = { ...arr[index] };
          const existing = Array.isArray(item.extraLengths) ? [...item.extraLengths] : [];
          if (existing.includes(n)) { alert(formatStockLabel(n) + " is already added."); return; }
          existing.push(n);
          existing.sort((a, b) => a - b);
          item.extraLengths = existing;
          // Default availability on for all species at this new length
          item.availability = { ...item.availability };
          ALL_SPECIES.forEach(sp => {
            item.availability[sp] = { ...item.availability[sp], [String(n)]: true };
          });
          arr[index] = item;
          updateCatalog({ ...catalog, [section]: arr });
        };

        const removeExtraLength = (section, index, inches) => {
          const n = parseInt(inches);
          const arr = [...catalog[section]];
          const item = { ...arr[index] };
          item.extraLengths = (item.extraLengths || []).filter(l => parseInt(l) !== n);
          arr[index] = item;
          updateCatalog({ ...catalog, [section]: arr });
        };

        // Profile face width (inches) — drives board packing and future preboxing/miter math
        const setItemWidth = (section, index, value) => {
          const v = parseFloat(value);
          const arr = [...catalog[section]];
          arr[index] = { ...arr[index], width: Number.isFinite(v) && v > 0 ? v : null };
          updateCatalog({ ...catalog, [section]: arr });
        };

        const AvailGrid = ({ item, index, section }) => {
          const gridKey = `${section}-${index}`;
          const open = expandedCatalogItem === gridKey;
          const setOpen = (v) => setExpandedCatalogItem(v ? gridKey : null);
          const extraLenInput = extraLenDrafts[gridKey] || "";
          const setExtraLenInput = (v) => setExtraLenDrafts(p => ({ ...p, [gridKey]: v }));
          // Build a combined list of lengths (standard + custom)
          const itemExtras = (item.extraLengths || []).map(l => parseInt(l)).filter(l => Number.isFinite(l));
          const allLengthCols = [
            ...ALL_LENGTHS.map(l => ({ key: l.key, label: l.label, custom: false })),
            ...itemExtras.map(l => ({ key: String(l), label: formatStockLabel(l), custom: true, inches: l })),
          ];
          // Build a summary of available species/lengths
          const summary = ALL_SPECIES.map(sp => {
            const lengths = allLengthCols.filter(l => item.availability?.[sp]?.[l.key] !== false).map(l => l.label);
            return lengths.length > 0 ? `${sp}: ${lengths.join("/")}` : null;
          }).filter(Boolean).join(" · ");

          return (
            <div style={{ background: "#fff", borderRadius: 8, marginBottom: 8, border: "1px solid #E8E8E8", overflow: "hidden" }}>
              <div onClick={() => setOpen(!open)} style={{
                padding: "12px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center"
              }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "#333" }}>
                    {item.label}
                    {itemExtras.length > 0 && (
                      <span style={{ fontSize: 11, fontWeight: 600, color: "#fff", background: "#e67e22", padding: "2px 6px", borderRadius: 4, marginLeft: 8, letterSpacing: 0.5 }}>
                        +{itemExtras.length} custom length{itemExtras.length !== 1 ? "s" : ""}
                      </span>
                    )}
                  </div>
                  {!open && <div style={{ fontSize: 11, color: "#888", marginTop: 2 }}>{summary || "No availability set"}</div>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <button onClick={(e) => {
                    e.stopPropagation();
                    if (!confirm("Delete " + item.label + "?")) return;
                    updateCatalog({ ...catalog, [section]: catalog[section].filter((_, i) => i !== index) });
                  }} style={{ background: "none", border: "none", fontSize: 13, color: "#c0392b", cursor: "pointer" }}>Delete</button>
                  <span style={{ fontSize: 16, color: "#999", transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "none" }}>▾</span>
                </div>
              </div>
              {open && (
                <div style={{ padding: "0 16px 14px" }}>
                  {section === "casingProfiles" && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 0 4px" }}>
                      <label style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>Width (in)</label>
                      <input
                        type="number" step="0.125" min="0"
                        defaultValue={item.width != null ? item.width : ""}
                        onBlur={e => setItemWidth(section, index, e.target.value)}
                        placeholder="e.g. 2.5"
                        style={{ width: 90, padding: "6px 8px", border: "1px solid #ddd", borderRadius: 5, fontSize: 13 }}
                      />
                      <span style={{ fontSize: 11, color: "#888" }}>Used for preboxing / miter math</span>
                    </div>
                  )}
                  <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                    <thead>
                      <tr>
                        <th style={{ textAlign: "left", padding: "4px 8px", fontSize: 11, color: "#888", fontWeight: 600 }}></th>
                        {allLengthCols.map(l => (
                          <th key={l.key} style={{ padding: "4px 8px", fontSize: 11, color: l.custom ? "#e67e22" : "#888", fontWeight: 600, textAlign: "center", whiteSpace: "nowrap" }}>
                            {l.label}
                            {l.custom && (
                              <button onClick={() => removeExtraLength(section, index, l.inches)} title="Remove this custom length" style={{
                                background: "none", border: "none", color: "#c0392b", cursor: "pointer", fontSize: 12, marginLeft: 3, padding: 0
                              }}>✕</button>
                            )}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {ALL_SPECIES.map(sp => (
                        <tr key={sp} style={{ borderTop: "1px solid #f0f0f0" }}>
                          <td style={{ padding: "6px 8px", fontWeight: 600, color: "#333" }}>{sp}</td>
                          {allLengthCols.map(l => {
                            const on = item.availability?.[sp]?.[l.key] !== false;
                            return (
                              <td key={l.key} style={{ textAlign: "center", padding: "6px 8px" }}>
                                <div onClick={() => toggleAvail(section, index, sp, l.key)} style={{
                                  width: 28, height: 28, borderRadius: 6, margin: "0 auto", cursor: "pointer",
                                  display: "flex", alignItems: "center", justifyContent: "center",
                                  background: on ? (l.custom ? "#e67e22" : "#6DB344") : "#E8E8E8", color: on ? "#fff" : "#ccc",
                                  fontSize: 14, fontWeight: 700, transition: "all 0.15s", userSelect: "none"
                                }}>{on ? "✓" : ""}</div>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  </div>
                  <div style={{ marginTop: 12, padding: "10px 12px", background: "#fff8ed", border: "1px solid #f5d6a5", borderRadius: 6 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#b8740a", letterSpacing: 0.5, textTransform: "uppercase", marginBottom: 6 }}>
                      Custom Lengths (use up your stockpile)
                    </div>
                    <div style={{ fontSize: 11, color: "#7a5910", marginBottom: 8 }}>
                      Add a non-standard length here (e.g. <strong>168</strong> = 14') so the board optimizer considers it as a candidate. Toggle availability per species in the grid above.
                    </div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                      <input
                        type="number"
                        min="1"
                        value={extraLenInput}
                        onChange={e => setExtraLenInput(e.target.value)}
                        placeholder="Length in inches (e.g. 168)"
                        style={{ flex: 1, padding: "8px 10px", border: "1px solid #ddd", borderRadius: 5, fontSize: 13 }}
                      />
                      <button onClick={() => { addExtraLength(section, index, extraLenInput); setExtraLenInput(""); }} style={{
                        padding: "8px 14px", border: "none", borderRadius: 5, background: "#e67e22",
                        color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer"
                      }}>+ Add</button>
                    </div>
                    {itemExtras.length > 0 && (
                      <div style={{ marginTop: 8, fontSize: 11, color: "#7a5910" }}>
                        Currently on hand: {itemExtras.map(l => formatStockLabel(l)).join(", ")}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        };

        const addMaterial = (section, promptLabel, promptWidth) => {
          const name = prompt(promptLabel);
          if (!name) return;
          const width = parseFloat(prompt(promptWidth) || "2.5");
          const code = name.replace(/[^a-zA-Z0-9]/g, "-");
          const arr = [...(catalog[section] || []), { label: name, code, width, pineOnly: false, availability: makeAvailability() }];
          updateCatalog({ ...catalog, [section]: arr });
        };

        return (
          <div style={{ minHeight: "100vh", background: "#F5F5F4", padding: "0 0 40px 0" }}>
            <div style={{
              position: "sticky", top: 0, zIndex: 100, background: "#1C1C1C",
              padding: "max(env(safe-area-inset-top, 0px), 50px) 16px 12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center",

      }

      // ─── OFFSETS ───
      if (view === "offsets") {
        const updateOffset = (section, key, val) => {
          const updated = { ...offsets, [section]: { ...offsets[section], [key]: parseFloat(val) || 0 } };
          setOffsetsState(updated);
          saveOffsetsToAPI(updated);
        };
        const resetSection = (section) => {
          const updated = { ...offsets, [section]: { ...DEFAULT_OFFSETS[section] } };
          setOffsetsState(updated);
          saveOffsetsToAPI(updated);
        };
        const OffsetRow = ({ label, desc, value, onChange }) => (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #E8E8E8", gap: 12 }}>
            <div style={{ flex: 1 }}>
